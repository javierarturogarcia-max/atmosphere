<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Monte Adentro — el juego del niño del campo</title>
  <meta name="description" content="Juego 3D de supervivencia, estrategia y superación: un niño que se cría en el campo aprende a cazar, pescar, buscar en el monte, sembrar su milpa y traer agua y leña a una casa sin luz ni agua corriente.">
  <meta name="theme-color" content="#14100c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/juego.css">
</head>
<body>
  <div id="app">
    <div id="portada">
      <div class="marco">
        <div style="font-size:44px">🌄</div>
        <h1>Monte Adentro</h1>
        <p class="lema">Cargando el valle...</p>
        <noscript><p class="lema" style="color:#e05a4e">Este juego necesita JavaScript y un navegador con WebGL2 o WebGPU.</p></noscript>
      </div>
    </div>
  </div>
  <script type="module" src="./src/juego/main.js"></script>
</body>
</html>
