    if (d.capitulo) {
      this.objetivos.classList.remove('oculto');
      this.tituloCap.textContent = d.capitulo.capitulo.titulo;
      this.subCap.textContent = d.capitulo.capitulo.subtitulo;
      const firma = d.capitulo.objetivos.map((o) => `${o.id}${o.valor}${o.hecho}`).join('|');
      if (firma !== this._firmaObj) {
        this._firmaObj = firma;
        vaciar(this.listaObj);
        for (const o of d.capitulo.objetivos) {
          this.listaObj.appendChild(el('li', { clase: o.hecho ? 'hecho' : '' }, [
            el('div', { clase: 'marca', texto: o.hecho ? '✓' : '' }),
            el('span', { texto: o.texto }),
            el('div', { clase: 'cuenta', texto: o.meta > 1 ? `${o.valor}/${o.meta}` : '' }),
          ]));
        }
      }
    } else {
      this.objetivos.classList.add('oculto');
    }
  }

  /** Menu de acciones a mano. `alElegir(opcion)` se llama al pulsar. */
  mostrarContexto(opciones, alElegir) {
    const firma = opciones.map((o) => o.id + o.etiqueta + (o.desactivada ? '0' : '1')).join('|');
    if (firma === this._ultimoContexto) return;
    this._ultimoContexto = firma;
    vaciar(this.contexto);
    this.contexto.classList.toggle('visible', opciones.length > 0);
    opciones.slice(0, 4).forEach((o, i) => {
      const nodo = el('div', {
        clase: `opcion ${i === 0 ? 'principal' : ''} ${o.desactivada ? 'desactivada' : ''}`,
        alPulsar: () => !o.desactivada && alElegir(o),
      }, [
        el('div', { clase: 'tecla', texto: i === 0 ? 'E' : String(i) }),
        el('div', { texto: `${o.icono || ''} ${o.etiqueta}`.trim() }),
        o.sub ? el('div', { clase: 'sub', texto: o.sub }) : null,
      ]);
      this.contexto.appendChild(nodo);
    });
  }

  ocultarContexto() {
    this._ultimoContexto = '';
    vaciar(this.contexto);
    this.contexto.classList.remove('visible');
  }

    while (this.avisos.children.length > 4) this.avisos.removeChild(this.avisos.firstChild);
    setTimeout(() => {
      nodo.classList.add('saliendo');
      setTimeout(() => nodo.remove(), 400);
    }, duracion);
  }

  visible(si) { this.capa.style.display = si ? '' : 'none'; }
}

    if (r.disponibles.length) {

      for (const c of r.disponibles) {

      el('div', { clase: 'fila-botones' }, [

        boton(`Calidad: ${a.calidad}`, { alPulsar: () => { this.acciones.alAjustar?.('calidad', a.calidad === 'alta' ? 'media' : a.calidad === 'media' ? 'baja' : 'alta'); this.abrir('pausa', this.datos); } }),
        boton(`Motor: ${a.motor}`, { alPulsar: () => { this.acciones.alAjustar?.('motor', a.motor === 'auto' ? 'webgl2' : a.motor === 'webgl2' ? 'webgpu' : 'auto'); this.abrir('pausa', this.datos); } }),
      ]),
      el('div', { clase: 'fila-botones', estilo: 'margin-top:18px' }, [

        texto: 'Teclas: WASD moverse · Shift correr · C agacharse · E interactuar · Espacio acción · I canasta · J diario · Esc pausa. También funciona con mando y con el dedo.',
      })]),

  // ------------------------------------------------------- resumen del dia
  _resumen(d) {
    this.titulo.textContent = `Se acabó el día ${d.parte.dia}`;
    vaciar(this.pestanas);
    const estrellas = '★'.repeat(d.parte.estrellas) + '☆'.repeat(3 - d.parte.estrellas);
    this.cuerpo.appendChild(el('div', { clase: 'resumen-dia' }, [

        cifra(String(Math.round(d.parte.aporte)), 'de aporte'),
        cifra(String(d.hogar.diasSeguidos), 'días seguidos'),
        cifra(String(Math.round(d.hogar.animoFamilia)), 'ánimo de la casa'),
      ]),
      el('div', { clase: 'nota' }, [el('span', { texto: humorFamilia(d.hogar) })]),
      d.aprendido?.length ? el('div', { clase: 'fila-botones', estilo: 'justify-content:center' },
        d.aprendido.map((x) => el('div', { clase: 'pildora', texto: `${x.icono || '✨'} ${x.texto}` }))) : null,
      el('div', { clase: 'fila-botones', estilo: 'justify-content:center;margin-top:6px' }, [
        boton('Amanecer', { clase: 'primario', alPulsar: () => { this.cerrar(); this.acciones.alAmanecer?.(); } }),
      ]),

  _fin(d) {

__def("src/juego/ui/dialogo.js", function (__exp, __req) {
/**
 * dialogo.js — La caja de dialogo, con texto que se escribe solo.
 *
 * Se usa para la historia (intros y cierres de capitulo) y para lo que dice la
 * gente de la casa al pasar. Cualquier tecla o toque adelanta; si el texto
 * todavia se esta escribiendo, lo termina de golpe.
 */
const { el, vaciar } = __req("src/juego/ui/base.js");
const { PERSONAJES } = __req("src/juego/contenido/capitulos.js");

const VELOCIDAD = 34;   // caracteres por segundo

class Dialogo {
  constructor(raiz) {
    this.quien = el('div', { clase: 'quien' });
    this.texto = el('div', { clase: 'texto' });
    this.puntos = el('div', { clase: 'puntos' });
    this.pie = el('div', { clase: 'pie' }, [
      el('span', { texto: 'Pulsá para seguir' }),
      this.puntos,
    ]);
    this.caja = el('div', { clase: 'tarjeta', id: 'dialogo' }, [this.quien, this.texto, this.pie]);
    this.caja.addEventListener('click', () => this.avanzar());
    raiz.appendChild(this.caja);
    this.lineas = [];
    this.indice = 0;
    this.escrito = 0;
    this.alTerminar = null;
  }

  get activo() { return this.lineas.length > 0; }

  mostrar(lineas, alTerminar) {
    if (!lineas || !lineas.length) { alTerminar?.(); return; }
    this.lineas = lineas.slice();
    this.indice = 0;
    this.escrito = 0;
    this.alTerminar = alTerminar;
    this.caja.classList.add('visible');
    this._pintar();
  }

  _pintar() {
    const l = this.lineas[this.indice];
    if (!l) return;
    const p = PERSONAJES[l.quien] || { nombre: '', color: '#cfd8e3' };
    vaciar(this.quien);
    if (p.nombre) {
      this.quien.append(
        el('div', { clase: 'ficha', texto: p.nombre[0], estilo: `background:${p.color}` }),
        el('span', { texto: p.nombre, estilo: `color:${p.color}` }),
      );
    }
    vaciar(this.puntos);
    for (let i = 0; i < this.lineas.length; i++) {
      this.puntos.appendChild(el('div', { clase: `punto ${i <= this.indice ? 'activo' : ''}` }));
    }
    this.texto.textContent = '';
  }

  /** Se llama desde el bucle: escribe el texto poco a poco. */
  actualizar(dt) {
    if (!this.activo) return;
    const l = this.lineas[this.indice];
    if (!l) return;
    if (this.escrito < l.texto.length) {
      this.escrito = Math.min(l.texto.length, this.escrito + dt * VELOCIDAD);
      this.texto.textContent = l.texto.slice(0, Math.floor(this.escrito));
    }
  }

  avanzar() {
    if (!this.activo) return false;
    const l = this.lineas[this.indice];
    if (this.escrito < l.texto.length) {
      this.escrito = l.texto.length;
      this.texto.textContent = l.texto;
      return true;
    }
    this.indice++;
    this.escrito = 0;
    if (this.indice >= this.lineas.length) {
      this.cerrar();
      this.alTerminar?.();
      return true;
    }
    this._pintar();
    return true;
  }

  cerrar() {
    this.lineas = [];
    this.indice = 0;
    this.caja.classList.remove('visible');
  }
}

  __exp.Dialogo = Dialogo;
});

__def("src/juego/ui/minijuegos.js", function (__exp, __req) {
/**
 * minijuegos.js — Los momentos de accion: el pulso con el pez, el tiro con la
 * hondilla y el hacha rajando lena.
 *
 * Cada uno se abre con `iniciar*`, se avanza desde el bucle con `actualizar` y
 * avisa por callback cuando termina. La logica de reglas vive en reglas/pesca.js
 * y reglas/caza.js; aqui solo esta la presentacion y la lectura del mando.
 */
const { el, vaciar, pct } = __req("src/juego/ui/base.js");
const { avanzarLance, cobrar } = __req("src/juego/reglas/pesca.js");
const { posicionMira, disparar, probabilidadEstimada } = __req("src/juego/reglas/caza.js");
const { limitar } = __req("src/juego/nucleo/mate.js");

class Minijuegos {
  constructor(raiz) {
    this.capa = el('div', { id: 'minijuego' });
    this.panel = el('div', { clase: 'tarjeta panel-mini' });
    this.mira = el('div', { clase: 'mira' });
    this.capa.append(this.mira, this.panel);
    raiz.appendChild(this.capa);
    this.modo = null;
  }

  get activo() { return !!this.modo; }

  _abrir(modo) {
    this.modo = modo;
    this.capa.classList.add('visible');
    vaciar(this.panel);
    vaciar(this.mira);
  }

  cerrar() {
    this.modo = null;
    this.capa.classList.remove('visible');
    vaciar(this.panel);
    vaciar(this.mira);
  }

  // ------------------------------------------------------------- pesca
  iniciarPesca(lance, alTerminar) {
    this._abrir('pesca');
    this.lance = lance;
    this.alTerminar = alTerminar;
    this.tituloMini = el('div', { clase: 'titulo', texto: 'Esperando que pique...' });
    this.ayuda = el('div', { clase: 'ayuda', texto: 'Cuando pique, pulsá para clavar el anzuelo.' });
    this.rellenoTension = el('div', { clase: 'relleno', estilo: 'width:0%' });
    this.rellenoProgreso = el('div', { clase: 'relleno', estilo: 'width:0%' });
    this.panel.append(
      this.tituloMini, this.ayuda,
      el('div', { clase: 'etiquetas' }, [el('span', { texto: 'Tensión de la línea' }), el('span', { texto: '¡No la revientes!' })]),
      el('div', { clase: 'medidor tension' }, [this.rellenoTension]),
      el('div', { clase: 'etiquetas' }, [el('span', { texto: 'Pez acercándose' }), el('span', { texto: '' })]),
      el('div', { clase: 'medidor progreso' }, [this.rellenoProgreso]),
    );
  }

  // -------------------------------------------------------------- caza
  iniciarCaza(apuntado, animal, alTerminar) {
    this._abrir('caza');
    this.apuntado = apuntado;
    this.animal = animal;
    this.alTerminar = alTerminar;
    this.tiempoMini = 0;
    this.mira.innerHTML = `<svg viewBox="0 0 96 96" width="96" height="96">
      <circle cx="48" cy="48" r="30" fill="none" stroke="rgba(246,239,227,.5)" stroke-width="1.5" stroke-dasharray="6 8"/>
      <circle cx="48" cy="48" r="3" fill="rgba(246,239,227,.9)"/>
      <path d="M48 10v12M48 74v12M10 48h12M74 48h12" stroke="rgba(246,239,227,.75)" stroke-width="2" stroke-linecap="round"/>
    </svg>`;
    const prob = probabilidadEstimada(apuntado, animal.perfil);
    this.tituloMini = el('div', { clase: 'titulo', texto: `Apuntando al ${animal.perfil.nombre}` });
    this.ayuda = el('div', { clase: 'ayuda',
      texto: `A ${apuntado.distancia.toFixed(0)} m · ${prob > 0.7 ? 'buen tiro' : prob > 0.4 ? 'tiro justo' : 'muy lejos'}. Soltá cuando la mira esté en el centro.` });
    this.panel.append(this.tituloMini, this.ayuda,
      el('div', { clase: 'etiquetas' }, [el('span', { texto: 'Pulso' }), el('span', { texto: apuntado.deriva > 0.25 ? '🌬️ el viento desvía' : 'sin viento' })]),
      el('div', { clase: 'medidor progreso' }, [el('div', { clase: 'relleno', estilo: `width:${pct(prob)}` })]),
      el('div', { clase: 'ayuda', estilo: 'margin:8px 0 0', texto: 'Espacio o el botón para tirar · Esc para dejarlo' }));
  }

  // -------------------------------------------------------------- lena
  iniciarLena(golpes, alTerminar) {
    this._abrir('lena');
    this.golpes = golpes;
    this.dados = 0;
    this.aciertos = 0;
    this.marcador = 0;
    this.direccion = 1;
    this.alTerminar = alTerminar;
    this.marca = el('div', { clase: 'marca', estilo: 'left:0%' });
    this.tituloMini = el('div', { clase: 'titulo', texto: 'Rajando leña' });
    this.ayuda = el('div', { clase: 'ayuda', texto: 'Pulsá cuando la marca pase por la zona verde.' });
    this.panel.append(this.tituloMini, this.ayuda,
      el('div', { clase: 'medidor' }, [
        el('div', { clase: 'zona', estilo: 'left:42%;width:16%' }),
        this.marca,
      ]));
  }

  /**
   * Avanza el minijuego activo.
   * @param {number} dt
   * @param {object} mando {accion: bool mantenido, pulso: bool recien pulsado, cancelar}
   */
  actualizar(dt, mando) {
    if (!this.modo) return;
    if (mando.cancelar) { const r = { cancelado: true }; this._fin(r); return; }

    if (this.modo === 'pesca') {
      const l = this.lance;
      const antes = l.estado;
      avanzarLance(l, dt, mando.accion, mando.pulso);
      if (l.estado !== antes) {
        if (l.estado === 'picando') {
          this.tituloMini.textContent = '¡PICÓ!';
          this.tituloMini.classList.add('picada');
          this.ayuda.textContent = 'Pulsá ya para clavar.';
        } else if (l.estado === 'luchando') {
          this.tituloMini.classList.remove('picada');
          this.tituloMini.textContent = `Peleando con un ${l.pez.nombre.toLowerCase()}`;
          this.ayuda.textContent = 'Mantené pulsado para recoger; soltá cuando la tensión suba.';
        }
      }
      this.rellenoTension.style.width = pct(l.tension);
      this.rellenoProgreso.style.width = pct(l.progreso);
      if (['cobrado', 'roto', 'escapado', 'fallado'].includes(l.estado)) {
        this._fin(l.estado === 'cobrado' ? { ...cobrar(l), ok: true } : { ok: false, texto: l.motivo || 'Se escapó.' });
      }
      return;
    }

    if (this.modo === 'caza') {
      this.tiempoMini += dt;
      const m = posicionMira(this.apuntado, this.tiempoMini);
      const escala = 34;
      this.mira.style.transform = `translate(${m.x * escala}px, ${m.y * escala}px)`;
      if (mando.pulso) {
        const tiro = disparar(this.apuntado, this.tiempoMini);
        this._fin({ disparo: true, ...tiro });
      } else if (this.tiempoMini > 9) {
        this._fin({ ok: false, texto: 'Se te fue el tiempo y el animal se movió.' });
      }
      return;
    }

    if (this.modo === 'lena') {
      this.marcador += this.direccion * dt * 1.35;
      if (this.marcador > 1) { this.marcador = 1; this.direccion = -1; }
      if (this.marcador < 0) { this.marcador = 0; this.direccion = 1; }
      this.marca.style.left = pct(this.marcador);
      if (mando.pulso) {
        const bueno = this.marcador > 0.42 && this.marcador < 0.58;
        if (bueno) this.aciertos++;
        this.dados++;
        this.tituloMini.textContent = bueno ? '¡Buen hachazo!' : 'Se te fue el golpe';
        if (this.dados >= this.golpes) {
          this._fin({ ok: true, aciertos: this.aciertos, golpes: this.golpes });
        }
      }
      return;
    }
  }

  _fin(resultado) {
    const cb = this.alTerminar;
    this.cerrar();
    cb?.(resultado);
  }
}

  __exp.Minijuegos = Minijuegos;
});

__def("src/juego/ui/tacto.js", function (__exp, __req) {
/**
 * tacto.js — Botones grandes para jugar con el dedo.
 *
 * Aparecen solos cuando el aparato es tactil. La palanca de la izquierda la
 * gestiona nucleo/entrada.js (cualquier dedo en la mitad izquierda); aqui solo
 * estan los botones y la guia visual.

class Tacto {

      });

  /** Cambio de dia por medianoche (sin dormir): pasa igual, pero se nota. */
  _nuevoDia() {
    this.estado.dia = this.reloj.dia;
    this._cerrarDia({ durmiendo: false });
  }

  _cerrarDia({ durmiendo }) {
    const e = this.estado;

    contar(e, 'dormir');
    this.jugador.x = LUGARES.casa.x + 2.5;
    this.jugador.z = LUGARES.casa.z + 5;
    this._cerrarDia({ durmiendo: true });
  }

  // ---------------------------------------------------------- interaccion
  _interacciones(dt) {
    const ctx = this._contexto();
    this.opciones = interaccionesCerca(ctx);
    this.hud.mostrarContexto(this.opciones, (op) => this.hacer(op));
    this.tacto.iconoAccion(this.opciones[0]?.icono || '⚡');
  }

  _contexto() {
    return {
      estado: this.estado,
      terreno: this.terreno,
      fauna: this.fauna,
      recursos: this.reparto.recursos,
      jugador: this.jugador,
      clima: this.clima,
      hora: this.reloj.hora,
      dia: this.reloj.dia,
      mes: mesDe(this.reloj.dia),
      sabe: conocimientos(this.estado),
      lluviaReciente: this.lluviaReciente || this.clima.lluvia > 0.1,
      rnd: Math.random,
    };
  }

  _teclas() {
    const t = this.entrada;
    if (t.consumir('interactuar') && this.opciones.length) {
      const primera = this.opciones.find((o) => !o.desactivada);
      if (primera) this.hacer(primera);
    }
    for (let i = 1; i <= 3; i++) {
      if (t.consumir(String(i))) {
        const op = this.opciones[i];
        if (op && !op.desactivada) this.hacer(op);
      }
    }
    if (t.consumir('inventario')) this.abrirPanel('inventario');
    if (t.consumir('diario')) this.abrirPanel('diario');
    if (t.consumir('pausa')) this.abrirPanel('pausa');
    if (t.consumir('accion') && this.opciones.length) {
      const primera = this.opciones.find((o) => !o.desactivada);
      if (primera) this.hacer(primera);
    }
  }

  /** Ejecuta una opcion del menu de contexto. */
  hacer(op) {
    if (!op) return;
    const e = this.estado;
    if (op.menu) {
      if (op.menu === 'sembrar') this.cuadroElegido = op.objetivo;
      this.abrirPanel(op.menu);
      return;
    }
    const ctx = this._contexto();
    const r = ejecutar(op, ctx);
    this._aplicar(r, op);
  }

  _aplicar(r, op) {
    const e = this.estado;
    if (!r) return;
    if (r.dormir) { this.dormir(); return; }
    // Pesca, caza y atarraya SON el minijuego: no dan nada por si mismas.
    // Rajar lena, en cambio, ya rinde y el minijuego solo anade el extra por
    // buen pulso, asi que primero se cobra lo seguro.
    if (r.minijuego && !r.objetos) { this._abrirMinijuego(r.minijuego, op); return; }
    if (!r.ok) { this.hud.aviso(r.texto || 'No se pudo.', 'malo'); return; }

    // objetos
    let sobra = 0;
    for (const o of r.objetos || []) {
      const res = agregar(e.jugador.inventario, o.id, o.cantidad, nivel(e.jugador.habilidades, 'fuerza'));
      sobra += res.rechazado;
    }
    if (sobra > 0) this.hud.aviso('No te cabe todo: vas muy cargado.', 'malo');

    // entregas a la casa
    if (r.entregas) {
      for (const x of r.entregas) {
        const o = OBJETOS[x.id];
        const categoria = o?.tipo === 'comida' || o?.tipo === 'crudo' ? 'alimento' : o?.tipo;
        contarEntrega(e, x.id, x.cantidad, categoria);
      }
      this.hud.aviso(`${r.texto} (+${Math.round(r.aporte)} de aporte)`, 'bueno');
    } else if (r.texto) {
      this.hud.aviso(r.texto, 'bueno');
    }

    if (r.contador) contar(e, r.contador);
    if (r.cultivo) contarCultivo(e, r.cultivo);
    if (r.xp && r.habilidad) this._ganarXP(r.habilidad, r.xp);
    if (r.tiempo) this._pasarMinutos(r.tiempo, r.actividad);
    this._comprobarCapitulo();
    if (r.minijuego) this._abrirMinijuego(r.minijuego, op);
  }

  _ganarXP(habilidad, xp) {
    const res = ganar(this.estado.jugador.habilidades, habilidad, xp);
    if (res.subio) {
      this.hud.aviso(`¡${habilidad} nivel ${res.nivel}!`, 'premio', 5200);
      for (const d of res.desbloqueos) this.hud.aviso(`Ahora sabés: ${d.texto}`, 'premio', 6200);
    }
  }

  /** Adelanta el reloj por una tarea que lleva su tiempo. */
  _pasarMinutos(minutos, actividad = 'trabajar') {
    const horas = minutos / 60;
    this.reloj.hora += horas;
    while (this.reloj.hora >= 24) { this.reloj.hora -= 24; this.reloj.dia++; this._nuevoDia(); }
    actualizarNecesidades(this.estado.jugador.necesidades, horas, {
      actividad, temperatura: this.clima.temperatura, cargaRelativa: cargaRelativa(this.estado),
    });
  }

  // --------------------------------------------------------- minijuegos
  _abrirMinijuego(tipo, op) {
    const e = this.estado;
    const hab = e.jugador.habilidades;
    if (tipo === 'pesca') {
      const punto = this._puntoPescaCercano();
      this.jugadorPose = 'pescar';
      const lance = crearLance({
        hondura: punto?.hondura ?? 0.3, hora: this.reloj.hora, lluvia: this.clima.lluvia,
        cebo: conocimientos(e).has('cebo'), bono: bono(hab, 'pesca'),
      }, Math.random);
      this.minijuegos.iniciarPesca(lance, (res) => {
        this.jugadorPose = null;
        if (res.cancelado) return;
        if (res.ok) {
          for (const o of res.objetos) agregar(e.jugador.inventario, o.id, o.cantidad, nivel(hab, 'fuerza'));
          contar(e, 'pescar');
          this.hud.aviso(`¡${res.texto}!`, 'bueno', 4200);
          this._ganarXP('pesca', res.xp);
        } else {
          this.hud.aviso(res.texto || 'Se escapó.', 'malo');
          this._ganarXP('pesca', 2);
        }
        this._pasarMinutos(18, 'trabajar');
        this._comprobarCapitulo();
      });
      return;
    }
    if (tipo === 'atarraya') {
      const punto = this._puntoPescaCercano();
      const res = tirarAtarraya({ hondura: punto?.hondura ?? 0.3, hora: this.reloj.hora,
        lluvia: this.clima.lluvia, bono: bono(hab, 'pesca') }, Math.random);
      for (const o of res.objetos) agregar(e.jugador.inventario, o.id, o.cantidad, nivel(hab, 'fuerza'));
      if (res.ok) {
        contar(e, 'pescar', res.capturas.length);
        this.hud.aviso(`La atarraya trajo ${res.capturas.length} peces.`, 'bueno');
      } else this.hud.aviso('La atarraya salió vacía.', 'malo');
      this._ganarXP('pesca', res.xp);
      this.estado.jugador.necesidades.aguante = limitar(this.estado.jugador.necesidades.aguante - res.aguante, 0, 100);
      this._pasarMinutos(20, 'trabajar');
      this._comprobarCapitulo();
      return;
    }
    if (tipo === 'caza') {
      const animal = op.objetivo;
      const distancia = Math.hypot(animal.x - this.jugador.x, animal.z - this.jugador.z);
      const pen = penalizaciones(e.jugador.necesidades);
      this.jugadorPose = 'apuntar';
      const arma = conocimientos(e).has('tiro_largo') ? 'hondilla_larga' : 'hondilla';
      const ap = crearApuntado({
        arma, distancia, bono: bono(hab, 'caza'), punteria: pen.punteria,
        viento: this.clima.viento, agachado: this.jugador.agachado, fase: Math.random() * TAU,
      });
      this.camara.fovDeseado = 40 * (Math.PI / 180);
      this.minijuegos.iniciarCaza(ap, animal, (res) => {
        this.jugadorPose = null;
        this.camara.fovDeseado = 58 * (Math.PI / 180);
        if (res.cancelado) return;
        if (!res.disparo) { this.hud.aviso(res.texto || 'No tiraste.', 'malo'); return; }
        quitar(e.jugador.inventario, 'piedra', 1);
        const tiro = resolverTiro({
          animal: animal.perfil, desvio: res.desvio, distancia, arma,
          bono: bono(hab, 'caza'), rnd: Math.random,
        });
        this.hud.aviso(tiro.texto, tiro.limpio ? 'bueno' : 'malo', 4600);
        if (tiro.limpio && tiro.presa) {
          const presa = this.fauna.cobrar(animal);
          agregar(e.jugador.inventario, presa.objeto, presa.cantidad, nivel(hab, 'fuerza'));
          if (conocimientos(e).has('destazar') && animal.tipo === 'venado') {
            agregar(e.jugador.inventario, 'cuero', 1, nivel(hab, 'fuerza'));
          }
          contar(e, 'cazar');
        } else {
          animal.sospecha = 1.3;
          animal.estado = 'huir';
          animal.temporizador = 5;
        }
        this._ganarXP('caza', tiro.xp);
        this._pasarMinutos(12, 'trabajar');
        this._comprobarCapitulo();
      });
      return;
    }
    if (tipo === 'lena') {
      this.jugadorPose = 'trabajar';
      this.minijuegos.iniciarLena(3, (res) => {
        this.jugadorPose = null;
        if (res.cancelado) return;
        const extra = res.aciertos;
        if (extra > 0) {
          agregar(e.jugador.inventario, 'lena', extra, nivel(hab, 'fuerza'));
          this.hud.aviso(`${extra} leña${extra > 1 ? 's' : ''} de más por los buenos golpes.`, 'bueno');
        }
        this._ganarXP('fuerza', 3 + extra * 2);
        this._comprobarCapitulo();
      });
    }
  }

  _puntoPescaCercano() {
    let mejor = null, mejorD = 1e9;
    for (const p of this.puntosPesca) {
      const d = Math.hypot(p.x - this.jugador.x, p.z - this.jugador.z);
      if (d < mejorD) { mejorD = d; mejor = p; }
    }
    return mejorD < 26 ? mejor : null;
  }

  // -------------------------------------------------------------- paneles
  abrirPanel(tipo) {
    const e = this.estado;
    this.paneles.abrir(tipo, {
      estado: e,
      nivelFuerza: nivel(e.jugador.habilidades, 'fuerza'),
      sabe: conocimientos(e),
      progreso: resumenCapitulos(e),
      estacion: estacionDe(this.reloj.dia),
      motor: this.renderizador.nombre,
    });
  }

  _accionesPanel() {
    return {
      alCerrar: () => this.entrada.limpiar(),
      alComer: (id) => {
        const e = this.estado;
        if (!cuenta(e.jugador.inventario, id)) return;
        quitar(e.jugador.inventario, id, 1);
        comerNec(e.jugador.necesidades, OBJETOS[id]);
        this.hud.aviso(`Te comiste: ${OBJETOS[id].nombre}`, 'bueno');
      },
      alTomar: (id) => {
        const e = this.estado;
        transferir(e.hogar.despensa, e.jugador.inventario, id, 1, nivel(e.jugador.habilidades, 'fuerza'));
      },
      alCocinar: (idReceta) => {
        const e = this.estado;
        const r = cocinar(idReceta, e.jugador.inventario, {
          sabe: conocimientos(e), despensa: e.hogar.despensa,
          nivelFuerza: nivel(e.jugador.habilidades, 'fuerza'),
        });
        if (!r.ok) { this.hud.aviso(r.motivo || 'Faltan cosas.', 'malo'); return; }
        contarReceta(e, idReceta);
        this._ganarXP('oficio', r.xp);
        this._pasarMinutos(r.minutos, 'trabajar');
        this.hud.aviso(`Hiciste ${r.texto}`, 'bueno');
        this._comprobarCapitulo();
      },
      alSembrar: (idCultivo) => {
        if (!this.cuadroElegido) return;
        this.hacer({ id: 'sembrar', objetivo: this.cuadroElegido, cultivo: idCultivo });
        this.cuadroElegido = null;
      },
      alEmpezarCapitulo: (id) => {
        const cap = activarCapitulo(this.estado, id);
        if (cap.ok) this.dialogo.mostrar(cap.capitulo.intro, () => this.guardar());
      },
      alAjustar: (clave, valor) => {
        this.estado.ajustes[clave] = valor;
        this.guardar();
        if (clave === 'motor' || clave === 'sombras' || clave === 'calidad') {
          this.hud.aviso('Se aplica al volver a entrar al juego.', 'neutro', 5000);
        }
      },
      alGuardar: () => { this.guardar(); this.hud.aviso('Partida guardada.', 'bueno'); },
      alReiniciar: () => { if (confirm('¿Empezar de nuevo? Se pierde la partida.')) this.alSalir?.('nueva'); },
      alAmanecer: () => { this.hud.aviso(suceso('amanecer'), 'neutro', 4200); },
    };
  }

  // --------------------------------------------------------------- dibujo
  dibujar(dt) {
    const e = this.estado;
    const cielo = estadoCielo(this.reloj.hora, this.clima);
    const j = this.jugador;

    this.escena.reiniciarDinamicos();
    this.mundo3d.emitirMilpa(e.cuadros);
    this.mundo3d.emitirFauna(this.fauna);
    this.mundo3d.emitirPerro(this.perro);
    this.mundo3d.emitirSenales(this._marcadores());
    this.mundo3d.emitirParticulas({
      dt, camara: this.camara, clima: this.clima, hora: this.reloj.hora,
      fogonEncendido: this.reloj.esNoche || this.clima.lluvia > 0.3,
    });
    this.mundo3d.emitirChispas(dt);

    this.personaje.actualizar(dt, {
      x: j.x, y: j.y, z: j.z, rumbo: j.rumbo, velocidad: j.velocidad,
      agachado: j.agachado, nadando: j.nadando, pose: this.jugadorPose || j.pose,
      carga: cargaRelativa(e),
    });
    this.personaje.emitir();

    matrizSombra([j.x, j.y, j.z], cielo.dirSol, 38, this.luzProy);
    this.renderizador.dibujar(this.escena, {
      camara: this.camara, cielo, tiempo: this.tiempoRender, luzProy: this.luzProy,
      viento: this.vientoSuave, agitacion: limitar(0.2 + this.clima.lluvia * 0.7, 0, 1),
    });

    this.hud.actualizar({
      reloj: this.reloj, dia: this.reloj.dia, clima: this.clima,
      necesidades: e.jugador.necesidades,
      peso: peso(e.jugador.inventario),
      cargaMaxima: cargaMaxima(e.jugador.inventario, nivel(e.jugador.habilidades, 'fuerza')),
      capitulo: capituloActivo(e) ? { capitulo: capituloActivo(e), ...evaluarCapitulo(capituloActivo(e), e) } : null,
    });
    this.dialogo.actualizar(dt);
  }

  /** Banderas que apuntan a donde hay que ir para el objetivo activo. */
  _marcadores() {
    const cap = capituloActivo(this.estado);
    if (!cap) return [];
    const ev = evaluarCapitulo(cap, this.estado);
    const sitios = [];
    for (const o of ev.objetivos) {
      if (o.hecho) continue;
      const def = cap.objetivos.find((x) => x.id === o.id);
      if (!def) continue;
      if (def.tipo === 'entregar' || def.tipo === 'entregarCategoria') sitios.push(LUGARES.casa);
      else if (def.accion === 'pescar' || def.objeto === 'agua') sitios.push(LUGARES.poza);
      else if (def.accion === 'buscar' || def.accion === 'cazar') sitios.push(LUGARES.monte);
      else if (['sembrar', 'regar', 'cosechar'].includes(def.accion) || def.tipo === 'sembrar' || def.tipo === 'cosechar') sitios.push(LUGARES.milpa);
      else if (def.tipo === 'cocinar') sitios.push(LUGARES.fogon);
    }
    // Solo se marca lo que esta lejos: de cerca estorba.
    return sitios.filter((s) => Math.hypot(s.x - this.jugador.x, s.z - this.jugador.z) > 14).slice(0, 2);
  }

  // -------------------------------------------------------------- guardado
  guardar() {
    const e = this.estado;
    e.dia = this.reloj.dia;
    e.hora = this.reloj.hora;
    e.jugador.x = this.jugador.x;
    e.jugador.z = this.jugador.z;
    e.jugador.rumbo = this.jugador.rumbo;
    guardar(e);
  }

  destruir() {
    this.bucle?.parar();
    this.entrada?.destruir();
    this.renderizador?.destruir();
  }
}
