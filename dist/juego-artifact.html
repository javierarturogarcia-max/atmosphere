__def("src/juego/reglas/cultivo.js", function (__exp, __req) {
/**
 * cultivo.js — La milpa: sembrar, regar, deshierbar y cosechar.
 *
 * Un cuadro guarda humedad, maleza y plaga. Cada dia el sol seca, la lluvia
 * moja, la maleza roba agua y la plaga come. La cosecha no es un numero fijo:
 * sale de como se cuido el cuadro, dia a dia. Por eso conviene sembrar poco y
 * atenderlo, en vez de sembrar todo y abandonarlo.
 */
const { CULTIVOS, ETAPAS } = __req("src/juego/contenido/cultivos.js");
const { limitar, mezclar } = __req("src/juego/nucleo/mate.js");

function crearCuadro(id, x = 0, y = 0, z = 0) {
  return {
    id, x, y, z,
    cultivo: null, diaSiembra: 0, edad: 0,
    humedad: 0.35, maleza: 0, plaga: 0, salud: 1,
    arado: false, abonado: false, cosechado: 0,
  };
}

function sembrar(cuadro, idCultivo, dia) {
  const c = CULTIVOS[idCultivo];
  if (!c) return { ok: false, motivo: 'Ese cultivo no existe.' };
  if (cuadro.cultivo) return { ok: false, motivo: 'Ese cuadro ya está sembrado.' };
  if (!cuadro.arado) return { ok: false, motivo: 'Hay que arar el cuadro antes de sembrar.' };
  cuadro.cultivo = idCultivo;
  cuadro.diaSiembra = dia;
  cuadro.edad = 0;
  cuadro.salud = 1;
  cuadro.maleza = 0;
  cuadro.plaga = 0;
  return { ok: true, cultivo: c };
}

function arar(cuadro) {
  if (cuadro.cultivo) return { ok: false, motivo: 'Primero hay que cosechar o limpiar.' };
  cuadro.arado = true;
  cuadro.maleza = 0;
  return { ok: true };
}

function regar(cuadro, litros = 1, conRiego = false) {
  const antes = cuadro.humedad;
  cuadro.humedad = limitar(cuadro.humedad + litros * (conRiego ? 0.14 : 0.08), 0, 1.35);
  return { ok: true, ganado: cuadro.humedad - antes };
}

function deshierbar(cuadro) {
  const habia = cuadro.maleza;
  cuadro.maleza = 0;
  return { ok: true, quitado: habia };
}

function abonar(cuadro) {
  if (cuadro.abonado) return { ok: false, motivo: 'Ese cuadro ya lleva ceniza.' };
  cuadro.abonado = true;
  return { ok: true };
}

/**
 * Un dia de vida del cuadro.
 * @param {object} cuadro
 * @param {object} ctx {agua: 0..2 (lluvia del dia), calor, estacion, rnd}
 */
function avanzarDia(cuadro, ctx = {}) {
  const rnd = ctx.rnd || Math.random;
  const agua = ctx.agua ?? 0;
  const calor = limitar(((ctx.temperatura ?? 26) - 20) / 14, 0, 1.2);

  // Balance de agua del dia: entra la lluvia, sale la evaporacion.
  cuadro.humedad = limitar(cuadro.humedad + agua * 0.55 - (0.08 + calor * 0.10), 0, 1.35);
  if (!cuadro.cultivo) {
    // La tierra en descanso se enmaleza igual, y el arado se pierde.
    cuadro.maleza = limitar(cuadro.maleza + 0.12 + agua * 0.05, 0, 1);
    if (cuadro.maleza > 0.5) cuadro.arado = false;
    return { etapa: null };
  }

  const c = CULTIVOS[cuadro.cultivo];
  cuadro.maleza = limitar(cuadro.maleza + 0.07 + agua * 0.06, 0, 1);
  // La plaga aparece con calor y humedad, y crece si nadie la corta.
  if (rnd() < 0.06 + calor * 0.05 + cuadro.humedad * 0.04) {
    cuadro.plaga = limitar(cuadro.plaga + 0.18, 0, 1);
  }

  // Estres hidrico: falta o exceso de agua, corregido por la resistencia.
  const necesidad = c.aguaDia;
  const disponible = cuadro.humedad / Math.max(necesidad, 0.05);
  let estres = 0;
  if (disponible < 1) estres = (1 - disponible) * (1 - c.resistencia * 0.7);
  else if (disponible > 2.6) estres = (disponible - 2.6) * 0.35;
  estres += cuadro.maleza * 0.35 + cuadro.plaga * 0.45;
  if (ctx.estacion && !c.estaciones.includes(ctx.estacion)) estres += 0.16;

  // La planta aguanta: se resiente poco a poco y se repone si se la atiende.
  cuadro.salud = limitar(cuadro.salud - estres * 0.11 + (estres < 0.15 ? 0.07 : 0), 0, 1);
  cuadro.humedad = limitar(cuadro.humedad - necesidad * 0.30, 0, 1.35);

  // El crecimiento se frena si la planta lo esta pasando mal.
  const ritmo = mezclar(0.45, 1.12, cuadro.salud) * (cuadro.abonado ? 1.12 : 1);
  cuadro.edad += ritmo;

  return { etapa: etapaDe(cuadro), estres, salud: cuadro.salud };
}

/** Etapa visible del cuadro, de 'sembrado' a 'pasado'. */
function etapaDe(cuadro) {
  if (!cuadro.cultivo) return null;
  const c = CULTIVOS[cuadro.cultivo];
  const t = cuadro.edad / c.dias;
  if (cuadro.salud <= 0.02) return 'perdido';
  if (t < 0.12) return 'sembrado';
  if (t < 0.38) return 'brote';
  if (t < 0.68) return 'crecimiento';
  if (t < 0.95) return 'floración';
  if (t < 1.55) return 'maduro';
  return 'pasado';
}

/** Indice 0..3 de la malla que hay que dibujar en el cuadro. */
function etapaVisual(cuadro) {
  const e = etapaDe(cuadro);
  return { sembrado: 0, brote: 0, crecimiento: 1, 'floración': 2, maduro: 3, pasado: 3, perdido: 0 }[e] ?? 0;
}

function listoParaCosechar(cuadro) {
  return etapaDe(cuadro) === 'maduro';
}

/**
 * Cosecha el cuadro.
 * @returns {{ok, grano, cantidad, semillas, calidad}}
 */
function cosechar(cuadro, { bonoSiembra = 1, rnd = Math.random } = {}) {
  const etapa = etapaDe(cuadro);
  if (!cuadro.cultivo) return { ok: false, motivo: 'Aquí no hay nada sembrado.' };
  if (etapa === 'perdido') {
    limpiar(cuadro);
    return { ok: true, grano: null, cantidad: 0, semillas: 0, calidad: 0, motivo: 'La siembra se perdió.' };
  }
  if (etapa !== 'maduro' && etapa !== 'pasado') {
    return { ok: false, motivo: 'Todavía no está de cosecha.' };
  }
  const c = CULTIVOS[cuadro.cultivo];
  const castigoPasado = etapa === 'pasado' ? 0.55 : 1;
  const calidad = limitar(cuadro.salud * castigoPasado * bonoSiembra, 0, 1.3);
  const base = mezclar(c.rendimiento[0], c.rendimiento[1], calidad);
  const cantidad = Math.max(0, Math.round(base + (rnd() - 0.5)));
  const semillas = Math.round(mezclar(c.semillasExtra[0], c.semillasExtra[1], calidad));
  const grano = c.grano;
  limpiar(cuadro);
  cuadro.cosechado++;
  return { ok: true, grano, cantidad, semillas, semilla: c.semilla, calidad, cultivo: c };
}

function limpiar(cuadro) {
  cuadro.cultivo = null;
  cuadro.edad = 0;
  cuadro.plaga = 0;
  cuadro.salud = 1;
  cuadro.arado = false;
  cuadro.abonado = false;
}

/** Que le hace falta al cuadro ahora mismo, en una linea. */
function diagnostico(cuadro) {
  if (!cuadro.cultivo) return cuadro.arado ? 'Arado y listo para sembrar' : 'Tierra sin arar';
  const c = CULTIVOS[cuadro.cultivo];
  const etapa = etapaDe(cuadro);
  if (etapa === 'perdido') return `${c.nombre}: se perdió`;
  const avisos = [];
  if (cuadro.humedad < c.aguaDia * 0.8) avisos.push('sed');
  if (cuadro.maleza > 0.45) avisos.push('maleza');
  if (cuadro.plaga > 0.3) avisos.push('plaga');
  const estado = avisos.length ? ` — ${avisos.join(', ')}` : '';
  return `${c.nombre}: ${etapa}${estado}`;
}

  __exp.crearCuadro = crearCuadro;
  __exp.sembrar = sembrar;
  __exp.arar = arar;
  __exp.regar = regar;
  __exp.deshierbar = deshierbar;
  __exp.abonar = abonar;
  __exp.avanzarDia = avanzarDia;
  __exp.etapaDe = etapaDe;
  __exp.etapaVisual = etapaVisual;
  __exp.listoParaCosechar = listoParaCosechar;
  __exp.cosechar = cosechar;
  __exp.limpiar = limpiar;
  __exp.diagnostico = diagnostico;
});

__def("src/juego/vista/mundo3d.js", function (__exp, __req) {
/**
 * mundo3d.js — Convierte el valle simulado en lo que se ve.
 *
 * Separa lo estatico (terreno, agua, arboles, casa: se sube a la GPU una vez)
 * de lo dinamico (fauna, milpa, lluvia, fuego, luciernagas: se rehace cada
 * cuadro). Esa division es lo que permite tener un monte entero delante sin

      cana: escena.lote('util_cana', utiles.cana, { capacidad: 2 }),
      machete: escena.lote('util_machete', utiles.machete, { capacidad: 2 }),
      balde: escena.lote('util_balde', utiles.balde, { capacidad: 2 }),
    };
    this.m = m4();
    this.fase = 0;
    this.inclina = 0;
    this.altura = 0;
    this.rumboSuave = 0;
    this.brazoIzq = 0; this.brazoDer = 0;
    this.pose = 'normal';
    this.sombrero = op.sombrero !== false;
  }

  /**
   * @param {number} dt
   * @param {object} e {x, y, z, rumbo, velocidad, agachado, pose, nadando, carga}
   */
  actualizar(dt, e) {
    const vel = e.velocidad || 0;
    // La cadencia del paso sube con la velocidad; corriendo es casi el doble.
    this.fase += dt * mezclar(0, 9.5, limitar(vel / 5.5, 0, 1.4));
    this.rumboSuave = seguirAngulo(this.rumboSuave, e.rumbo, 14, dt);
    const objetivoInclina = e.nadando ? 1.35 : limitar(vel * 0.045 + (e.carga || 0) * 0.22, 0, 0.42);
    this.inclina = seguir(this.inclina, objetivoInclina, 8, dt);
    this.altura = seguir(this.altura, e.agachado ? -0.16 : 0, 12, dt);
    this.pose = e.pose || 'normal';
    this.estado = e;
  }

  /** Escribe las instancias de este cuadro. */
  emitir() {
    const e = this.estado;
    if (!e) return;
    const base = [e.x, e.y + this.altura, e.z];
    const r = this.rumboSuave;
    const vel = e.velocidad || 0;
    const paso = Math.sin(this.fase);
    const paso2 = Math.sin(this.fase + Math.PI);
    const amplitud = mezclar(0.08, 0.95, limitar(vel / 5, 0, 1));
    const balanceo = Math.sin(this.fase * 2) * 0.022 * amplitud;
    const alturaTorso = 0.52 + balanceo + (e.nadando ? -0.28 : 0);

    const torso = [base[0], base[1] + alturaTorso, base[2]];
    this.lotes.torso.agregar(componer(torso, [this.inclina, r, Math.sin(this.fase * 2) * 0.03], 1, this.m));

    const cuello = [
      torso[0] - Math.sin(r) * Math.sin(this.inclina) * 0.42,
      torso[1] + 0.44 * Math.cos(this.inclina),
      torso[2] - Math.cos(r) * Math.sin(this.inclina) * 0.42,
    ];
    const miraCabeza = this.pose === 'apuntar' ? r : r + Math.sin(this.fase * 0.5) * 0.06;
    this.lotes.cabeza.agregar(componer(cuello, [this.inclina * 0.35, miraCabeza, 0], 1, this.m));
    if (this.sombrero) {
      this.lotes.sombrero.agregar(componer([cuello[0], cuello[1] + 0.11, cuello[2]],
        [this.inclina * 0.3, miraCabeza, 0], 1, this.m));
    }

    // Hombros y caderas, girados con el rumbo.
    const lado = (dx, dy, dz) => [
      base[0] + Math.cos(r) * dx - Math.sin(r) * dz,
      base[1] + dy,
      base[2] - Math.sin(r) * dx - Math.cos(r) * dz,
    ];

    let brazoIzq = -paso * amplitud * 0.9 + this.inclina * 0.3;
    let brazoDer = -paso2 * amplitud * 0.9 + this.inclina * 0.3;
    let piernaIzq = paso * amplitud * 0.85;
    let piernaDer = paso2 * amplitud * 0.85;
    let abreBrazos = 0;

    if (this.pose === 'cargar') { brazoIzq = 0.35; brazoDer = 0.35; abreBrazos = 0.18; }
    else if (this.pose === 'pescar') { brazoIzq = -1.15; brazoDer = -0.9; }
    else if (this.pose === 'apuntar') { brazoIzq = -1.45; brazoDer = -1.2; abreBrazos = 0.1; }
    else if (this.pose === 'recoger') { brazoIzq = -0.9; brazoDer = -0.6; }
    else if (this.pose === 'trabajar') {
      const golpe = Math.sin(this.fase * 1.6);
      brazoIzq = -1.2 + golpe * 0.9; brazoDer = -1.0 + golpe * 0.9;
    } else if (e.nadando) {
      brazoIzq = -1.9 + Math.sin(this.fase) * 0.8; brazoDer = -1.9 + Math.sin(this.fase + 2.1) * 0.8;
      piernaIzq = Math.sin(this.fase * 1.4) * 0.35; piernaDer = -piernaIzq;
    }

    const hombroY = base[1] + alturaTorso + 0.38;
    const caderaY = base[1] + alturaTorso + 0.02;
    this.lotes.brazo.agregar(componer(lado(-0.185, hombroY - base[1], 0), [brazoIzq, r, -abreBrazos], 1, this.m));
    this.lotes.brazo.agregar(componer(lado(0.185, hombroY - base[1], 0), [brazoDer, r, abreBrazos], 1, this.m));
    this.lotes.pierna.agregar(componer(lado(-0.085, caderaY - base[1], 0), [piernaIzq, r, 0], 1, this.m));
    this.lotes.pierna.agregar(componer(lado(0.085, caderaY - base[1], 0), [piernaDer, r, 0], 1, this.m));

    // Lo que lleva en la mano segun lo que este haciendo.
    const manoDer = lado(0.185 + Math.sin(abreBrazos) * 0.1, hombroY - base[1] - 0.42 * Math.cos(brazoDer), -0.42 * Math.sin(-brazoDer));
    const util = { pescar: 'cana', apuntar: 'hondilla', trabajar: 'machete', cargar: 'balde' }[this.pose];
    if (util && this.utiles[util]) {
      const inclinaUtil = { cana: brazoDer + 0.4, hondilla: brazoDer + 1.5, machete: brazoDer, balde: 0 }[util] ?? 0;
      this.utiles[util].agregar(componer(manoDer, [inclinaUtil, r, 0], 1, this.m));
    }
  }
}

  __exp.Personaje = Personaje;
});

__def("src/juego/nucleo/reloj.js", function (__exp, __req) {
/**
 * reloj.js — El tiempo del juego.
 *
 * Un dia completo dura por defecto 16 minutos reales, asi que una hora de
 * juego son 40 segundos: lo bastante largo para que amanecer y anochecer se
 * noten, y lo bastante corto para que en una sesion quepan varios dias.
 */
const { limitar } = __req("src/juego/nucleo/mate.js");

const FASES = [
  { id: 'madrugada', desde: 0,    hasta: 4.8,  nombre: 'Madrugada' },
  { id: 'amanecer',  desde: 4.8,  hasta: 6.8,  nombre: 'Amanecer' },
  { id: 'manana',    desde: 6.8,  hasta: 11.5, nombre: 'Mañana' },
  { id: 'mediodia',  desde: 11.5, hasta: 14.5, nombre: 'Mediodía' },
  { id: 'tarde',     desde: 14.5, hasta: 17.5, nombre: 'Tarde' },
  { id: 'atardecer', desde: 17.5, hasta: 19.3, nombre: 'Atardecer' },
  { id: 'noche',     desde: 19.3, hasta: 24,   nombre: 'Noche' },
];

class Reloj {
  constructor(op = {}) {
    this.minutosPorDia = op.minutosPorDia ?? 16;
    this.dia = op.dia ?? 1;
    this.hora = op.hora ?? 6.2;
    this.pausado = false;
    this.escala = 1;
  }

  /** Horas de juego por segundo real. */
  get ritmo() { return 24 / (this.minutosPorDia * 60); }

  /**
   * @param {number} dtReal segundos
   * @returns {{horas, cambioHora, cambioDia, hora, dia}}
   */
  avanzar(dtReal) {
    if (this.pausado) return { horas: 0, cambioHora: false, cambioDia: false, hora: this.hora, dia: this.dia };
    const horas = dtReal * this.ritmo * this.escala;
    const antes = Math.floor(this.hora);
    this.hora += horas;
    let cambioDia = false;
    while (this.hora >= 24) { this.hora -= 24; this.dia++; cambioDia = true; }
    return {
      horas, cambioDia,
      cambioHora: Math.floor(this.hora) !== antes || cambioDia,
      hora: this.hora, dia: this.dia,
    };
  }

  /** Salta hasta una hora concreta (dormir). Devuelve las horas saltadas. */
  saltarA(hora, mismoDia = false) {
    let saltadas = hora - this.hora;
    if (saltadas <= 0 && !mismoDia) { saltadas += 24; this.dia++; }
    this.hora = hora;
    return saltadas;
  }

  get fase() {
    return FASES.find((f) => this.hora >= f.desde && this.hora < f.hasta) || FASES[FASES.length - 1];
  }

  get esNoche() {
    return this.hora < 5.2 || this.hora > 18.9;
  }

  /** "06:12" */
  get texto() {
    const h = Math.floor(this.hora);
    const m = Math.floor((this.hora - h) * 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  serializar() { return { dia: this.dia, hora: this.hora }; }
}

/** Progreso del dia de 0 a 1, para el reloj circular de la interfaz. */
function progresoDia(hora) { return limitar(hora / 24, 0, 1); }

  __exp.FASES = FASES;
  __exp.Reloj = Reloj;
  __exp.progresoDia = progresoDia;
});

__def("src/juego/nucleo/bucle.js", function (__exp, __req) {
/**
 * bucle.js — El bucle principal, con paso fijo para la simulacion.
 *
 * La simulacion avanza en pasos fijos de 1/60 s (lo que hace que el juego se
 * comporte igual en un movil de 30 Hz que en un monitor de 144 Hz) y el
 * dibujado ocurre una vez por fotograma. Si la pestana estuvo en segundo plano,
 * el salto se recorta en vez de simular diez segundos de golpe.
 */
const PASO = 1 / 60;
const MAX_ACUMULADO = 0.25;

class Bucle {
  constructor({ simular, dibujar, alFallar }) {
    this.simular = simular;
    this.dibujar = dibujar;
    this.alFallar = alFallar;
    this.acumulado = 0;
    this.ultimo = 0;
    this.corriendo = false;
    this.cuadros = 0;
    this.fps = 60;
    this.ventana = [];
    this._paso = this._paso.bind(this);
  }

  arrancar() {
    if (this.corriendo) return;
    this.corriendo = true;
    this.ultimo = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    this.id = requestAnimationFrame(this._paso);
  }

  parar() {
    this.corriendo = false;
    if (this.id) cancelAnimationFrame(this.id);
  }

  _paso(ahora) {
    if (!this.corriendo) return;
    this.id = requestAnimationFrame(this._paso);
    let dt = (ahora - this.ultimo) / 1000;
    this.ultimo = ahora;
    if (!(dt > 0)) return;
    if (dt > MAX_ACUMULADO) dt = MAX_ACUMULADO;

    this.ventana.push(dt);
    if (this.ventana.length > 30) this.ventana.shift();
    this.fps = 1 / (this.ventana.reduce((s, v) => s + v, 0) / this.ventana.length);

    this.acumulado += dt;
    let pasos = 0;
    try {
      while (this.acumulado >= PASO && pasos < 6) {
        this.simular(PASO);
        this.acumulado -= PASO;
        pasos++;
      }
      if (pasos >= 6) this.acumulado = 0;   // no arrastrar deuda imposible
      this.dibujar(dt, this.acumulado / PASO);
      this.cuadros++;
    } catch (e) {
      this.parar();
      if (this.alFallar) this.alFallar(e);
      else throw e;
    }
  }
}

  __exp.PASO = PASO;
  __exp.Bucle = Bucle;
});

__def("src/juego/nucleo/entrada.js", function (__exp, __req) {
/**
 * entrada.js — Teclado, raton, tactil y mando, en una sola interfaz.
 *
 * El juego nunca pregunta "que tecla esta pulsada" sino "hacia donde quiere ir"
 * y "ha pedido interactuar". Asi el mismo codigo vale para un teclado, para el
 * dedo de un movil y para un mando, que era el objetivo: que se pueda jugar en
 * cualquier cosa que tenga pantalla.
 */
const { limitar } = __req("src/juego/nucleo/mate.js");

const MAPA = {
  KeyW: 'arriba', ArrowUp: 'arriba',
  KeyS: 'abajo', ArrowDown: 'abajo',
  KeyA: 'izquierda', ArrowLeft: 'izquierda',
  KeyD: 'derecha', ArrowRight: 'derecha',
  ShiftLeft: 'correr', ShiftRight: 'correr',
  ControlLeft: 'agachar', KeyC: 'agachar',
  KeyE: 'interactuar', Enter: 'interactuar',
  Space: 'accion',
  KeyI: 'inventario', Tab: 'inventario',
  KeyJ: 'diario',
  KeyQ: 'mapa',
  Escape: 'pausa',
  KeyF: 'linterna',
};

class Entrada {
  constructor(elemento, op = {}) {
    this.el = elemento;
    this.teclas = new Set();
    this.acciones = new Set();      // pulsaciones pendientes de consumir
    this.mantenidas = new Set();
    this.raton = { dx: 0, dy: 0, rueda: 0, pulsado: false, x: 0, y: 0 };
    this.palanca = { x: 0, y: 0, activa: false, id: null, ox: 0, oy: 0 };
    this.mirada = { x: 0, y: 0, id: null };
    this.tactil = false;
    this.sensibilidad = op.sensibilidad ?? 1;
    this.activo = true;
    this._instalar();
  }

  _instalar() {
    const el = this.el;
    this._teclaAbajo = (e) => {
      if (!this.activo) return;
      const a = MAPA[e.code];
      if (!a) return;
      if (e.code === 'Tab' || e.code === 'Space') e.preventDefault();
      if (!this.teclas.has(e.code)) this.acciones.add(a);
      this.teclas.add(e.code);
      this.mantenidas.add(a);
    };
    this._teclaArriba = (e) => {
      const a = MAPA[e.code];
      this.teclas.delete(e.code);
      if (a && ![...this.teclas].some((c) => MAPA[c] === a)) this.mantenidas.delete(a);
    };
    addEventListener('keydown', this._teclaAbajo);
    addEventListener('keyup', this._teclaArriba);
    addEventListener('blur', () => { this.teclas.clear(); this.mantenidas.clear(); });

    el.addEventListener('pointerdown', (e) => {
      if (!this.activo) return;
      el.setPointerCapture?.(e.pointerId);
      if (e.pointerType === 'touch') {
        this.tactil = true;
        const mitad = el.clientWidth / 2;
        if (e.clientX < mitad && !this.palanca.activa) {
          this.palanca = { x: 0, y: 0, activa: true, id: e.pointerId, ox: e.clientX, oy: e.clientY };
        } else if (this.mirada.id === null) {
          this.mirada = { x: e.clientX, y: e.clientY, id: e.pointerId };
        }
      } else {
        this.raton.pulsado = true;
        this.raton.x = e.clientX; this.raton.y = e.clientY;
      }
    });

    el.addEventListener('pointermove', (e) => {
      if (!this.activo) return;
      if (e.pointerId === this.palanca.id) {
        const dx = e.clientX - this.palanca.ox, dy = e.clientY - this.palanca.oy;
        const r = 62;
        this.palanca.x = limitar(dx / r, -1, 1);
        this.palanca.y = limitar(dy / r, -1, 1);
      } else if (e.pointerId === this.mirada.id) {
        this.raton.dx += (e.clientX - this.mirada.x) * 0.0055 * this.sensibilidad;
        this.raton.dy += (e.clientY - this.mirada.y) * 0.0045 * this.sensibilidad;
        this.mirada.x = e.clientX; this.mirada.y = e.clientY;
      } else if (this.raton.pulsado || document.pointerLockElement === el) {
        const dx = document.pointerLockElement === el ? e.movementX : e.clientX - this.raton.x;
        const dy = document.pointerLockElement === el ? e.movementY : e.clientY - this.raton.y;
        this.raton.dx += dx * 0.0042 * this.sensibilidad;
        this.raton.dy += dy * 0.0035 * this.sensibilidad;
        this.raton.x = e.clientX; this.raton.y = e.clientY;
      }
    });

    const soltar = (e) => {
      if (e.pointerId === this.palanca.id) this.palanca = { x: 0, y: 0, activa: false, id: null, ox: 0, oy: 0 };
      else if (e.pointerId === this.mirada.id) this.mirada = { x: 0, y: 0, id: null };
      this.raton.pulsado = false;
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);
    el.addEventListener('wheel', (e) => { this.raton.rueda += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** Botones de la interfaz tactil: se pulsan desde ui/tacto.js. */
  pulsar(accion) { this.acciones.add(accion); }
  mantener(accion, si) { if (si) this.mantenidas.add(accion); else this.mantenidas.delete(accion); }

  /** Direccion deseada en el plano, ya normalizada. */
  get direccion() {
    let x = 0, y = 0;
    if (this.mantenidas.has('izquierda')) x -= 1;
    if (this.mantenidas.has('derecha')) x += 1;
    if (this.mantenidas.has('arriba')) y -= 1;
    if (this.mantenidas.has('abajo')) y += 1;
    if (this.palanca.activa) { x += this.palanca.x; y += this.palanca.y; }
    const mando = this._mando();
    if (mando) { x += mando.ejes[0]; y += mando.ejes[1]; }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y, fuerza: Math.min(1, l) };
  }

  _mando() {
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return null;
    const g = [...navigator.getGamepads()].find((p) => p && p.connected);
    if (!g) return null;
    const zm = (v) => (Math.abs(v) < 0.18 ? 0 : v);
    // Botones estandar: A accion, B agachar, X interactuar, Y diario.
    if (g.buttons[0]?.pressed) this.mantenidas.add('accion'); else this.mantenidas.delete('accion');
    if (g.buttons[2]?.pressed) this.acciones.add('interactuar');
    if (g.buttons[1]?.pressed) this.mantenidas.add('agachar'); else this.mantenidas.delete('agachar');
    if (g.buttons[3]?.pressed) this.acciones.add('diario');
    if (g.buttons[9]?.pressed) this.acciones.add('pausa');
    if (g.buttons[6]?.pressed || g.buttons[10]?.pressed) this.mantenidas.add('correr');
    this.raton.dx += zm(g.axes[2] || 0) * 0.045;
    this.raton.dy += zm(g.axes[3] || 0) * 0.03;
    return { ejes: [zm(g.axes[0] || 0), zm(g.axes[1] || 0)] };
  }

  activa(accion) { return this.mantenidas.has(accion); }

  /** Devuelve true una sola vez por pulsacion. */
  consumir(accion) {
    if (!this.acciones.has(accion)) return false;
    this.acciones.delete(accion);
    return true;
  }

  /** Lee y pone a cero el movimiento acumulado del raton. */
  tomarMirada() {
    const m = { dx: this.raton.dx, dy: this.raton.dy, rueda: this.raton.rueda };
    this.raton.dx = 0; this.raton.dy = 0; this.raton.rueda = 0;
    return m;
  }

  limpiar() { this.acciones.clear(); }

  destruir() {
    removeEventListener('keydown', this._teclaAbajo);
    removeEventListener('keyup', this._teclaArriba);
  }
}

  __exp.Entrada = Entrada;
});

__def("src/juego/reglas/necesidades.js", function (__exp, __req) {
/**
 * necesidades.js — Hambre, sed, aguante y animo.
 *
 * No es un juego de supervivencia cruel: nadie se muere de hambre por
 * descuidarse una tarde. Lo que hacen las necesidades es empujar la rutina —
 * hay que beber, hay que comer, hay que descansar— y castigar con torpeza, no
 * con la muerte. El animo es la medida de la superacion: sube cuando el nino
 * juega, se bana en el rio o aporta a la casa, y de el dependen el aguante y la
 * pulseria del dia siguiente.
 */
const { limitar, mezclar } = __req("src/juego/nucleo/mate.js");

const MAXIMO = 100;

function crearNecesidades() {
  return { hambre: 78, sed: 74, aguante: 100, animo: 62, salud: 100, higiene: 70 };
}

/**
 * Gasto por hora de juego. El aguante en positivo se gasta y en negativo se
 * recupera; sus numeros son mayores porque es un recurso de rafaga: correr un
 * buen rato lo vacia y pararse a respirar lo repone.
 */
const ACTIVIDADES = {
  quieto:    { hambre: 2.2, sed: 3.0, aguante: -150, animo: -0.4 },
  andar:     { hambre: 3.4, sed: 4.6, aguante: -32,  animo: 0 },
  correr:    { hambre: 6.2, sed: 9.0, aguante: 92,   animo: 0.4 },
  cargar:    { hambre: 5.0, sed: 7.4, aguante: 48,   animo: -1.2 },
  trabajar:  { hambre: 5.6, sed: 8.0, aguante: 62,   animo: -1.6 },
  nadar:     { hambre: 5.0, sed: 3.0, aguante: 70,   animo: 6 },
  jugar:     { hambre: 4.2, sed: 5.4, aguante: 34,   animo: 14 },
  dormir:    { hambre: 1.1, sed: 1.4, aguante: -420, animo: 2.5 },
};

/**
 * Avanza las necesidades.
 * @param {object} n         estado (se modifica)
 * @param {number} horas     horas de juego transcurridas
 * @param {object} ctx       {actividad, calor, cargaRelativa, mojado, bajoTecho}
 */
function actualizar(n, horas, ctx = {}) {
  const act = ACTIVIDADES[ctx.actividad] || ACTIVIDADES.andar;
  const calor = limitar((ctx.temperatura ?? 26) - 22, -6, 14) / 14;   // 0..1
  const carga = limitar(ctx.cargaRelativa ?? 0, 0, 1.4);

  n.hambre = limitar(n.hambre - act.hambre * horas * (1 + carga * 0.35), 0, MAXIMO);
  n.sed = limitar(n.sed - act.sed * horas * (1 + calor * 0.55 + carga * 0.3), 0, MAXIMO);

  // El aguante se gasta con signo positivo y se recupera con signo negativo.
  const recupera = act.aguante < 0;
  const factorAnimo = mezclar(0.75, 1.25, n.animo / MAXIMO);
  let daguante = -act.aguante * horas;
  if (recupera) daguante *= factorAnimo * (n.hambre > 25 && n.sed > 25 ? 1 : 0.5);
  else daguante *= (1 + carga * 0.8) / factorAnimo;
  n.aguante = limitar(n.aguante + daguante, 0, MAXIMO);

  n.animo = limitar(n.animo + act.animo * horas, 0, MAXIMO);
  if (ctx.mojado && !ctx.bajoTecho) n.higiene = limitar(n.higiene + 6 * horas, 0, MAXIMO);

  const carencia = (n.hambre < 12 ? 1 : 0) + (n.sed < 12 ? 1.6 : 0);
  if (carencia) n.salud = limitar(n.salud - carencia * 3.5 * horas, 0, MAXIMO);
  else if (n.hambre > 45 && n.sed > 45) n.salud = limitar(n.salud + 2.2 * horas, 0, MAXIMO);

}

function comer(n, objeto) {
  if (!objeto) return null;
  n.hambre = limitar(n.hambre + (objeto.hambre || 0), 0, MAXIMO);
  n.sed = limitar(n.sed + (objeto.sed || 0), 0, MAXIMO);
  n.animo = limitar(n.animo + (objeto.animo || 0), 0, MAXIMO);
  n.salud = limitar(n.salud + (objeto.salud || 0), 0, MAXIMO);

function beber(n, litros = 1) {
  n.sed = limitar(n.sed + litros * 22, 0, MAXIMO);
  return n;
}

function banarse(n) {
  n.higiene = MAXIMO;
  n.animo = limitar(n.animo + 16, 0, MAXIMO);
  n.aguante = limitar(n.aguante + 12, 0, MAXIMO);
  return n;
}

function dormir(n, horas = 8) {
  actualizar(n, horas, { actividad: 'dormir', bajoTecho: true });
  n.aguante = MAXIMO;
  n.animo = limitar(n.animo + (n.hambre > 40 ? 8 : 0), 0, MAXIMO);

/**
 * Como afecta el estado a lo que el nino puede hacer.
 * @returns {{velocidad, punteria, exito, aviso}}

  const cansado = n.aguante < 25;

  else if (n.animo < 20) aviso = 'Andas decaído. Un rato de juego levanta el ánimo.';
  return { velocidad, punteria, exito, aviso, cansado, flojo };
}

/** Resumen para la interfaz: 0..1 por barra. */
function barras(n) {
  return {
    hambre: n.hambre / MAXIMO,
    sed: n.sed / MAXIMO,
    aguante: n.aguante / MAXIMO,
    animo: n.animo / MAXIMO,
  };
}

__def("src/juego/reglas/inventario.js", function (__exp, __req) {
/**
 * inventario.js — Lo que se lleva encima y lo que pesa.
 *
 * La carga no es un numero de huecos sino kilos: se puede llevar mucha fruta o
 * poca agua, y el peso frena al andar. Esa es la decision que hace interesante
 * ir al rio: cuantos litros traigo antes de quedarme sin fuerzas.
 */
const { OBJETOS, pesoObjeto } = __req("src/juego/contenido/objetos.js");

/**
 * Kilos que aguanta un nino sin ayuda. Esta calibrado para que en un solo viaje
 * quepan el cantaro lleno (10 L) y tres lenas: ese es el mandado del primer
 * capitulo. Con la canasta al hombro caben doce kilos mas.
 */
const CARGA_BASE = 17;

function crearInventario(inicial = {}) {
  return { ...inicial };
}

function cuenta(inv, id) { return inv[id] || 0; }
function tiene(inv, id, n = 1) { return cuenta(inv, id) >= n; }

function peso(inv) {
  let total = 0;
  for (const id in inv) total += pesoObjeto(id) * inv[id];
  return Math.round(total * 100) / 100;
}

/** Kilos que puede cargar: fuerza del nino mas lo que ayuda la canasta. */
function cargaMaxima(inv, nivelFuerza = 1) {
  const extra = cuenta(inv, 'canasta') > 0 ? (OBJETOS.canasta.cargaExtra || 0) : 0;
  return CARGA_BASE + (nivelFuerza - 1) * 3.5 + extra;
}

/** Cuantas unidades mas caben antes de pasarse de peso. */
function huecoPara(inv, id, nivelFuerza = 1) {
  const libre = cargaMaxima(inv, nivelFuerza) - peso(inv);
  const p = pesoObjeto(id);
  if (p <= 0) return Infinity;
  return Math.max(0, Math.floor(libre / p));
}

/**
 * Anade objetos respetando el limite de carga.
 * @returns {{anadido:number, rechazado:number, lleno:boolean}}
 */
function agregar(inv, id, n = 1, nivelFuerza = 1) {
  if (!OBJETOS[id]) throw new Error(`Objeto desconocido: ${id}`);
  if (OBJETOS[id].unica && cuenta(inv, id) >= 1) {
    return { anadido: 0, rechazado: n, lleno: false, repetido: true };
  }
  const cabe = Math.min(n, huecoPara(inv, id, nivelFuerza));
  if (cabe > 0) inv[id] = cuenta(inv, id) + cabe;
  return { anadido: cabe, rechazado: n - cabe, lleno: cabe < n };
}

function quitar(inv, id, n = 1) {
  const hay = cuenta(inv, id);
  const quitado = Math.min(hay, n);
  if (quitado <= 0) return 0;
  if (hay - quitado <= 0) delete inv[id];
  else inv[id] = hay - quitado;
  return quitado;
}

/** Mueve objetos de un inventario a otro (por ejemplo, a la despensa de casa). */
function transferir(origen, destino, id, n = 1, nivelFuerza = 99) {
  const disponible = Math.min(n, cuenta(origen, id));
  if (!disponible) return 0;
  const { anadido } = agregar(destino, id, disponible, nivelFuerza);
  quitar(origen, id, anadido);
  return anadido;
}

/** Lista ordenada para la interfaz: primero herramientas, luego comida. */
function listar(inv) {
  const orden = { herramienta: 0, recurso: 1, comida: 2, crudo: 3, semilla: 4, material: 5 };
  return Object.keys(inv)
    .filter((id) => inv[id] > 0 && OBJETOS[id])
    .map((id) => ({ id, cantidad: inv[id], objeto: OBJETOS[id], peso: pesoObjeto(id) * inv[id] }))
    .sort((a, b) => (orden[a.objeto.tipo] ?? 9) - (orden[b.objeto.tipo] ?? 9)
      || a.objeto.nombre.localeCompare(b.objeto.nombre));
}

/** Valor de venta de todo lo que se lleva (para el dia que se va al pueblo). */
function valorTotal(inv) {
  let v = 0;
  for (const id in inv) v += (OBJETOS[id]?.valor || 0) * inv[id];
  return v;
}

  __exp.CARGA_BASE = CARGA_BASE;

/** Curva superlineal: los primeros niveles llegan rapido y luego cuesta. */
function xpParaNivel(nivel) {
  if (nivel <= 1) return 0;
  return Math.round(45 * (nivel - 1) ** 1.55);

    enNivel: xp - actual,
    paraSiguiente: Math.max(0, siguiente - actual),
    progreso: nivel >= 12 ? 1 : limitar((xp - actual) / Math.max(1, siguiente - actual), 0, 1),
  };
}

__def("src/juego/reglas/hogar.js", function (__exp, __req) {
/**
 * hogar.js — La casa: lo que hace falta cada dia y lo que el nino aporta.
 *
 * Este es el nucleo emocional del juego. No hay puntuacion abstracta: hay una
 * casa sin luz y sin agua corriente que necesita cada dia sus litros, su lena y
 * su comida. Lo que el nino trae se apunta como aporte, y de ahi salen las
 * estrellas del dia y el animo de la familia.
 */
const { limitar, mezclar } = __req("src/juego/nucleo/mate.js");
const { OBJETOS } = __req("src/juego/contenido/objetos.js");
const { cuenta, quitar, agregar } = __req("src/juego/reglas/inventario.js");

/** Consumo diario de la casa, para tres personas. */
const CONSUMO = { agua: 9, lena: 3, raciones: 3 };

function crearHogar() {
  return {
    despensa: {},
    animoFamilia: 62,
    aporteHoy: 0,
    aporteTotal: 0,
    diasCumplidos: 0,
    diasSeguidos: 0,
    mejorRacha: 0,
    historial: [],       // ultimos dias: {dia, aporte, estrellas, faltas}
  };
}

/** Valor de aporte de un objeto: no todo vale lo mismo para la casa. */
function valorAporte(id, cantidad = 1) {
  const o = OBJETOS[id];
  if (!o) return 0;
  const base = { agua: 1.1, lena: 2.2, tronco: 5 }[id];
  if (base) return base * cantidad;
  if (o.tipo === 'comida') return (2 + (o.hambre || 0) * 0.16) * cantidad;
  if (o.tipo === 'crudo') return (1.2 + (o.hambre || 0) * 0.1) * cantidad;
  if (o.tipo === 'semilla') return 0.8 * cantidad;
  if (o.tipo === 'material') return 0.6 * cantidad;
  if (o.tipo === 'herramienta') return 3 * cantidad;
  return cantidad;
}

/**
 * Entrega objetos a la casa.
 * @returns {{entregado, aporte}}
 */
function entregar(hogar, inv, id, cantidad = 1) {
  const hay = Math.min(cantidad, cuenta(inv, id));
  if (!hay) return { entregado: 0, aporte: 0 };
  quitar(inv, id, hay);
  agregar(hogar.despensa, id, hay, 9999);
  const aporte = valorAporte(id, hay);
  hogar.aporteHoy += aporte;
  hogar.aporteTotal += aporte;
  return { entregado: hay, aporte, id };
}

/** Entrega todo lo entregable de golpe (el gesto de llegar y vaciar la canasta). */
function entregarTodo(hogar, inv) {
  const resultado = [];
  for (const id of Object.keys({ ...inv })) {
    const o = OBJETOS[id];
    if (!o || o.tipo === 'herramienta') continue;
    const r = entregar(hogar, inv, id, cuenta(inv, id));
    if (r.entregado) resultado.push({ id, cantidad: r.entregado, aporte: r.aporte });
  }
  return resultado;
}

/** Raciones de comida que hay en la despensa (una racion = un plato). */
function racionesDisponibles(despensa) {
  let r = 0;
  for (const [id, n] of Object.entries(despensa)) {
    const o = OBJETOS[id];
    if (!o) continue;
    if (o.tipo === 'comida' && (o.hambre || 0) >= 12) r += n;
    else if (o.tipo === 'comida') r += n * 0.4;
  }
  return Math.floor(r);
}

/** Lo que le falta a la casa ahora mismo. */
function faltantes(hogar) {
  return {
    agua: Math.max(0, CONSUMO.agua - cuenta(hogar.despensa, 'agua')),
    lena: Math.max(0, CONSUMO.lena - cuenta(hogar.despensa, 'lena')),
    raciones: Math.max(0, CONSUMO.raciones - racionesDisponibles(hogar.despensa)),
  };
}

/**
 * Cierre del dia: la casa consume lo que hay y se juzga el dia.
 * @returns {{estrellas, faltas, texto, animoFamilia}}
 */
function cerrarDia(hogar, dia) {
  const falta = faltantes(hogar);
  const consumido = {
    agua: Math.min(CONSUMO.agua, cuenta(hogar.despensa, 'agua')),
    lena: Math.min(CONSUMO.lena, cuenta(hogar.despensa, 'lena')),
  };
  quitar(hogar.despensa, 'agua', consumido.agua);
  quitar(hogar.despensa, 'lena', consumido.lena);

  // La comida se consume empezando por lo que menos aguanta guardado.
  let raciones = CONSUMO.raciones - falta.raciones;
  const orden = Object.keys(hogar.despensa)
    .filter((id) => OBJETOS[id]?.tipo === 'comida')
    .sort((a, b) => (OBJETOS[a].hambre || 0) - (OBJETOS[b].hambre || 0));
  for (const id of orden) {
    while (raciones > 0 && cuenta(hogar.despensa, id) > 0) { quitar(hogar.despensa, id, 1); raciones--; }
  }

  const faltas = (falta.agua > 0 ? 1 : 0) + (falta.lena > 0 ? 1 : 0) + (falta.raciones > 0 ? 1 : 0);
  const cubierto = 1 - faltas / 3;
  const generosidad = limitar(hogar.aporteHoy / 34, 0, 1.35);
  const estrellas = faltas === 0
    ? (generosidad > 1 ? 3 : generosidad > 0.6 ? 2 : 1)
    : (faltas === 1 ? 1 : 0);

  hogar.animoFamilia = limitar(hogar.animoFamilia + (faltas === 0 ? 7 : -9 * faltas) + generosidad * 4, 0, 100);
  if (faltas === 0) {
    hogar.diasCumplidos++;
    hogar.diasSeguidos++;
    hogar.mejorRacha = Math.max(hogar.mejorRacha, hogar.diasSeguidos);
  } else {
    hogar.diasSeguidos = 0;
  }

  const texto = faltas === 0
    ? (estrellas === 3 ? 'Hoy sobró. Tu mamá te guardó lo mejor del plato.'
      : 'La casa tuvo lo necesario. Se cena tranquilo.')
    : `Faltó ${[falta.agua ? 'agua' : null, falta.lena ? 'leña' : null, falta.raciones ? 'comida' : null]
        .filter(Boolean).join(' y ')}.`;

  const parte = { dia, aporte: Math.round(hogar.aporteHoy), estrellas, faltas, cubierto, texto };
  hogar.historial.push(parte);
  if (hogar.historial.length > 60) hogar.historial.shift();
  hogar.aporteHoy = 0;
  return { ...parte, animoFamilia: hogar.animoFamilia };
}

/** Frase de la familia segun como va la cosa. */
function humorFamilia(hogar) {
  const a = hogar.animoFamilia;
  if (a > 82) return 'En la casa se ríe. Tu papá dice que ya eres de ayuda de verdad.';
  if (a > 60) return 'La casa va bien. Tu mamá te manda a lavarte antes de comer.';
  if (a > 38) return 'Se aguanta, pero hay que traer más.';
  if (a > 18) return 'Hay caras largas. Falta de todo.';
  return 'La cosa está fea. Nadie dice nada, y eso es peor.';
}

  __exp.CONSUMO = CONSUMO;
  __exp.crearHogar = crearHogar;
  __exp.valorAporte = valorAporte;
  __exp.entregar = entregar;
  __exp.entregarTodo = entregarTodo;
  __exp.racionesDisponibles = racionesDisponibles;
  __exp.faltantes = faltantes;
  __exp.cerrarDia = cerrarDia;
  __exp.humorFamilia = humorFamilia;

/**
 * recoleccion.js — Buscar comida y materiales en el monte.
 *
 * Lo que sale depende del sitio, del mes, de lo que el nino ya sabe reconocer
 * y de si llovio hace poco (los hongos no salen en seco). No es un boton de
 * "dame cosas": es la razon por la que merece la pena aprender el valle.
 */
const { HALLAZGOS, LENA } = __req("src/juego/contenido/plantas.js");
const { limitar, mezclar } = __req("src/juego/nucleo/mate.js");

/** Hallazgos posibles ahora mismo, con su peso ya ajustado. */
function posibles(ctx) {
  const { fuente, zona, mes, sabe = new Set(), especie = null, lluviaReciente = false } = ctx;
  return HALLAZGOS.filter((h) => {
    if (h.fuente !== fuente) return false;
    if (h.especie && especie && h.especie !== especie) return false;
    if (h.zonas && zona && !h.zonas.includes(zona)) return false;
    if (h.meses && h.meses.length && mes != null && !h.meses.includes(mes)) return false;
    if (h.requiere && !sabe.has(h.requiere)) return false;
    if (h.trasLluvia && !lluviaReciente) return false;
    return true;
  });
}

/**
 * Rebusca una vez.
 * @param {object} ctx {fuente, zona, mes, sabe, bono, rnd, lluviaReciente, especie}
 * @returns {{objetos:[{id,cantidad}], xp:number, vacio:boolean}}
 */
function buscar(ctx) {

  const bono = ctx.bono ?? 1;
  const lista = posibles(ctx);
  if (!lista.length) return { objetos: [], xp: 1, vacio: true, motivo: 'Aquí no hay nada que servir.' };

  const suerte = rnd() * bono;
  const cuantos = suerte > 1.15 ? 3 : suerte > 0.78 ? 2 : suerte > 0.16 ? 1 : 0;
  if (!cuantos) return { objetos: [], xp: 1, vacio: true, motivo: 'Esta vez no encontraste nada.' };

  const objetos = [];
  let xp = 0;
  for (let k = 0; k < cuantos; k++) {
    const h = elegirPonderado(lista, rnd);
    const [a, b] = h.cantidad;
    const cantidad = Math.max(1, Math.round(mezclar(a, b, limitar(rnd() * bono, 0, 1))));
    const ya = objetos.find((o) => o.id === h.objeto);
    if (ya) ya.cantidad += cantidad;
    else objetos.push({ id: h.objeto, cantidad, hallazgo: h.id });
    xp += h.xp;
  }
  return { objetos, xp: Math.round(xp * mezclar(1, 1.35, limitar(bono - 1, 0, 1))), vacio: false };
}

function elegirPonderado(lista, rnd) {
  let total = 0;
  for (const h of lista) total += h.peso;
  let r = rnd() * total;
  for (const h of lista) { r -= h.peso; if (r <= 0) return h; }
  return lista[lista.length - 1];
}

/**
 * Junta lena. Del suelo salen rajas; de un tronco caido, el tronco entero,
 * que luego se raja con machete (mas peso, mas rendimiento: esa es la
 * decision).
 */
function juntarLena(modo, ctx = {}) {
  const rnd = ctx.rnd || Math.random;
  const receta = LENA[modo];
  if (!receta) return { ok: false, motivo: 'No sabes hacer eso.' };
  if (receta.requiereMachete && !ctx.tieneMachete) {
    return { ok: false, motivo: 'Hace falta un machete para rajar el tronco.' };
  }
  const [a, b] = receta.cantidad;
  const bono = ctx.bono ?? 1;
  const cantidad = Math.max(1, Math.round(mezclar(a, b, rnd()) * (modo === 'suelo' ? bono : 1)));
  return { ok: true, objetos: [{ id: receta.objeto, cantidad }], xp: receta.xp };
}

/** Dias que tarda en volver a haber fruta o mora en el mismo sitio. */
const DIAS_REGENERACION = { frutal: 3, mata: 2, monte: 1, ribera: 1, casa: 1, tronco: 5 };

function disponible(recurso, dia) {
  return !recurso.agotadoHasta || dia >= recurso.agotadoHasta;
}

function agotar(recurso, dia, fuente) {
  recurso.agotadoHasta = dia + (DIAS_REGENERACION[fuente] ?? 2);
  return recurso;
}

  __exp.posibles = posibles;
  __exp.buscar = buscar;
  __exp.juntarLena = juntarLena;
  __exp.DIAS_REGENERACION = DIAS_REGENERACION;
  __exp.disponible = disponible;
  __exp.agotar = agotar;

__def("src/juego/reglas/caza.js", function (__exp, __req) {
/**
 * caza.js — Acercarse, apuntar y tirar.
 *
 * La probabilidad de acertar no es un dado escondido: la mira se mueve sola
 * (mas cuanto mas cansado y mas lejos), el viento desvia la piedra y el
 * jugador decide cuando soltar. Lo que hace la habilidad es calmar el pulso,
 * no regalar aciertos.
 *
 * Y antes de eso esta lo importante: llegar cerca. De eso se encarga
 * mundo/fauna.js con el olfato y el oido del animal.
 */
const { limitar, mezclar, suavizar } = __req("src/juego/nucleo/mate.js");

const ARMAS = {
  hondilla: {
    nombre: 'Hondilla', icono: '🪁', municion: 'piedra',
    alcance: 14, oscilacion: 1, tiempoCarga: 0.85, dano: 1,
    descripcion: 'Alcance corto, silenciosa. Hay que estar encima.',
  },
  hondilla_larga: {
    nombre: 'Hondilla reforzada', icono: '🪁', municion: 'piedra',
    alcance: 21, oscilacion: 0.8, tiempoCarga: 0.9, dano: 1.35,
    requiere: 'tiro_largo', descripcion: 'Con hule doble llega más lejos y pega más.',
  },
};

/**
 * Prepara el apuntado.
 * @param {object} ctx {arma, distancia, bono, punteria (0..1), viento, agachado}
 */
function crearApuntado(ctx) {
  const arma = ARMAS[ctx.arma] || ARMAS.hondilla;
  const dist = ctx.distancia ?? 8;
  const calma = limitar((ctx.punteria ?? 1) * mezclar(1, 1.45, limitar((ctx.bono ?? 1) - 1, 0, 1)), 0.25, 2);
  const lejania = limitar(dist / arma.alcance, 0.15, 1.8);
  return {
    arma,
    distancia: dist,
    // Amplitud del vaiven, en "radios de blanco".
    oscilacion: arma.oscilacion * lejania * 0.85 / calma * (ctx.agachado ? 0.72 : 1),
    velocidad: mezclar(1.5, 2.9, limitar(1 / calma, 0, 1)),
    fase: (ctx.fase ?? 0),
    // Deriva del viento: crece con la distancia, no con el tiempo.
    deriva: (ctx.viento?.fuerza ?? 0) * lejania * 0.55,
    derivaAngulo: ctx.viento?.direccion ?? 0,
    tension: 0,
    listo: false,
  };
}

/** Posicion de la mira en el instante t (unidades: radios de blanco). */
function posicionMira(ap, t) {
  const w = ap.velocidad;
  const x = Math.sin(t * w + ap.fase) * ap.oscilacion
          + Math.sin(t * w * 2.7 + ap.fase * 1.9) * ap.oscilacion * 0.35;
  const y = Math.sin(t * w * 0.73 + ap.fase * 2.3) * ap.oscilacion * 0.7
          + Math.cos(t * w * 1.9 + ap.fase) * ap.oscilacion * 0.25;
  return { x, y };
}

/**
 * Suelta el tiro.
 * @returns {{desvio, mira, deriva}}
 */
function disparar(ap, t) {
  const mira = posicionMira(ap, t);
  const dx = mira.x + Math.cos(ap.derivaAngulo) * ap.deriva;
  const dy = mira.y + Math.sin(ap.derivaAngulo) * ap.deriva * 0.4;
  return { desvio: Math.hypot(dx, dy), mira, deriva: ap.deriva };
}

/**
 * Resuelve el disparo contra el animal.
 * @param {object} ctx {animal(perfil), desvio, distancia, arma, bono, rnd}
 * @returns {{acierto, limpio, presa, xp, huye, texto}}
 */
function resolverTiro(ctx) {
  const rnd = ctx.rnd || Math.random;
  const perfil = ctx.animal;
  const arma = ARMAS[ctx.arma] || ARMAS.hondilla;
  if (ctx.distancia > arma.alcance * 1.25) {
    return { acierto: false, huye: true, texto: 'Demasiado lejos: la piedra ni llegó.', xp: 1 };
  }
  // Blanco efectivo: los animales grandes perdonan mas desvio.
  const tamano = mezclar(0.55, 1.35, 1 - (perfil.dificultad ?? 0.5));
  const acierto = ctx.desvio < tamano;
  if (!acierto) {
    return { acierto: false, huye: true, xp: 2, texto: 'Falló, y el animal salió huyendo.' };
  }
  // Un buen tiro (muy centrado) cobra la pieza entera; uno justo, la hiere.
  const limpio = ctx.desvio < tamano * 0.45 || rnd() < 0.35 * arma.dano;
  if (!limpio) {
    return { acierto: true, limpio: false, huye: true, xp: Math.round((perfil.xp ?? 8) * 0.4),
      texto: 'Le diste, pero se fue herido monte adentro.' };
  }
  return {
    acierto: true, limpio: true, huye: false,
    presa: perfil.presa,
    xp: perfil.xp ?? 10,
    texto: `¡Cobraste el ${perfil.nombre}!`,
  };
}

/** Probabilidad estimada, solo para mostrarla en la interfaz antes de tirar. */
function probabilidadEstimada(ap, perfil) {
  const tamano = mezclar(0.55, 1.35, 1 - (perfil?.dificultad ?? 0.5));
  const amplitud = ap.oscilacion + ap.deriva;
  return limitar(1 - suavizar(tamano * 0.35, tamano * 2.1, amplitud), 0.02, 0.98);
}

// ------------------------------------------------------------------ trampas
const TRAMPA = { materiales: { pita: 2, fibra: 3 }, dias: 1, xp: 8 };

function colocarTrampa(estado, x, z, dia) {
  const trampa = { id: `tr${dia}_${Math.round(x)}_${Math.round(z)}`, x, z, dia, revisada: false };
  estado.trampas.push(trampa);
  return trampa;
}

/**
 * Revisa una trampa puesta. Cuanto mas tiempo lleve, mas probable que haya
 * caido algo, pero tambien mas probable que se lo hayan comido antes.
 */
function revisarTrampa(trampa, dia, ctx = {}) {
  const rnd = ctx.rnd || Math.random;
  const dias = dia - trampa.dia;
  if (dias < 1) return { ok: false, motivo: 'Todavía no ha pasado la noche.' };
  trampa.revisada = true;
  const prob = limitar(0.32 + dias * 0.16 + (ctx.bono ?? 1) * 0.1 - 0.08, 0, 0.85);
  if (rnd() > prob) return { ok: true, vacia: true, xp: 2, texto: 'La trampa está vacía.' };
  if (dias > 2 && rnd() < 0.35) {
    return { ok: true, vacia: true, xp: 3, texto: 'Cayó algo, pero se lo comieron antes que tú.' };
  }
  const presa = rnd() < 0.75
    ? { objeto: 'carne_conejo', cantidad: 1, nombre: 'conejo' }
    : { objeto: 'carne_pajaro', cantidad: 1, nombre: 'pájaro' };
  return { ok: true, vacia: false, objetos: [{ id: presa.objeto, cantidad: presa.cantidad }],
    xp: TRAMPA.xp, texto: `Cayó un ${presa.nombre} en la trampa.` };
}

  __exp.ARMAS = ARMAS;
  __exp.crearApuntado = crearApuntado;
  __exp.posicionMira = posicionMira;
  __exp.disparar = disparar;
  __exp.resolverTiro = resolverTiro;
  __exp.probabilidadEstimada = probabilidadEstimada;
  __exp.TRAMPA = TRAMPA;
  __exp.colocarTrampa = colocarTrampa;
  __exp.revisarTrampa = revisarTrampa;
});

__def("src/juego/reglas/acciones.js", function (__exp, __req) {
/**
 * acciones.js — Todo lo que el nino puede hacer y que pasa cuando lo hace.
 *
 * Cada accion es una funcion pura sobre el contexto de la partida: mira el
 * estado, decide y devuelve el resultado (texto, objetos, experiencia, si abre
 * un minijuego). Quien la aplica es partida.js. Asi las reglas se pueden
 * probar sin navegador y la interfaz no tiene logica de juego dentro.
 */
const { OBJETOS } = __req("src/juego/contenido/objetos.js");
const { NIVEL_AGUA, LUGARES } = __req("src/juego/mundo/terreno.js");
const { agregar, cuenta, quitar, peso, cargaMaxima } = __req("src/juego/reglas/inventario.js");

const { arar, sembrar, regar, deshierbar, cosechar, listoParaCosechar, etapaDe, diagnostico } = __req("src/juego/reglas/cultivo.js");
const { revisarTrampa, colocarTrampa, TRAMPA } = __req("src/juego/reglas/caza.js");
const { entregarTodo } = __req("src/juego/reglas/hogar.js");
const { nivel, bono } = __req("src/juego/reglas/habilidades.js");
const { CULTIVOS } = __req("src/juego/contenido/cultivos.js");
const { limitar, mezclar } = __req("src/juego/nucleo/mate.js");

const RADIO_INTERACCION = 3.2;

/**
 * Que tiene el nino a mano ahora mismo.
 * @param {object} ctx {estado, terreno, fauna, recursos, cuadros, jugador, clima, hora, dia, sabe}
 * @returns {Array} opciones ordenadas por cercania
 */
function interaccionesCerca(ctx) {
  const { terreno, jugador } = ctx;
  const inv = ctx.estado.jugador.inventario;
  const ops = [];
  const dist = (x, z) => Math.hypot(x - jugador.x, z - jugador.z);

  // --- el rio
  const profundidad = terreno.profundidadAgua(jugador.x, jugador.z);
  const orilla = terreno.orillaCercana(jugador.x, jugador.z);
  const dOrilla = orilla ? dist(orilla[0], orilla[1]) : 999;
  if (profundidad > -0.6 || dOrilla < 4.5) {
    ops.push({ id: 'beber', etiqueta: 'Beber agua', icono: '💧', distancia: 0.4 });
    if (cuenta(inv, 'cantaro')) ops.push({ id: 'llenar', etiqueta: 'Llenar el cántaro', icono: '🏺', distancia: 0.5 });
    ops.push({ id: 'banar', etiqueta: 'Bañarse en el río', icono: '🏊', distancia: 0.6 });
    if (cuenta(inv, 'cana')) ops.push({ id: 'pescar', etiqueta: 'Pescar', icono: '🎣', distancia: 0.3 });
    if (cuenta(inv, 'atarraya')) ops.push({ id: 'atarraya', etiqueta: 'Tirar la atarraya', icono: '🕸️', distancia: 0.35 });
    ops.push({ id: 'buscar_ribera', etiqueta: 'Rebuscar en la orilla', icono: '🪨', distancia: 0.8 });
  }

  // --- recursos del monte (frutales, matas, lena, troncos)

    const libre = !memoria || disponible(memoria, ctx.dia);
    if (r.tipo === 'frutal') {
      ops.push({ id: 'recolectar', etiqueta: libre ? `Buscar en el palo de ${r.especie}` : 'Ya no queda fruta aquí',

    } else if (r.tipo === 'mata') {

    } else if (r.tipo === 'tronco') {
      ops.push({ id: 'lena_suelo', etiqueta: libre ? 'Juntar leña del suelo' : 'Aquí ya no hay leña',
        icono: '🪵', distancia: d, objetivo: r, desactivada: !libre });
      if (cuenta(inv, 'machete') && libre) {

      }
    } else if (r.tipo === 'lena') {
      ops.push({ id: 'lena_suelo', etiqueta: libre ? 'Recoger ramas secas' : 'Palo ya limpio',
        icono: '🪵', distancia: d, objetivo: r, desactivada: !libre });

  }

  // --- rebuscar en el monte donde estes
  const zona = terreno.zona(jugador.x, jugador.z);
  if ((zona === 'monte' || zona === 'potrero') && profundidad < -0.5) {
    ops.push({ id: 'buscar_monte', etiqueta: 'Rebuscar en el monte', icono: '🌿', distancia: 1.2 });
  }

  // --- cuadros de la milpa
  for (const q of ctx.estado.cuadros || []) {
    const d = dist(q.x, q.z);
    if (d > RADIO_INTERACCION) continue;
    if (!q.cultivo) {
      if (!q.arado) ops.push({ id: 'arar', etiqueta: 'Arar el cuadro', icono: '⛏️', distancia: d, objetivo: q });
      else ops.push({ id: 'sembrar', etiqueta: 'Sembrar', icono: '🌱', distancia: d, objetivo: q, menu: 'sembrar' });
    } else {
      if (listoParaCosechar(q)) ops.push({ id: 'cosechar', etiqueta: 'Cosechar', icono: '🌽', distancia: d - 0.5, objetivo: q });
      ops.push({ id: 'regar', etiqueta: 'Regar', icono: '💧', distancia: d + 0.1, objetivo: q,
        desactivada: cuenta(inv, 'agua') < 1 });
      if (q.maleza > 0.25) ops.push({ id: 'deshierbar', etiqueta: 'Quitar la maleza', icono: '🌿', distancia: d + 0.2, objetivo: q });
    }
  }

  // --- casa y fogon
  const dCasa = dist(LUGARES.casa.x, LUGARES.casa.z);

        distancia: 0.2, objetivo: cerca.animal, sub: `a ${cerca.distancia.toFixed(0)} m` });
    }
  }
  if (cuenta(inv, 'trampa')) {
    ops.push({ id: 'poner_trampa', etiqueta: 'Poner una trampa aquí', icono: '🪤', distancia: 1.6 });
  }
  for (const t of ctx.estado.trampas || []) {
    const d = dist(t.x, t.z);
    if (d < RADIO_INTERACCION) ops.push({ id: 'revisar_trampa', etiqueta: 'Revisar la trampa', icono: '🪤', distancia: d, objetivo: t });
  }

  // --- diversiones
  if ((ctx.clima?.lluvia ?? 0) > 0.25 && profundidad < -0.3) {
    ops.push({ id: 'jugar_lluvia', etiqueta: 'Jugar bajo la lluvia', icono: '🌧️', distancia: 1.9 });
  }
  if ((ctx.hora > 19.8 || ctx.hora < 4.5) && (ctx.clima?.nubosidad ?? 1) < 0.45 && profundidad < -0.3) {
    ops.push({ id: 'estrellas', etiqueta: 'Quedarse viendo las estrellas', icono: '✨', distancia: 2.1 });
  }

  return ops.filter((o) => !o.oculta).sort((a, b) => a.distancia - b.distancia);
}

/**
 * Ejecuta una accion.
 * @returns {{ok, texto, objetos, xp, habilidad, minijuego, tiempo, actividad}}
 */
function ejecutar(op, ctx) {
  const e = ctx.estado;
  const inv = e.jugador.inventario;
  const nec = e.jugador.necesidades;
  const hab = e.jugador.habilidades;
  const sabe = ctx.sabe || new Set();
  const rnd = ctx.rnd || Math.random;
  const fuerza = nivel(hab, 'fuerza');

  switch (op.id) {
    case 'beber': {
      beberNec(nec, 1.5);
      return { ok: true, texto: 'Bebiste del río. Está fría.', tiempo: 4, actividad: 'quieto' };
    }
    case 'llenar': {
      const cap = OBJETOS.cantaro.capacidadAgua * (sabe.has('dos_cantaros') ? 2 : 1);
      const r = agregar(inv, 'agua', cap, fuerza);
      const texto = r.anadido === 0
        ? 'No podés con más peso. Dejá algo o llevá menos.'
        : `Llenaste ${r.anadido} litros.${r.lleno ? ' Ya no te cabe más.' : ''}`;
      return { ok: r.anadido > 0, texto, tiempo: 25, actividad: 'trabajar',
        xp: r.anadido > 0 ? 3 : 0, habilidad: 'fuerza', contador: 'agua' };
    }
    case 'banar': {
      banarse(nec);
      return { ok: true, texto: 'Te metiste al agua. Sale uno nuevo.', tiempo: 40, actividad: 'nadar',
        xp: 6, habilidad: 'espiritu', contador: 'banar' };
    }
    case 'pescar':
      return { ok: true, minijuego: 'pesca', texto: 'Tiraste el anzuelo.' };
    case 'atarraya':
      return { ok: true, minijuego: 'atarraya' };
    case 'cazar':
      return { ok: true, minijuego: 'caza', objetivo: op.objetivo };

    case 'buscar_ribera':
    case 'buscar_monte':
    case 'recolectar': {
      const fuente = op.fuente || (op.id === 'buscar_ribera' ? 'ribera' : 'monte');
      const zona = ctx.terreno.zona(ctx.jugador.x, ctx.jugador.z);
      const r = buscar({
        fuente, zona, mes: ctx.mes, sabe, rnd,
        especie: op.objetivo?.especie,
        lluviaReciente: ctx.lluviaReciente,
        bono: bono(hab, 'recoleccion'),
      });
      if (op.objetivo) {
        const mem = e.recursos[op.objetivo.id] || (e.recursos[op.objetivo.id] = {});
        agotar(mem, ctx.dia, fuente);
      }
      if (r.vacio) return { ok: true, texto: r.motivo, tiempo: 20, actividad: 'trabajar', xp: 1, habilidad: 'recoleccion', contador: 'buscar' };
      return {
        ok: true, objetos: r.objetos, xp: r.xp, habilidad: 'recoleccion',
        texto: r.objetos.map((o) => `${o.cantidad} × ${OBJETOS[o.id]?.nombre || o.id}`).join(', '),
        tiempo: 25, actividad: 'trabajar', contador: 'buscar',
      };
    }

    case 'lena_suelo':
    case 'rajar': {
      const modo = op.id === 'rajar' ? 'rajar' : 'suelo';
      const r = juntarLena(modo, { rnd, tieneMachete: cuenta(inv, 'machete') > 0, bono: bono(hab, 'fuerza') });
      if (!r.ok) return { ok: false, texto: r.motivo };
      if (op.objetivo) {
        const mem = e.recursos[op.objetivo.id] || (e.recursos[op.objetivo.id] = {});
        agotar(mem, ctx.dia, 'tronco');
      }
      return { ok: true, objetos: r.objetos, xp: r.xp, habilidad: 'fuerza', contador: 'lena',
        texto: `${r.objetos[0].cantidad} × ${OBJETOS[r.objetos[0].id].nombre}`,
        tiempo: modo === 'rajar' ? 90 : 35, actividad: 'trabajar', minijuego: 'lena' };
    }

    case 'arar': {
      const r = arar(op.objetivo);
      if (!r.ok) return { ok: false, texto: r.motivo };
      return { ok: true, texto: 'Cuadro arado y listo.', xp: 6, habilidad: 'siembra',
        tiempo: 55, actividad: 'trabajar' };
    }
    case 'sembrar': {

__def("src/juego/reglas/cocina.js", function (__exp, __req) {
/**
 * cocina.js — El fogon y el taller.
 *
 * Cocinar convierte lo crudo en comida que de verdad alimenta y anima, pero
 * gasta lena y tiempo del dia. Ese es el intercambio: el nino puede comerse un
 * mango de camino, o llegar a casa y hacer algo que rinda para todos.
 */
const { RECETAS, receta } = __req("src/juego/contenido/recetas.js");
const { OBJETOS } = __req("src/juego/contenido/objetos.js");
const { cuenta, quitar, agregar } = __req("src/juego/reglas/inventario.js");

/** Recetas que el nino ya sabe hacer. */
function disponibles(tipo, sabe = new Set()) {
  return RECETAS.filter((r) => r.tipo === tipo && (!r.requiere || sabe.has(r.requiere)));
}

/**
 * Comprueba si se puede cocinar.
 * @returns {{ok, faltan:[{id,cantidad}], receta}}
 */
function puedeCocinar(idReceta, inv, ctx = {}) {
  const r = receta(idReceta);
  if (!r) return { ok: false, motivo: 'Esa receta no existe.' };
  if (r.requiere && !(ctx.sabe || new Set()).has(r.requiere)) {
    return { ok: false, receta: r, motivo: 'Todavía no sabes hacer eso.' };
  }
  if (r.herramienta && !cuenta(inv, r.herramienta)) {
    return { ok: false, receta: r, motivo: `Hace falta: ${OBJETOS[r.herramienta]?.nombre || r.herramienta}.` };
  }
  const faltan = [];
  for (const [id, n] of Object.entries(r.ingredientes)) {
    const hay = cuenta(inv, id) + (ctx.despensa ? cuenta(ctx.despensa, id) : 0);
    if (hay < n) faltan.push({ id, cantidad: n - hay, nombre: OBJETOS[id]?.nombre || id });
  }
  const lenaHay = cuenta(inv, 'lena') + (ctx.despensa ? cuenta(ctx.despensa, 'lena') : 0);
  if ((r.lena || 0) > lenaHay) {
    faltan.push({ id: 'lena', cantidad: r.lena - lenaHay, nombre: 'Leña' });
  }
  return { ok: faltan.length === 0, faltan, receta: r };
}

/**
 * Cocina de verdad: consume del inventario y, si falta, de la despensa.
 * @returns {{ok, produce, xp, minutos}}
 */
function cocinar(idReceta, inv, ctx = {}) {
  const comprobacion = puedeCocinar(idReceta, inv, ctx);
  if (!comprobacion.ok) return { ok: false, ...comprobacion };
  const r = comprobacion.receta;
  const gastar = (id, n) => {
    const delBolso = quitar(inv, id, n);
    if (delBolso < n && ctx.despensa) quitar(ctx.despensa, id, n - delBolso);
  };
  for (const [id, n] of Object.entries(r.ingredientes)) gastar(id, n);
  if (r.lena) gastar('lena', r.lena);

  const res = agregar(inv, r.produce.id, r.produce.cantidad, ctx.nivelFuerza ?? 1);
  const sobra = r.produce.cantidad - res.anadido;
  if (sobra > 0 && ctx.despensa) agregar(ctx.despensa, r.produce.id, sobra, 999);
  return {
    ok: true, receta: r, xp: r.xp, minutos: r.minutos,
    produce: { id: r.produce.id, cantidad: r.produce.cantidad },
    aBolso: res.anadido, aDespensa: sobra,
    texto: `${r.produce.cantidad} × ${OBJETOS[r.produce.id]?.nombre || r.produce.id}`,
  };
}

  __exp.disponibles = disponibles;
  __exp.puedeCocinar = puedeCocinar;
  __exp.cocinar = cocinar;

__def("src/juego/reglas/pesca.js", function (__exp, __req) {
/**
 * pesca.js — El rio, la cana y el pulso con el pez.
 *
 * Dos capas: primero decidir DONDE y CUANDO (la poza honda al amanecer no da lo
 * mismo que el remanso a mediodia), y despues aguantar el tiron sin reventar la
 * linea. La segunda capa es puro reflejo; la primera es estrategia, y es la que
 * de verdad decide si se come pescado.
 */
const { PECES } = __req("src/juego/contenido/peces.js");
const { limitar, mezclar, suavizar } = __req("src/juego/nucleo/mate.js");

/** Calidad del sitio y del momento, de 0 a 1. */
function calidadPunto(ctx) {
  const { hondura = 0.3, hora = 12, lluvia = 0, cebo = false, bono = 1, atarraya = false } = ctx;
  // El pez sube al amanecer y al atardecer.
  const franja = Math.max(
    suavizar(4.2, 6.0, hora) * (1 - suavizar(8.0, 10.0, hora)),
    suavizar(15.5, 17.5, hora) * (1 - suavizar(19.5, 21.0, hora)),
  );
  let q = 0.2 + franja * 0.4 + hondura * 0.3;
  if (cebo) q += 0.14;
  if (lluvia > 0.2) q += 0.12;              // el agua revuelta les da confianza
  if (lluvia > 0.85) q -= 0.25;             // pero con la crecida se esconden
  if (atarraya) q += 0.1;
  return limitar(q * mezclar(0.85, 1.2, limitar(bono - 1, 0, 1)), 0.03, 1);
}

/** Segundos hasta que pica. */
function esperaPicada(calidad, rnd = Math.random) {
  return mezclar(11, 1.6, calidad) * mezclar(0.55, 1.6, rnd());
}

/** Escoge que pez pica: los raros piden poza honda y hora buena. */
function elegirPez(ctx, rnd = Math.random) {
  const { hondura = 0.3, hora = 12, bono = 1 } = ctx;
  const noche = hora < 5.5 || hora > 18.5;
  const posibles = PECES.filter((p) => {
    if (p.hondura > hondura + 0.2) return false;
    if (p.noche && !noche) return false;
    return true;
  });
  if (!posibles.length) return PECES[0];
  // Cuanto mejor la habilidad y mas honda la poza, mas peso tienen los raros.
  const suerte = limitar(rnd() * mezclar(0.75, 1.5, limitar(bono - 1, 0, 1)) + hondura * 0.3, 0, 1.4);
  const candidatos = posibles.filter((p) => p.raro <= suerte);
  const lista = candidatos.length ? candidatos : [posibles[0]];
  return lista[Math.min(lista.length - 1, Math.floor(rnd() * lista.length * 1.15))];
}

/**
 * Prepara un lance completo.
 * @returns {{estado, espera, pez, tension, progreso, tiempo, calidad}}
 */
function crearLance(ctx, rnd = Math.random) {
  const calidad = calidadPunto(ctx);
  return {
    estado: 'esperando',
    calidad,
    espera: esperaPicada(calidad, rnd),
    pez: elegirPez(ctx, rnd),
    tension: 0,
    progreso: 0,
    tiempo: 0,
    fase: rnd() * 6.28,
    bono: ctx.bono ?? 1,
    // La ventana para clavar el anzuelo: si no reaccionas, se va.
    ventana: mezclar(1.5, 0.75, limitar((ctx.bono ?? 1) - 1, 0, 1)),
  };
}

/** Fuerza instantanea del pez: tirones irregulares, no una curva plana. */
function tironPez(lance, t) {
  const p = lance.pez;
  return p.fuerza * (0.62 + 0.38 * Math.sin(t * 2.4 + lance.fase) * Math.sin(t * 0.9 + lance.fase * 1.7));
}

/**
 * Avanza el lance un instante.
 * @param {object} lance
 * @param {number} dt segundos
 * @param {boolean} recogiendo el jugador esta tirando de la cana
 * @param {boolean} clavar el jugador acaba de clavar (solo en 'picando')
 */
function avanzarLance(lance, dt, recogiendo, clavar = false) {
  lance.tiempo += dt;
  if (lance.estado === 'esperando') {
    if (clavar) { lance.estado = 'fallado'; lance.motivo = 'Clavaste antes de tiempo.'; return lance; }
    if (lance.tiempo >= lance.espera) { lance.estado = 'picando'; lance.tiempo = 0; }
    return lance;
  }
  if (lance.estado === 'picando') {
    if (clavar) { lance.estado = 'luchando'; lance.tiempo = 0; return lance; }
    if (lance.tiempo >= lance.ventana) { lance.estado = 'escapado'; lance.motivo = 'Se llevó el cebo.'; }
    return lance;
  }
  if (lance.estado !== 'luchando') return lance;

  const bono = mezclar(1, 0.72, limitar(lance.bono - 1, 0, 1));   // habilidad = linea mas sufrida
  const tiron = tironPez(lance, lance.tiempo);
  if (recogiendo) {
    lance.tension = limitar(lance.tension + (tiron * 1.45 + 0.30) * bono * dt, 0, 1.2);
    lance.progreso = limitar(lance.progreso + (0.30 / Math.max(0.5, lance.pez.resistencia)) * dt, 0, 1);
  } else {
    lance.tension = limitar(lance.tension - 0.55 * dt, 0, 1.2);
    lance.progreso = limitar(lance.progreso - 0.075 * dt, 0, 1);
  }
  if (lance.tension >= 1) { lance.estado = 'roto'; lance.motivo = 'Se reventó la línea.'; }
  else if (lance.progreso >= 1) { lance.estado = 'cobrado'; }
  // Si nadie recoge, el pez acaba soltandose: no vale esperar sin hacer nada.
  else if (lance.tiempo > 26) { lance.estado = 'escapado'; lance.motivo = 'Se soltó del anzuelo.'; }
  return lance;
}

/** Resultado en objetos y experiencia. */
function cobrar(lance) {
  if (lance.estado !== 'cobrado') return { ok: false };
  const p = lance.pez;
  return {
    ok: true, pez: p,
    objetos: [{ id: p.objeto, cantidad: p.cantidad }],
    xp: p.xp,
    texto: `${p.nombre} de ${p.peso.toFixed(1)} kg`,
  };
}

/**
 * Tirar la atarraya: sin pulso, pero cansa y depende del sitio.
 * Es lo que desbloquea pescar para toda la casa, no solo para uno.
 */
function tirarAtarraya(ctx, rnd = Math.random) {
  const calidad = calidadPunto({ ...ctx, atarraya: true });
  const n = Math.round(mezclar(0, 4.5, calidad * mezclar(0.7, 1.25, rnd())));
  const capturas = [];
  for (let k = 0; k < n; k++) capturas.push(elegirPez({ ...ctx, bono: (ctx.bono ?? 1) * 0.8 }, rnd));
  const total = capturas.reduce((s, p) => s + p.cantidad, 0);
  return {
    ok: n > 0, capturas,
    objetos: total ? [{ id: 'pescado', cantidad: total }] : [],
    xp: capturas.reduce((s, p) => s + Math.round(p.xp * 0.6), 0) + 3,
    aguante: 22,
  };
}

  __exp.avanzarLance = avanzarLance;

__def("src/juego/reglas/progresion.js", function (__exp, __req) {
/**
 * progresion.js — Los capitulos: cuando se ofrecen, como se comprueban y que
 * dan al terminar.
 *
 * La comprobacion es siempre contra el estado guardado, nunca contra un evento
 * suelto: asi da igual el orden en que pasen las cosas y una partida cargada
 * sigue exactamente donde estaba.
 */
const { CAPITULOS, capitulo } = __req("src/juego/contenido/capitulos.js");
const { OBJETOS } = __req("src/juego/contenido/objetos.js");
const { cuenta, valorTotal } = __req("src/juego/reglas/inventario.js");
const { ganar, nivel } = __req("src/juego/reglas/habilidades.js");
const { agregar } = __req("src/juego/reglas/inventario.js");
const { limitar } = __req("src/juego/nucleo/mate.js");

/** Capitulos ya terminados, como conjunto. */
function hechos(estado) {
  return new Set((estado.capitulos?.hechos || []).map((h) => h.id));
}

/** Capitulos que se pueden empezar ahora. */
function disponibles(estado) {
  const listos = hechos(estado);
  return CAPITULOS.filter((c) => !listos.has(c.id)
    && (c.requiere || []).every((r) => listos.has(r))
    && (!c.dia || estado.dia >= c.dia));
}

function activo(estado) {
  return estado.capitulos?.activo ? capitulo(estado.capitulos.activo) : null;
}

function activar(estado, id) {
  const c = capitulo(id);
  if (!c) return { ok: false, motivo: 'Ese capítulo no existe.' };
  if (hechos(estado).has(id)) return { ok: false, motivo: 'Ese capítulo ya está hecho.' };
  estado.capitulos.activo = id;
  if (!estado.capitulos.vistos.includes(id)) estado.capitulos.vistos.push(id);
  // Se apunta el punto de partida para que los objetivos cuenten desde aqui.
  estado.capitulos.marca = marcar(estado);
  return { ok: true, capitulo: c };
}

/** Foto de los contadores al empezar el capitulo (los objetivos son relativos). */
function marcar(estado) {
  const c = estado.contadores;
  return {
    entregado: { ...c.entregado },
    entregadoCategoria: { ...c.entregadoCategoria },
    recetas: { ...c.recetas },
    cultivos: { ...c.cultivos },
    acciones: {
      pescar: c.pescar, cazar: c.cazar, buscar: c.buscar, sembrar: c.sembrar,
      regar: c.regar, cosechar: c.cosechar, cocinar: c.cocinar, lena: c.lena,
      agua: c.agua, banar: c.banar, jugar_lluvia: c.jugar_lluvia, trampa: c.trampa,
      deshierbar: c.deshierbar, nadar: c.nadar,
    },
    estrellas: c.estrellas,
    diasSeguidos: estado.hogar?.diasSeguidos || 0,
  };
}

function desde(estado, camino, clave) {
  const marca = estado.capitulos?.marca;
  const base = marca ? (camino ? (marca[camino]?.[clave] || 0) : (marca[clave] || 0)) : 0;
  const c = estado.contadores;
  const ahora = camino ? (c[camino]?.[clave] || 0) : (c[clave] || 0);
  return Math.max(0, ahora - base);
}

/**
 * Evalua un objetivo contra el estado.
 * @returns {{hecho, valor, meta, progreso, texto}}
 */
function evaluarObjetivo(obj, estado) {
  const meta = obj.meta ?? 1;
  let valor = 0;
  switch (obj.tipo) {
    case 'entregar':
      valor = desde(estado, 'entregado', obj.objeto);
      break;
    case 'entregarCategoria':
      valor = desde(estado, 'entregadoCategoria', obj.categoria);
      break;
    case 'juntar':
      valor = cuenta(estado.jugador.inventario, obj.objeto) + cuenta(estado.hogar.despensa, obj.objeto);
      break;
    case 'accion':
      valor = desde(estado, 'acciones', obj.accion) || desde(estado, null, obj.accion);
      break;
    case 'cocinar':
      valor = desde(estado, 'recetas', obj.receta);
      break;
    case 'sembrar':
      valor = desde(estado, 'cultivos', obj.cultivo);
      break;
    case 'cosechar':
      valor = desde(estado, 'acciones', 'cosechar');
      break;
    case 'habilidad':
      valor = nivel(estado.jugador.habilidades, obj.habilidad);
      break;
    case 'dias':
      valor = estado.hogar?.diasSeguidos || 0;
      break;
    case 'estrellas':
      valor = estado.contadores.estrellas - (estado.capitulos?.marca?.estrellas || 0);
      break;
    case 'valor':
      valor = valorTotal(estado.jugador.inventario) + valorTotal(estado.hogar.despensa);
      break;
    case 'lugar':
      valor = (estado.lugaresVisitados || []).includes(obj.lugar) ? 1 : 0;
      break;
    default:
      valor = 0;
  }
  return {
    id: obj.id, texto: obj.texto, tipo: obj.tipo,
    valor: Math.min(valor, meta), meta,
    progreso: limitar(valor / meta, 0, 1),
    hecho: valor >= meta,
  };
}

function evaluarCapitulo(cap, estado) {
  const objetivos = cap.objetivos.map((o) => evaluarObjetivo(o, estado));
  const hechos = objetivos.filter((o) => o.hecho).length;
  return {
    id: cap.id,
    objetivos,
    completado: hechos === objetivos.length,
    progreso: objetivos.length ? hechos / objetivos.length : 0,
  };
}

/**
 * Cierra el capitulo activo si esta completo y entrega el premio.
 * @returns {null|{capitulo, premios:[], subidas:[]}}
 */
function intentarCompletar(estado) {
  const cap = activo(estado);
  if (!cap) return null;
  const ev = evaluarCapitulo(cap, estado);
  if (!ev.completado) return null;
  return completar(estado, cap);
}

function completar(estado, cap) {
  const premios = [];
  const subidas = [];
  const p = cap.premio || {};
  for (const [hab, xp] of Object.entries(p.xp || {})) {
    const r = ganar(estado.jugador.habilidades, hab, xp);
    premios.push({ tipo: 'xp', habilidad: hab, xp });
    if (r.subio) subidas.push(r);
  }
  for (const o of p.objetos || []) {
    agregar(estado.jugador.inventario, o.id, o.cantidad, 99);
    premios.push({ tipo: 'objeto', id: o.id, cantidad: o.cantidad, nombre: OBJETOS[o.id]?.nombre });
  }
  for (const s of p.sabe || []) {
    if (!estado.sabe.includes(s)) estado.sabe.push(s);
    premios.push({ tipo: 'sabe', id: s });
  }
  estado.capitulos.hechos.push({ id: cap.id, dia: estado.dia });
  estado.capitulos.activo = null;
  estado.capitulos.marca = null;
  return { capitulo: cap, premios, subidas };
}

/** Resumen para el diario: que hay hecho, que hay activo y que viene despues. */
function resumen(estado) {
  const listos = hechos(estado);
  const act = activo(estado);
  return {
    activo: act ? { capitulo: act, ...evaluarCapitulo(act, estado) } : null,
    disponibles: disponibles(estado).filter((c) => c.id !== act?.id),
    hechos: CAPITULOS.filter((c) => listos.has(c.id)),
    total: CAPITULOS.length,
    completados: listos.size,
  };
}

  __exp.hechos = hechos;
  __exp.disponibles = disponibles;
  __exp.activo = activo;
  __exp.activar = activar;
  __exp.evaluarObjetivo = evaluarObjetivo;
  __exp.evaluarCapitulo = evaluarCapitulo;
  __exp.intentarCompletar = intentarCompletar;
  __exp.completar = completar;
  __exp.resumen = resumen;
});

__def("src/juego/contenido/dialogos.js", function (__exp, __req) {
/**
 * dialogos.js — Lo que dice la gente de la casa segun como va el dia.
 *
 * No son misiones: son la voz del sitio. Se eligen por condiciones (hora,
 * clima, estado del nino) para que la casa se sienta viva sin obligar a nada.
 */
const AMBIENTE = [
  { quien: 'mama', texto: 'No salgás sin comer algo, aunque sea un mango.', cuando: { horaMax: 8 } },

  { quien: 'mama', texto: 'Vení a comer antes de que se enfríe.', cuando: { horaMin: 11, horaMax: 14 } },

/** Frases del narrador al pasar cosas. Se usan como avisos con alma. */
const SUCESOS = {

  anochecer:   ['Se va la luz del día. En la casa no hay más luz que el fogón.', 'Las chicharras arrancan de golpe.'],
  primeraLluvia: ['Cae la primera gota, gorda, en el polvo. Y detrás, todas las demás.'],
  tormenta:    ['Truena cerca. El monte se calla de repente.'],
  hambre:      ['Te suenan las tripas.'],
  agotado:     ['Las piernas no dan más.'],
  cargado:     ['Vas cargado: pesás el doble y andás la mitad.'],
  banarse:     ['El agua está fría y se siente bien.'],
  lluviaJuego: ['Corrés bajo el agua sin ninguna razón. Esa es la razón.'],
  estrellas:   ['Sin luz eléctrica, el cielo se ve entero.'],
};

/**
 * Escoge una frase de ambiente que encaje con la situacion.
 * @param {object} ctx {hora, clima, necesidades, hogar, estacion}
 */
function frasePara(ctx, rnd = Math.random) {
  const validas = AMBIENTE.filter((d) => {
    const c = d.cuando || {};
    if (c.horaMin != null && ctx.hora < c.horaMin) return false;
    if (c.horaMax != null && ctx.hora > c.horaMax) return false;
    if (c.lluviaMin != null && (ctx.clima?.lluvia ?? 0) < c.lluviaMin) return false;
    if (c.nubosidadMin != null && (ctx.clima?.nubosidad ?? 0) < c.nubosidadMin) return false;
    if (c.nubosidadMax != null && (ctx.clima?.nubosidad ?? 0) > c.nubosidadMax) return false;
    if (c.aguanteMax != null && (ctx.necesidades?.aguante ?? 100) > c.aguanteMax) return false;
    if (c.higieneMax != null && (ctx.necesidades?.higiene ?? 100) > c.higieneMax) return false;
    if (c.estacion && ctx.estacion !== c.estacion) return false;
    if (c.sinAgua && (ctx.aguaEnCasa ?? 99) > 2) return false;
    return true;
  });
  if (!validas.length) return null;
  return validas[Math.floor(rnd() * validas.length)];
}

function suceso(clave, rnd = Math.random) {
  const lista = SUCESOS[clave];
  if (!lista || !lista.length) return null;
  return lista[Math.floor(rnd() * lista.length)];
}

__def("src/juego/ui/base.js", function (__exp, __req) {
/** base.js — Ayudas minimas de DOM para la interfaz del juego. */

function el(etiqueta, opciones = {}, hijos = []) {
  const n = document.createElement(etiqueta);
  if (opciones.clase) n.className = opciones.clase;
  if (opciones.texto != null) n.textContent = opciones.texto;
  if (opciones.html != null) n.innerHTML = opciones.html;
  if (opciones.estilo) n.setAttribute('style', opciones.estilo);
  if (opciones.id) n.id = opciones.id;
  if (opciones.titulo) n.title = opciones.titulo;
  for (const [k, v] of Object.entries(opciones.attr || {})) n.setAttribute(k, v);
  if (opciones.alPulsar) n.addEventListener('click', opciones.alPulsar);
  for (const h of hijos) if (h) n.appendChild(h);
  return n;
}

function boton(texto, opciones = {}) {
  return el('button', {
    clase: `boton ${opciones.clase || ''}`.trim(),
    texto,
    alPulsar: opciones.alPulsar,
    attr: opciones.desactivado ? { disabled: 'true' } : {},
    titulo: opciones.titulo,
  });
}

function vaciar(nodo) { while (nodo.firstChild) nodo.removeChild(nodo.firstChild); return nodo; }

/** Anillo de progreso en SVG (reloj del dia y medidores redondos). */
function anillo(progreso, { radio = 20, grosor = 3.5, color = '#f0b95c', fondo = 'rgba(255,255,255,.16)' } = {}) {
  const c = 2 * Math.PI * radio;
  const tam = (radio + grosor) * 2;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', tam); svg.setAttribute('height', tam);
  svg.setAttribute('viewBox', `0 0 ${tam} ${tam}`);
  const base = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  const arco = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  for (const [nodo, trazo, dash] of [[base, fondo, null], [arco, color, `${c * progreso} ${c}`]]) {
    nodo.setAttribute('cx', tam / 2); nodo.setAttribute('cy', tam / 2); nodo.setAttribute('r', radio);
    nodo.setAttribute('fill', 'none'); nodo.setAttribute('stroke', trazo);
    nodo.setAttribute('stroke-width', grosor); nodo.setAttribute('stroke-linecap', 'round');
    if (dash) nodo.setAttribute('stroke-dasharray', dash);
    svg.appendChild(nodo);
  }
  return svg;
}

/** Escala un valor 0..1 a porcentaje con dos decimales. */
function pct(v) { return `${Math.max(0, Math.min(1, v)) * 100}%`; }

  __exp.el = el;
  __exp.boton = boton;
  __exp.vaciar = vaciar;
  __exp.anillo = anillo;
  __exp.pct = pct;
});

 * El HUD no sabe reglas: recibe datos ya masticados y los pinta.

const { describirClima } = __req("src/juego/mundo/clima.js");
const { nombreFecha } = __req("src/juego/mundo/clima.js");

const ICONO_CLIMA = {

class Hud {

    this.raiz = raiz;
    this.capa = el('div', { clase: 'capa', id: 'capa-hud' });

    this.contexto = el('div', { id: 'contexto' });

    this.capa.append(this.reloj, this.objetivos, this.necesidades, this.avisos, this.contexto, this.botones);
    raiz.appendChild(this.capa);
    this._ultimoContexto = '';
  }

  /** Botones de arriba (inventario, habilidades, diario, pausa). */
  ponerBotones(lista) {
    vaciar(this.botones);
    for (const b of lista) {
      this.botones.appendChild(el('button', {
        clase: `boton ${b.clase || ''}`, texto: b.texto, titulo: b.titulo, alPulsar: b.alPulsar,
      }));
    }

  actualizar(d) {

    this.hora.textContent = d.reloj.texto;
    this.fecha.textContent = `Día ${d.dia} · ${nombreFecha(d.dia)}`;

    this.clima.textContent = `${ICONO_CLIMA[desc] || '🌤️'} ${desc} · ${Math.round(d.clima.temperatura)}°`;
    const fase = d.reloj.fase.id;
    this.iconoFase.textContent = { madrugada: '🌙', amanecer: '🌅', manana: '🌤️', mediodia: '☀️',

    vaciar(this.esfera).append(anillo(d.reloj.hora / 24, { radio: 19, grosor: 3, color: d.reloj.esNoche ? '#8fb8e8' : '#f0b95c' }), this.iconoFase);

    // --- necesidades
    for (const [id, { barra, relleno }] of Object.entries(this.barras)) {
      const v = (d.necesidades[id] ?? 100) / 100;
      relleno.style.width = pct(v);
      barra.classList.toggle('baja', v < 0.22);
    }
    const kg = d.peso.toFixed(1).replace('.', ',');
    this.carga.textContent = `🎒 ${kg} / ${d.cargaMaxima.toFixed(0)} kg`;
    this.carga.classList.toggle('pasado', d.peso > d.cargaMaxima * 0.92);
