__def("src/core/gps.js", function (__exp, __req) {
/**
 * gps.js — Verificacion de trayectos con datos del dispositivo.
 *
 * POR QUE NO GOOGLE FIT NI APPLE HEALTH: ninguna de las dos es alcanzable desde
 * una web estatica. Las APIs de Google Fit cerraron el registro de nuevas
 * aplicaciones en mayo de 2024 y se apagan a lo largo de 2026; su sustituto,
 * Health Connect, es nativo de Android. HealthKit de Apple es nativo de iOS y
 * nunca ha tenido interfaz web. Las que si tienen API web (Fitbit, Strava)
 * exigen intercambiar un secreto de cliente en servidor, imposible en GitHub
 * Pages sin backend.
 *
 * La alternativa que SI funciona hoy, en el navegador y sin cuentas ni
 * servidores, son las dos fuentes que este modulo implementa:
 *   1. GPS en vivo mediante la Geolocation API del propio navegador.
 *   2. Importacion de trazas GPX/TCX exportadas desde cualquier app.
 * Ambas producen distancia medida por el dispositivo, no declarada por la
 * persona, que es exactamente el objetivo: convertir el autorreporte en dato.
 */

/** Radio medio de la Tierra en metros (WGS-84). */
const RADIO_TIERRA = 6371008.8;

/** Descarta puntos cuya incertidumbre horizontal supere esto (metros). */
const PRECISION_MAXIMA = 60;

/** Velocidad por encima de la cual el salto es error de GPS, no movimiento (km/h). */
const VELOCIDAD_IMPOSIBLE = 200;

/** Distancia del circulo maximo entre dos coordenadas, en metros. */
function haversine(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * RADIO_TIERRA * Math.asin(Math.min(1, Math.sqrt(a)));
}

/**
 * Perfiles de velocidad por modo de transporte, en km/h.
 * Se comparan contra la MEDIANA de las velocidades por tramo, no contra la
 * media: un semaforo largo o un pico de GPS no deben cambiar el diagnostico.
 */
const PERFILES = Object.freeze([
  { modo: 'mov_caminar', etiqueta: 'A pie', icono: '🚶', tipica: 4.8, minMediana: 1.5, maxMediana: 7.5, maxPico: 14 },
  { modo: 'mov_correr', etiqueta: 'Corriendo', icono: '🏃', tipica: 10, minMediana: 7.5, maxMediana: 16, maxPico: 26 },
  { modo: 'mov_bici', etiqueta: 'En bicicleta', icono: '🚲', tipica: 16, minMediana: 8, maxMediana: 32, maxPico: 60 },
  { modo: 'mov_transporte', etiqueta: 'Vehiculo', icono: '🚗', tipica: 40, minMediana: 20, maxMediana: 130, maxPico: VELOCIDAD_IMPOSIBLE },
]);

/** Mediana sin dependencias (el modulo debe poder usarse aislado). */
function mediana(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/**
 * Analiza una traza de puntos y devuelve metricas verificables.
 * @param {Array<{lat:number, lon:number, t:number|string, precision?:number}>} puntos
 * @returns {{valida:boolean, motivo?:string, distanciaKm:number, duracionMin:number,
 *            velocidadMedia:number, velocidadMediana:number, velocidadMaxima:number,
 *            modo:object|null, puntosUsados:number, puntosDescartados:number}}
 */
function analizarTraza(puntos) {
  const vacio = {
    valida: false, distanciaKm: 0, duracionMin: 0, velocidadMedia: 0,
    velocidadMediana: 0, velocidadMaxima: 0, modo: null,
    puntosUsados: 0, puntosDescartados: 0,
  };

  const limpios = (puntos || [])
    .map((p) => ({
      lat: Number(p.lat), lon: Number(p.lon),
      t: typeof p.t === 'number' ? p.t : new Date(p.t).getTime(),
      precision: Number.isFinite(p.precision) ? p.precision : 0,
    }))
    .filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon) && Number.isFinite(p.t)
      && Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180
      && (p.precision === 0 || p.precision <= PRECISION_MAXIMA))
    .sort((a, b) => a.t - b.t);

  const descartadosPorFiltro = (puntos || []).length - limpios.length;

  if (limpios.length < 2) {
    return { ...vacio, motivo: 'La traza necesita al menos dos puntos validos.', puntosDescartados: descartadosPorFiltro };
  }

  let distancia = 0;
  let saltos = 0;
  const velocidades = [];

  for (let i = 1; i < limpios.length; i++) {
    const a = limpios[i - 1], b = limpios[i];
    const dt = (b.t - a.t) / 1000; // segundos
    const d = haversine(a.lat, a.lon, b.lat, b.lon);
    if (dt <= 0) continue;

    const kmh = (d / dt) * 3.6;
    // Un salto imposible es error del sensor: se descarta el tramo entero,
    // no se promedia. Promediarlo contaminaria distancia y velocidad a la vez.
    if (kmh > VELOCIDAD_IMPOSIBLE) { saltos++; continue; }
    // Ruido en parado: por debajo de 0,5 km/h el GPS deriva sin que nadie ande.
    if (kmh < 0.5) continue;

    distancia += d;
    velocidades.push(kmh);
  }

  if (!velocidades.length) {
    return { ...vacio, motivo: 'No se detecto movimiento real en la traza.', puntosDescartados: descartadosPorFiltro + saltos };
  }

  const duracionSeg = (limpios[limpios.length - 1].t - limpios[0].t) / 1000;
  const distanciaKm = distancia / 1000;
  const duracionMin = duracionSeg / 60;
  const vMediana = mediana(velocidades);
  const vMaxima = Math.max(...velocidades);
  const vMedia = duracionSeg > 0 ? (distanciaKm / (duracionSeg / 3600)) : 0;

  return {
    valida: true,
    distanciaKm: Math.round(distanciaKm * 1000) / 1000,
    duracionMin: Math.round(duracionMin * 10) / 10,
    velocidadMedia: Math.round(vMedia * 10) / 10,
    velocidadMediana: Math.round(vMediana * 10) / 10,
    velocidadMaxima: Math.round(vMaxima * 10) / 10,
    modo: inferirModo(vMediana, vMaxima),
    puntosUsados: limpios.length,
    puntosDescartados: descartadosPorFiltro + saltos,
  };
}

/**
 * Deduce el modo de transporte del perfil de velocidades.
 * Devuelve tambien una confianza, porque los rangos se solapan: 10 km/h puede
 * ser una bici lenta o una carrera rapida, y fingir certeza seria deshonesto.
 */
function inferirModo(mediana_, maxima) {
  const candidatos = PERFILES.filter(
    (p) => mediana_ >= p.minMediana && mediana_ <= p.maxMediana && maxima <= p.maxPico
  );
  if (!candidatos.length) {
    return { modo: null, etiqueta: 'No determinado', icono: '❓', confianza: 0,
      nota: 'El perfil de velocidad no encaja con ningun modo conocido.' };
  }
  // Con solapamiento, gana el modo cuya velocidad TIPICA esta mas cerca, no el
  // centro del rango: el centro es un artefacto de donde se trazaron los limites.
  // A 15 km/h ambos rangos encajan, pero eso es una bici tranquila y una carrera
  // de nivel casi profesional; la velocidad tipica recoge esa asimetria real.
  const elegido = candidatos.reduce((mejor, p) =>
    Math.abs(mediana_ - p.tipica) < Math.abs(mediana_ - mejor.tipica) ? p : mejor);
  const confianza = candidatos.length === 1 ? 0.9 : Math.round((1 / candidatos.length) * 100) / 100;
  return {
    modo: elegido.modo,
    etiqueta: elegido.etiqueta,
    icono: elegido.icono,
    confianza,
    nota: candidatos.length > 1
      ? `Compatible tambien con: ${candidatos.filter((c) => c !== elegido).map((c) => c.etiqueta).join(', ')}.`
      : '',
  };
}

/**
 * Seguimiento en vivo. Devuelve un controlador con detener() y estado actual.
 * No hace nada por su cuenta: quien llama decide cuando parar y que registrar.
 */
function iniciarSeguimiento({ alActualizar = () => {} } = {}) {
  if (typeof navigator === 'undefined' || !navigator.geolocation) {
    throw new Error('Este navegador no ofrece geolocalizacion.');
  }
  const puntos = [];
  let error = null;

  const id = navigator.geolocation.watchPosition(
    (pos) => {
      puntos.push({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        t: pos.timestamp,
        precision: pos.coords.accuracy,
      });
      alActualizar(analizarTraza(puntos), puntos.length);
    },
    (err) => {
      error = err.code === 1
        ? 'Permiso de ubicacion denegado.'
        : 'No se pudo seguir la posicion.';
      alActualizar(analizarTraza(puntos), puntos.length, error);
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );

  return {
    detener() {
      navigator.geolocation.clearWatch(id);
      return { resumen: analizarTraza(puntos), puntos, error };
    },
    puntos,
  };
}

/**
 * Coherencia entre lo que la traza mide y lo que la persona quiere registrar.
 * Es el nucleo de la verificacion: no basta con tener GPS, hay que comprobar
 * que el GPS respalda ESA accion y ESA cantidad.
 */
function verificarContra(resumen, accionId, cantidadDeclarada) {
  if (!resumen?.valida) {
    return { verificado: false, motivo: resumen?.motivo || 'Traza no valida.', cantidadSugerida: null };
  }
  const medida = resumen.distanciaKm;
  const declarada = Number(cantidadDeclarada);

  if (resumen.modo?.modo && resumen.modo.modo !== accionId && resumen.modo.confianza >= 0.9) {
    return {
      verificado: false,
      motivo: `La traza parece "${resumen.modo.etiqueta}" (mediana ${resumen.velocidadMediana} km/h), no la accion elegida.`,
      cantidadSugerida: medida,
    };
  }
  if (!Number.isFinite(declarada) || declarada <= 0) {
    return { verificado: true, motivo: '', cantidadSugerida: medida };
  }
  // Se tolera un 15 % de diferencia: el GPS tiene error propio y las trazas
  // urbanas se acortan bajo tuneles y edificios altos.
  const desvio = Math.abs(declarada - medida) / Math.max(medida, 0.001);
  if (desvio > 0.15) {
    return {
      verificado: false,
      motivo: `Has declarado ${declarada} km pero el GPS midio ${medida.toFixed(2)} km.`,
      cantidadSugerida: medida,
    };
  }
  return { verificado: true, motivo: '', cantidadSugerida: medida };
}

  __exp.haversine = haversine;
  __exp.PERFILES = PERFILES;
  __exp.analizarTraza = analizarTraza;
  __exp.inferirModo = inferirModo;
  __exp.iniciarSeguimiento = iniciarSeguimiento;
  __exp.verificarContra = verificarContra;
});

__def("src/core/gpx.js", function (__exp, __req) {
/**
 * gpx.js — Lectura de trazas exportadas desde cualquier aplicacion.
 *
 * Es la via de verificacion que funciona con TODOS los ecosistemas, incluidos
 * los que no ofrecen API web: Strava, Garmin, Komoot, Apple Salud y Google Fit
 * exportan GPX o TCX. La persona descarga su archivo y lo suelta aqui; el
 * analisis ocurre entero en el navegador y el archivo no sale del dispositivo.
 *
 * Se analiza con expresiones regulares en vez de DOMParser a proposito: asi el
 * modulo es puro, funciona igual en Node y en el navegador, y se puede probar
 * sin simular un DOM.
 */

/** Extrae los puntos de una traza GPX. */
function parsearGPX(texto) {
  const xml = String(texto || '');
  const puntos = [];

  // <trkpt lat="..." lon="..."> ... </trkpt>  (tambien <rtept> y <wpt>)
  const re = /<(?:trkpt|rtept|wpt)\b[^>]*?\blat\s*=\s*"([-\d.]+)"[^>]*?\blon\s*=\s*"([-\d.]+)"[^>]*?(?:\/>|>([\s\S]*?)<\/(?:trkpt|rtept|wpt)>)/gi;
  let m;
  while ((m = re.exec(xml)) !== null) {
    const lat = parseFloat(m[1]);
    const lon = parseFloat(m[2]);
    const cuerpo = m[3] || '';
    const tiempo = cuerpo.match(/<time>([^<]+)<\/time>/i);
    puntos.push({
      lat,
      lon,
      t: tiempo ? new Date(tiempo[1]).getTime() : NaN,
      precision: 0,
    });
  }
  return puntos;
}

/** Extrae los puntos de un archivo TCX (Garmin). */
function parsearTCX(texto) {
  const xml = String(texto || '');
  const puntos = [];
  const re = /<Trackpoint>([\s\S]*?)<\/Trackpoint>/gi;
  let m;
  while ((m = re.exec(xml)) !== null) {
    const b = m[1];
    const lat = b.match(/<LatitudeDegrees>([-\d.]+)<\/LatitudeDegrees>/i);
    const lon = b.match(/<LongitudeDegrees>([-\d.]+)<\/LongitudeDegrees>/i);
    const t = b.match(/<Time>([^<]+)<\/Time>/i);
    if (lat && lon) {
      puntos.push({
        lat: parseFloat(lat[1]),
        lon: parseFloat(lon[1]),
        t: t ? new Date(t[1]).getTime() : NaN,
        precision: 0,
      });
    }
  }
  return puntos;
}

/** Detecta el formato y devuelve los puntos, sea cual sea. */
function parsearTraza(texto, nombreArchivo = '') {
  const t = String(texto || '');
  const esTCX = /<TrainingCenterDatabase|<Trackpoint>/i.test(t) || /\.tcx$/i.test(nombreArchivo);
  const puntos = esTCX ? parsearTCX(t) : parsearGPX(t);
  return {
    formato: esTCX ? 'TCX' : 'GPX',
    puntos,
    conTiempo: puntos.filter((p) => Number.isFinite(p.t)).length,
    total: puntos.length,
  };
}

/**
 * Metadatos utiles del archivo: nombre de la actividad y fecha.
 * Sirven para que el registro conserve de donde salio la prueba.
 */
function metadatosTraza(texto) {
  const xml = String(texto || '');
  const nombre = xml.match(/<name>([^<]+)<\/name>/i);
  const primeraFecha = xml.match(/<time>([^<]+)<\/time>/i);
  const creador = xml.match(/\bcreator\s*=\s*"([^"]+)"/i);
  return {
    nombre: nombre ? nombre[1].trim() : null,
    fecha: primeraFecha ? primeraFecha[1] : null,
    aplicacion: creador ? creador[1] : null,
  };
}

  __exp.parsearGPX = parsearGPX;
  __exp.parsearTCX = parsearTCX;
  __exp.parsearTraza = parsearTraza;
  __exp.metadatosTraza = metadatosTraza;
});

__def("src/ui/vistas/registrar.js", function (__exp, __req) {
/** registrar.js — Catalogo de acciones y formulario de registro. */
const { el, num, co2, toast, modal, esc, vacio } = __req("src/ui/componentes.js");
const { CATEGORIAS, RAREZAS, categoriasConAcciones, accion } = __req("src/data/acciones.js");
const { calcularImpacto } = __req("src/core/impacto.js");
const { calcularPuntos } = __req("src/core/puntos.js");
const { validarRegistro, NIVELES } = __req("src/core/validacion.js");
const { claveDia } = __req("src/core/rachas.js");
const { iniciarSeguimiento, analizarTraza, verificarContra } = __req("src/core/gps.js");
const { parsearTraza, metadatosTraza } = __req("src/core/gpx.js");
const { procesarMedio, selectorMedio, guardarMedio, LIMITE_ARCHIVO_MB } = __req("src/ui/medios.js");
const { evaluarEvidencia, NIVELES_EVIDENCIA } = __req("src/core/evidencia.js");

let filtroCat = 'todas';
let busqueda = '';

function vistaRegistrar(ctx) {
  const estado = ctx.almacen.get();
  const raiz = el('div');

  raiz.appendChild(el('h1', { texto: 'Registrar accion' }));
  raiz.appendChild(el('p', { clase: 'sub',
    texto: 'Cada accion se convierte en impacto fisico medible y, a partir de ahi, en puntos. Todos los factores llevan fuente cientifica: pulsa una tarjeta para verla.' }));

  // ------------------------------------------------------------- buscador
  const entrada = el('input', {
    type: 'search', placeholder: 'Buscar accion... (bici, compostar, ducha)', value: busqueda,
    oninput: (e) => { busqueda = e.target.value.toLowerCase(); pintar(); },
  });
  raiz.appendChild(el('div', { estilo: 'margin-bottom:15px' }, [entrada]));

  // --------------------------------------------------------------- filtros
  const chips = el('div', { clase: 'fila envuelve scroll-x', estilo: 'margin-bottom:20px;gap:7px' });
  const mkChip = (id, etiqueta, icono) => el('button', {
    clase: `chip${filtroCat === id ? ' activo' : ''}`,
    texto: `${icono} ${etiqueta}`,
    onclick: () => { filtroCat = id; pintar(); },
  });
  chips.appendChild(mkChip('todas', 'Todas', '🌐'));
  for (const [id, meta] of Object.entries(CATEGORIAS)) chips.appendChild(mkChip(id, meta.etiqueta, meta.icono));
  raiz.appendChild(chips);

  const lista = el('div');
  raiz.appendChild(lista);

  function pintar() {
    // Refresca el estado visual de los chips sin reconstruir la vista entera.
    [...chips.children].forEach((c, i) => {
      const id = i === 0 ? 'todas' : Object.keys(CATEGORIAS)[i - 1];
      c.className = `chip${filtroCat === id ? ' activo' : ''}`;
    });
    lista.innerHTML = '';
    const grupos = categoriasConAcciones()
      .filter((g) => filtroCat === 'todas' || g.id === filtroCat)
      .map((g) => ({
        ...g,
        acciones: g.acciones.filter((a) => !busqueda
          || a.titulo.toLowerCase().includes(busqueda)
          || a.consejo.toLowerCase().includes(busqueda)),
      }))
      .filter((g) => g.acciones.length);

    if (!grupos.length) {
      lista.appendChild(vacio('🔍', 'Sin resultados', 'Prueba con otro termino'));
      return;
    }

    for (const g of grupos) {
      lista.appendChild(el('div', { clase: 'seccion' }, [
        el('div', { clase: 'fila', estilo: 'margin-bottom:11px' }, [
          el('span', { estilo: 'font-size:19px', texto: g.icono }),
          el('h2', { estilo: 'margin:0', texto: g.etiqueta }),
          el('span', { clase: 'mini', texto: `${g.acciones.length} acciones` }),
        ]),
        el('div', { clase: 'rejilla auto' }, g.acciones.map((a) => tarjetaAccion(a, ctx))),
      ]));
    }
  }

  pintar();
  return raiz;
}

/** Tarjeta de una accion con estimacion de impacto para 1 unidad. */
function tarjetaAccion(a, ctx) {
  const estado = ctx.almacen.get();
  const impacto = calcularImpacto(a.id, 1, { pais: estado.perfil.pais });
  const pts = calcularPuntos({ accionId: a.id, impacto }).puntos;
  const rareza = RAREZAS[a.rareza];

  return el('div', {
    clase: 'tarjeta interactiva',
    onclick: () => abrirFormulario(a, ctx),
    role: 'button', tabindex: '0',
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirFormulario(a, ctx); } },
  }, [
    el('div', { clase: 'fila entre', estilo: 'margin-bottom:9px' }, [
      el('span', { estilo: 'font-size:25px', texto: a.icono }),
      el('span', { clase: 'pastilla', estilo: `background:${rareza.color}22;color:${rareza.color}`, texto: rareza.etiqueta }),
    ]),
    el('div', { estilo: 'font-weight:700;font-size:14.5px;margin-bottom:5px', texto: a.titulo }),
    el('div', { clase: 'mini', estilo: 'margin-bottom:11px;min-height:32px', texto: a.consejo }),
    el('div', { clase: 'fila entre', estilo: 'padding-top:9px;border-top:1px solid var(--borde)' }, [
      el('span', { clase: 'mini mono', texto: impacto.co2e > 0 ? `${co2(impacto.co2e)} / ${a.unidad}` : `${num(impacto.agua)} L / ${a.unidad}` }),
      el('span', { clase: 'mono', estilo: 'color:var(--ambar);font-weight:700;font-size:13px', texto: `+${pts} pts` }),
    ]),
  ]);
}

/** Formulario modal de registro con vista previa en vivo del impacto. */
function abrirFormulario(a, ctx) {
  const estado = ctx.almacen.get();
  const hoy = claveDia();
  const yaHoy = estado.registros
    .filter((r) => r.accionId === a.id && claveDia(new Date(r.fecha)) === hoy)
    .reduce((s, r) => s + r.cantidad, 0);
  const restante = Math.max(0, a.maxDiario - yaHoy);

  const inicial = Math.min(restante || 1, a.unidad === 'km' ? 5 : a.unidad === 'min' ? 5 : 1);
  const campo = el('input', { type: 'number', min: '0.1', step: '0.1', value: String(inicial), inputmode: 'decimal' });
  const deslizador = el('input', {
    type: 'range', min: '0.5', max: String(Math.max(1, a.maxDiario)), step: '0.5', value: String(inicial),
  });
  const nota = el('input', { type: 'text', placeholder: 'Nota opcional (donde, con quien...)' });
  const evidencia = el('input', { type: 'checkbox' });
  const previa = el('div', { clase: 'tarjeta', estilo: 'margin:15px 0' });

  // Se declara aqui, antes de 'actualizar', porque esa funcion lee 'medio' para
  // mostrar el multiplicador por evidencia y se invoca nada mas definirse.
  let medio = null;

  const actualizar = (valor) => {
    const q = Math.max(0, Number(valor) || 0);
    const imp = calcularImpacto(a.id, q, { pais: estado.perfil.pais });
    const { puntos, desglose } = calcularPuntos({ accionId: a.id, impacto: imp });
    const val = validarRegistro({ accionId: a.id, cantidad: q }, estado.registros);
    previa.innerHTML = `
      <div class="etiqueta">Impacto estimado</div>
      <div class="rejilla c3" style="margin-top:11px">
        <div><div class="metrica-valor s" style="color:var(--verde)">${esc(co2(imp.co2e))}</div><div class="mini">CO2e evitado</div></div>
        <div><div class="metrica-valor s" style="color:var(--cian)">${esc(num(imp.agua))} L</div><div class="mini">agua</div></div>
        <div><div class="metrica-valor s" style="color:var(--ambar)">+${puntos}</div><div class="mini">puntos</div></div>
      </div>
      <div class="divisor"></div>
      <div class="mini"><strong>Linea base:</strong> ${esc(a.base)}</div>
      <div class="mini" style="margin-top:5px"><strong>Formula:</strong> ${desglose.porCO2e} (CO2e) + ${desglose.porAgua} (agua) + ${desglose.porResiduo} (residuo)
        × dificultad ${desglose.factores.dificultad} × rareza ${desglose.factores.rareza}${
          medio ? ` × evidencia ${evaluarEvidencia({ tipo: medio.tipo, exif: medio.exif, fechaArchivo: medio.fechaArchivo, hash: medio.hash, hashesPrevios: estado.medios || [], ancho: medio.ancho, alto: medio.alto }).factor}` : ''}</div>
      ${val.mensajes.length ? `<div class="aviso ${val.nivel === 'bloqueo' ? 'error' : 'alerta'}" style="margin-top:11px">
        <span>${val.nivel === 'bloqueo' ? '⛔' : '⚠️'}</span><div>${val.mensajes.map(esc).join('<br>')}</div></div>` : ''}`;
  };

  campo.addEventListener('input', () => { deslizador.value = campo.value; actualizar(campo.value); });
  deslizador.addEventListener('input', () => { campo.value = deslizador.value; actualizar(deslizador.value); });
  actualizar(inicial);

  // Prueba aportada por el dispositivo, si la hay.
  let prueba = null;
  const aplicarMedida = (km, detalle) => {
    const v = Math.max(0.01, Math.round(km * 100) / 100);
    campo.value = String(v);
    deslizador.value = String(Math.min(Number(deslizador.max), v));
    prueba = detalle;
    actualizar(v);
  };
  const bloqueGPS = a.cat === 'movilidad' && a.unidad === 'km'
    ? construirVerificacion(a, aplicarMedida)
    : null;

  // Prueba grafica: solo para acciones que se pueden fotografiar de verdad.
  const bloqueMedios = a.evidencia !== 'ninguna'
    ? construirMedios(a, estado, (m) => { medio = m; actualizar(campo.value); })
    : null;

  const contenido = el('div', {}, [
    el('div', { clase: 'fila', estilo: 'margin-bottom:15px' }, [
      el('span', { estilo: 'font-size:33px', texto: a.icono }),
      el('div', {}, [
        el('div', { estilo: 'font-weight:700;font-size:16px', texto: a.titulo }),
        el('div', { clase: 'mini', texto: `${CATEGORIAS[a.cat].etiqueta} · dificultad ${a.dificultad}/5 · ${RAREZAS[a.rareza].etiqueta}` }),
      ]),
    ]),
    restante <= 0
      ? el('div', { clase: 'aviso error' }, ['⛔ Ya has alcanzado el maximo diario de esta accion. Vuelve manana.'])
      : el('div', {}, [
        el('label', { clase: 'campo' }, [
          `Cantidad en ${a.unidad} (maximo hoy: ${num(restante)})`,
          el('div', { clase: 'fila' }, [campo, el('span', { clase: 'mini', estilo: 'width:38px', texto: a.unidad })]),
        ]),
        el('div', { estilo: 'margin:11px 0' }, [deslizador]),
        el('label', { clase: 'campo', estilo: 'margin-bottom:9px' }, ['Nota', nota]),
        a.evidencia !== 'ninguna'
          ? el('label', { clase: 'fila', estilo: 'gap:7px;font-size:13px;color:var(--texto-2);cursor:pointer' },
            [evidencia, `Tengo evidencia (${a.evidencia}) — sube el indice de confianza`])
          : null,
        bloqueGPS,
        bloqueMedios,
        previa,
        el('button', {
          clase: 'btn primario bloque',
          texto: 'Registrar',
          onclick: async () => {
            const res = ctx.almacen.registrar(a.id, Number(campo.value), {
              nota: [nota.value, prueba?.resumen].filter(Boolean).join(' · '),
              evidencia: prueba ? 'gps' : (evidencia.checked ? a.evidencia : null),
              prueba: prueba || null,
              medio,
            });
            if (!res.ok) {
              toast({ titulo: 'No se pudo registrar', texto: res.mensajes.join(' '), tipo: 'error', icono: '⛔' });
              return;
            }
            // El binario solo se guarda si el registro salio adelante, para no
            // dejar archivos huerfanos ocupando espacio.
            if (medio?.blob && medio.id) {
              try {
                await guardarMedio({
                  id: medio.id, registroId: res.registro.id, blob: medio.blob,
                  tipo: medio.tipo, portada: medio.portada || null, fecha: new Date().toISOString(),
                });
              } catch (e) {
                toast({ titulo: 'La prueba no se pudo guardar', texto: 'El registro si se guardo.', tipo: 'error', icono: '⚠️' });
              }
            }
            cerrar();
            celebrar(res, a);
            ctx.refrescar();
          },
        }),
      ]),
    el('div', { clase: 'divisor' }),
    el('div', { clase: 'mini' }, [el('strong', { texto: 'Base cientifica: ' }), a.base]),
  ]);

  const cerrar = modal(contenido, { titulo: 'Nuevo registro' });
}

/** Cascada de notificaciones tras un registro correcto. */
function celebrar(res, a) {
  toast({
    titulo: `+${res.puntos} puntos`,
    texto: `${a.titulo} · ${co2(res.registro.impacto.co2e)} CO2e evitados`,
    icono: a.icono, tipo: 'exito',
  });
  if (res.mensajes?.length) {
    toast({ titulo: 'Registro ajustado', texto: res.mensajes.join(' '), tipo: 'error', icono: '⚠️', duracion: 6000 });
  }
  for (const l of res.logrosNuevos || []) {
    toast({ titulo: `Insignia: ${l.titulo}`, texto: l.desc, icono: l.icono, tipo: 'logro', duracion: 6500 });
  }
  for (const m of res.misionesCompletadas || []) {
    toast({ titulo: `Mision completada: ${m.titulo}`, texto: `+${m.recompensa.puntos} pts · +${m.recompensa.xp} XP`, icono: '🎯', tipo: 'logro', duracion: 6500 });
  }
  if (res.ascenso?.subioNivel) {
    toast({ titulo: `¡Nivel ${res.ascenso.nivelNuevo}!`, texto: res.ascenso.subioRango ? `Nuevo rango: ${res.ascenso.rangoNuevo.nombre}` : 'Sigue asi', icono: '🚀', tipo: 'logro', duracion: 6500 });
  }
  if (res.congelacionesGanadas > 0) {
    toast({ titulo: 'Congelacion de racha ganada', texto: 'Te protege un dia perdido', icono: '🧊', tipo: 'exito' });
  }
  if (res.bonusDiversidad?.factor > 1) {
    toast({ titulo: res.bonusDiversidad.etiqueta, texto: 'Por repartir el esfuerzo entre categorias', icono: '🧭', tipo: 'exito' });
  }
}


/**
 * Bloque de verificacion con datos del dispositivo.
 *
 * Convierte el autorreporte en medicion: o el GPS del navegador sigue el
 * trayecto en vivo, o la persona suelta una traza exportada desde la app que
 * ya use. En ambos casos la distancia la mide el dispositivo, no la teclea
 * quien registra, y el resultado se contrasta contra la accion elegida.
 */
function construirVerificacion(a, aplicarMedida) {
  const salida = el('div', { clase: 'tarjeta', estilo: 'margin-top:13px' });
  let seguimiento = null;

  const pintar = (estado = {}) => {
    salida.innerHTML = '';
    salida.appendChild(el('div', { clase: 'etiqueta', texto: 'Verificacion con tu dispositivo' }));

    if (seguimiento) {
      const r = estado.resumen || {};
      salida.appendChild(el('div', { estilo: 'margin:11px 0' }, [
        el('div', { clase: 'fila entre' }, [
          el('span', { clase: 'metrica-valor s pulso', texto: `${num(r.distanciaKm || 0, 2)} km` }),
          el('span', { clase: 'mini', texto: `${estado.puntos || 0} puntos GPS` }),
        ]),
        el('div', { clase: 'mini', estilo: 'margin-top:5px',
          texto: r.velocidadMediana
            ? `${num(r.velocidadMediana, 1)} km/h de mediana · ${r.modo?.etiqueta || 'analizando'}`
            : 'Buscando senal... manten esta pantalla abierta.' }),
      ]));
      salida.appendChild(el('button', {
        clase: 'btn bloque', texto: '⏹️ Detener y usar esta medicion',
        onclick: () => {
          const { resumen } = seguimiento.detener();
          seguimiento = null;
          if (!resumen.valida) { pintar({ error: resumen.motivo }); return; }
          const v = verificarContra(resumen, a.id, null);
          aplicarMedida(resumen.distanciaKm, {
            via: 'gps-vivo',
            resumen: `GPS: ${num(resumen.distanciaKm, 2)} km en ${num(resumen.duracionMin, 0)} min`,
            modo: resumen.modo?.etiqueta,
            confianza: resumen.modo?.confianza ?? 0,
          });
          pintar({ hecho: resumen, aviso: v.verificado ? '' : v.motivo });
        },
      }));
      return;
    }

    if (estado.hecho) {
      const r = estado.hecho;
      salida.appendChild(el('div', { clase: 'aviso exito', estilo: 'margin:11px 0' }, [
        el('span', { texto: '✅' }),
        el('div', {}, [
          el('strong', { texto: `${num(r.distanciaKm, 2)} km medidos por el dispositivo` }),
          el('div', { clase: 'mini', estilo: 'margin-top:3px;color:inherit;opacity:.85',
            texto: `${num(r.velocidadMediana, 1)} km/h de mediana · ${r.modo?.etiqueta || '—'}${
              r.modo?.confianza ? ` (confianza ${Math.round(r.modo.confianza * 100)} %)` : ''}${
              r.puntosDescartados ? ` · ${r.puntosDescartados} puntos descartados por ruido` : ''}` }),
        ]),
      ]));
      if (estado.aviso) {
        salida.appendChild(el('div', { clase: 'aviso alerta', estilo: 'margin-bottom:11px' }, ['⚠️ ' + estado.aviso]));
      }
    }

    if (estado.error) {
      salida.appendChild(el('div', { clase: 'aviso error', estilo: 'margin:11px 0' }, ['⚠️ ' + estado.error]));
    }

    salida.appendChild(el('div', { clase: 'fila envuelve', estilo: 'gap:7px;margin-top:11px' }, [
      el('button', {
        clase: 'btn s', texto: '📍 Seguir con GPS',
        onclick: () => {
          try {
            seguimiento = iniciarSeguimiento({
              alActualizar: (resumen, puntos, err) => pintar(err ? { error: err } : { resumen, puntos }),
            });
            pintar({ resumen: {}, puntos: 0 });
          } catch (e) { pintar({ error: e.message }); }
        },
      }),
      (() => {
        const archivo = el('input', { type: 'file', accept: '.gpx,.tcx,application/gpx+xml,text/xml', estilo: 'display:none' });
        archivo.addEventListener('change', async () => {
          const f = archivo.files?.[0];
          if (!f) return;
          try {
            const texto = await f.text();
            const { puntos, formato, conTiempo, total } = parsearTraza(texto, f.name);
            if (!total) { pintar({ error: 'El archivo no contiene puntos de traza legibles.' }); return; }
            if (!conTiempo) { pintar({ error: `Se leyeron ${total} puntos ${formato}, pero ninguno trae hora: sin tiempos no se puede calcular velocidad ni verificar el modo.` }); return; }
            const resumen = analizarTraza(puntos);
            if (!resumen.valida) { pintar({ error: resumen.motivo }); return; }
            const meta = metadatosTraza(texto);
            const v = verificarContra(resumen, a.id, null);
            aplicarMedida(resumen.distanciaKm, {
              via: `archivo-${formato.toLowerCase()}`,
              resumen: `${formato}${meta.aplicacion ? ` de ${meta.aplicacion}` : ''}: ${num(resumen.distanciaKm, 2)} km`,
              modo: resumen.modo?.etiqueta,
              confianza: resumen.modo?.confianza ?? 0,
            });
            pintar({ hecho: resumen, aviso: v.verificado ? '' : v.motivo });
          } catch (e) {
            pintar({ error: 'No se pudo leer el archivo.' });
          }
        });
        const boton = el('button', { clase: 'btn s', texto: '📂 Importar GPX / TCX', onclick: () => archivo.click() });
        return el('span', {}, [boton, archivo]);
      })(),
    ]));

    salida.appendChild(el('div', { clase: 'mini', estilo: 'margin-top:9px' },
      ['Exporta la actividad desde Strava, Garmin, Komoot o Apple Salud y sueltala aqui. El archivo se analiza en tu navegador y no se envia a ningun sitio.']));
  };

  pintar();
  return salida;
}


/**
 * Bloque de prueba grafica.
 *
 * Que la persona adjunte una foto no verifica nada por si solo: cualquiera
 * descarga una imagen. Lo que suma puntos es lo COMPROBABLE de esa foto —que
 * se tomo hoy, cerca de ti, y que no se ha usado antes—, y eso se evalua aqui
 * mismo, en el navegador, mostrando el razonamiento completo.
 */
function construirMedios(a, estado, alAdjuntar) {
  const caja = el('div', { clase: 'tarjeta', estilo: 'margin-top:13px' });
  let actual = null;

  const pintar = (error = null, cargando = false) => {
    caja.innerHTML = '';
    caja.appendChild(el('div', { clase: 'fila entre', estilo: 'margin-bottom:9px' }, [
      el('span', { clase: 'etiqueta', texto: 'Prueba con foto o video' }),
      actual ? el('button', {
        clase: 'btn s', texto: 'Quitar',
        onclick: () => { if (actual?.url) URL.revokeObjectURL(actual.url); actual = null; alAdjuntar(null); pintar(); },
      }) : null,
    ]));

    if (cargando) {
      caja.appendChild(el('div', { clase: 'aviso info pulso' }, ['⏳ Procesando la prueba...']));
      return;
    }
    if (error) {
      caja.appendChild(el('div', { clase: 'aviso error', estilo: 'margin-bottom:11px' }, ['⚠️ ' + error]));
    }

    if (actual) {
      const ev = evaluarEvidencia({
        tipo: actual.tipo, exif: actual.exif, fechaArchivo: actual.fechaArchivo,
        hash: actual.hash, hashesPrevios: estado.medios || [],
        ancho: actual.ancho, alto: actual.alto, bytes: actual.bytes,
      });
      const meta = NIVELES_EVIDENCIA[ev.nivel];

      caja.appendChild(el('div', { clase: 'fila', estilo: 'gap:13px;align-items:flex-start;margin-bottom:11px' }, [
        actual.tipo === 'video'
          ? el('video', { src: actual.url, controls: 'true', playsinline: 'true', muted: 'true',
              estilo: 'width:150px;border-radius:9px;background:#000' })
          : el('img', { src: actual.url, alt: 'Prueba adjunta',
              estilo: 'width:150px;border-radius:9px;object-fit:cover' }),
        el('div', { clase: 'crece' }, [
          el('div', { clase: 'pastilla', estilo: `background:${meta.color}22;color:${meta.color};margin-bottom:7px`,
            texto: `${meta.etiqueta} · ×${ev.factor}` }),
          el('ul', { estilo: 'margin:0 0 0 17px;padding:0;font-size:11.5px;color:var(--texto-2);line-height:1.6' },
            ev.motivos.map((m) => el('li', { texto: m }))),
          actual.tipo === 'video' && actual.duracion
            ? el('div', { clase: 'mini', estilo: 'margin-top:5px', texto: `${actual.duracion} s de video` })
            : null,
        ]),
      ]));
    }

    const input = selectorMedio(async (file) => {
      pintar(null, true);
      try {
        const m = await procesarMedio(file);
        m.id = `m_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
        if (actual?.url) URL.revokeObjectURL(actual.url);
        actual = m;
        alAdjuntar(m);
        pintar();
      } catch (e) {
        actual = null;
        alAdjuntar(null);
        pintar(e.message || 'No se pudo procesar el archivo.');
      }
    });

    caja.appendChild(el('div', { clase: 'fila envuelve', estilo: 'gap:7px' }, [
      el('button', {
        clase: `btn s${actual ? '' : ' primario'}`,
        texto: actual ? '🔄 Cambiar prueba' : '📷 Hacer foto o video',
        onclick: () => input.click(),
      }),
      input,
    ]));

    caja.appendChild(el('div', { clase: 'mini', estilo: 'margin-top:9px' },
      [`En el movil se abre la camara directamente. Se guarda una miniatura, no el original, para no llenar el almacenamiento (limite ${LIMITE_ARCHIVO_MB} MB por archivo). Nada se envia a ningun servidor.`]));
  };

  pintar();
  return caja;
}

  __exp.vistaRegistrar = vistaRegistrar;
});

__def("src/ui/vistas/misiones.js", function (__exp, __req) {
/** misiones.js — Retos diarios, semanales y de temporada. */
const { el, num, progreso, vacio, tarjetaMetrica } = __req("src/ui/componentes.js");
const { misionesVigentes, evaluarMision, diasRestantes, misionesPorAire } = __req("src/core/misiones.js");
const { lecturaAireVigente } = __req("src/core/estado.js");
const { progresion } = __req("src/core/nivel.js");

function vistaMisiones(ctx) {
  const estado = ctx.almacen.get();
  const nivel = progresion(estado.perfil.xp).nivel;
  // Las contextuales de aire solo existen mientras la lectura siga vigente.
  const aire = lecturaAireVigente(estado);
  const todas = [
    ...misionesVigentes(estado.perfil.id, new Date(), { nivel }),
    ...(aire ? misionesPorAire(aire.aqi, aire.lugar) : []),
  ].map((m) => ({ m, ev: evaluarMision(m, estado.registros) }));
  const completadas = estado.misionesCompletadas || [];
  const hechasIds = new Set(completadas.map((c) => c.id));

  const raiz = el('div');
  raiz.appendChild(el('h1', { texto: 'Misiones' }));
  raiz.appendChild(el('p', { clase: 'sub',
    texto: 'Los retos se generan de forma determinista a partir de tu perfil y la fecha: mismo dia, mismas misiones, sin servidor. La dificultad escala con tu nivel.' }));

  const activas = todas.filter((x) => !x.ev.completada && !hechasIds.has(x.m.id));
  const listas = todas.filter((x) => x.ev.completada || hechasIds.has(x.m.id));

  raiz.appendChild(el('div', { clase: 'rejilla c3 seccion' }, [
    tarjetaMetrica({ etiqueta: 'Activas', valor: String(activas.length), icono: '🎯' }),
    tarjetaMetrica({ etiqueta: 'Completadas hoy', valor: String(listas.length), icono: '✅', color: 'var(--verde)' }),
    tarjetaMetrica({ etiqueta: 'Historico', valor: num(completadas.length), icono: '🏆', color: 'var(--ambar)',
      pie: `${num(completadas.reduce((s, c) => s + (c.recompensa?.puntos || 0), 0))} pts ganados` }),
  ]));

  for (const [tipo, titulo, desc] of [
    ['aire', 'Segun el aire de hoy', 'Aparecen solo cuando la calidad del aire lo justifica'],
    ['diaria', 'Diarias', 'Se renuevan cada dia a medianoche'],
    ['semanal', 'Semanales', 'Ventana de lunes a domingo'],
    ['temporada', 'Reto del mes', 'El objetivo mas ambicioso'],
  ]) {
    const grupo = todas.filter((x) => x.m.tipo === tipo);
    if (!grupo.length) continue;
    raiz.appendChild(el('div', { clase: 'seccion' }, [
      el('div', { clase: 'fila entre', estilo: 'margin-bottom:11px' }, [
        el('h2', { estilo: 'margin:0', texto: titulo }),
        el('span', { clase: 'mini', texto: desc }),
      ]),
      el('div', { clase: 'rejilla ancha' }, grupo.map(({ m, ev }) => tarjetaMision(m, ev, hechasIds.has(m.id)))),
    ]));
  }

  if (completadas.length) {
    raiz.appendChild(el('div', { clase: 'tarjeta' }, [
      el('h2', { texto: 'Ultimas misiones superadas' }),
      el('div', { clase: 'tabla-scroll' }, [
        el('table', {}, [
          el('thead', {}, [el('tr', {}, [
            el('th', { texto: 'Mision' }), el('th', { texto: 'Tipo' }),
            el('th', { texto: 'Recompensa' }), el('th', { texto: 'Fecha' }),
          ])]),
          el('tbody', {}, [...completadas].reverse().slice(0, 12).map((c) => el('tr', {}, [
            el('td', { texto: c.titulo }),
            el('td', { clase: 'mini', texto: c.tipo }),
            el('td', { clase: 'mono', estilo: 'color:var(--ambar)', texto: `+${c.recompensa?.puntos || 0} pts` }),

          ]))),
        ]),
      ]),
    ]));

function tarjetaMision(m, ev, yaCobrada) {

  return el('div', {
    clase: 'tarjeta',
    estilo: completa ? 'border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.07)' : '',
  }, [
    el('div', { clase: 'fila entre', estilo: 'margin-bottom:9px' }, [
      el('span', { estilo: 'font-size:23px', texto: m.icono }),
      el('span', { clase: 'pastilla', estilo: completa
        ? 'background:rgba(52,211,153,.2);color:var(--verde)'
        : 'background:var(--superficie-2);color:var(--texto-3)',
        texto: completa ? 'Completada' : dias === 0 ? 'Ultimo dia' : `${dias} d restantes` }),

    el('div', { estilo: 'font-weight:700;font-size:14.5px;margin-bottom:11px', texto: m.titulo }),

      el('span', { clase: 'mono mini', texto: `+${m.recompensa.xp} XP` }),
    ]),
  ]);
}

  __exp.vistaMisiones = vistaMisiones;

          el('thead', {}, [el('tr', {}, [el('th', { texto: 'Recompensa' }), el('th', { texto: 'Coste' }), el('th', { texto: 'Fecha' })])]),
          el('tbody', {}, [...estado.canjes].reverse().map((c) => {
            const rec = recompensa(c.recompensaId);
            return el('tr', {}, [
              el('td', { texto: `${rec?.icono || ''} ${rec?.titulo || c.recompensaId}` }),
              el('td', { clase: 'mono', texto: `${num(c.coste)} pts` }),
              el('td', { clase: 'mini', texto: new Date(c.fecha).toLocaleDateString('es-ES') }),
            ]);
          })),
        ]),
      ]),
    ]));
  }

  return raiz;
}

function tarjetaRecompensa(rec, ctx, estado, nivel) {
  const permiso = puedeCanjear(rec, { puntos: estado.perfil.puntos, nivel, canjesPrevios: estado.canjes });
  const familia = FAMILIAS[rec.familia];
  const usados = (estado.canjes || []).filter((c) => c.recompensaId === rec.id).length;

  return el('div', { clase: 'tarjeta', estilo: permiso.ok ? '' : 'opacity:.62' }, [
    el('div', { clase: 'fila entre', estilo: 'margin-bottom:9px' }, [
      el('span', { estilo: 'font-size:25px', texto: rec.icono }),
      el('span', { clase: 'pastilla', estilo: `background:${familia.color}22;color:${familia.color}`, texto: familia.etiqueta }),
    ]),
    el('div', { estilo: 'font-weight:700;font-size:14.5px;margin-bottom:5px', texto: rec.titulo }),
    el('div', { clase: 'mini', estilo: 'margin-bottom:9px;min-height:44px', texto: rec.desc }),
    rec.nota ? el('div', { clase: 'mini', estilo: 'font-style:italic;opacity:.75;margin-bottom:11px', texto: rec.nota }) : null,
    el('div', { clase: 'fila entre', estilo: 'padding-top:11px;border-top:1px solid var(--borde)' }, [
      el('div', {}, [
        el('div', { clase: 'mono', estilo: 'font-weight:800;color:var(--ambar);font-size:15px', texto: `${num(rec.coste)} pts` }),
        el('div', { clase: 'mini', estilo: 'font-size:10.5px',
          texto: rec.stock ? `${Math.max(0, rec.stock - usados)} disponibles` : 'Sin limite' }),
      ]),
      el('button', {
        clase: `btn s ${permiso.ok ? 'primario' : ''}`,
        texto: permiso.ok ? 'Canjear' : permiso.motivo,
        disabled: !permiso.ok,
        onclick: () => confirmar(rec, ctx),
      }),
    ]),
  ]);
}

function confirmar(rec, ctx) {
  const cerrar = modal(el('div', {}, [
    el('div', { clase: 'centrado', estilo: 'margin-bottom:15px' }, [
      el('div', { estilo: 'font-size:44px', texto: rec.icono }),
      el('div', { estilo: 'font-weight:700;font-size:17px;margin-top:7px', texto: rec.titulo }),
      el('div', { clase: 'mini', estilo: 'margin-top:5px', texto: rec.desc }),
    ]),
    el('div', { clase: 'aviso info', estilo: 'margin-bottom:15px' },
      [`Se descontaran ${num(rec.coste)} puntos de tu saldo. Esta accion no se puede deshacer.`]),
    el('div', { clase: 'fila', estilo: 'gap:9px' }, [
      el('button', { clase: 'btn crece', texto: 'Cancelar', onclick: () => cerrar() }),
      el('button', {
        clase: 'btn primario crece', texto: 'Confirmar canje',
        onclick: () => {
          const res = ctx.almacen.canjear(rec.id);
          cerrar();
          if (res.ok) {
            toast({ titulo: 'Canje realizado', texto: rec.titulo, icono: rec.icono, tipo: 'logro' });
            ctx.refrescar();
          } else {
            toast({ titulo: 'No se pudo canjear', texto: res.motivo, tipo: 'error', icono: '⛔' });
          }
        },
      }),
    ]),
  ]), { titulo: 'Confirmar canje', ancho: 420 });
}

  __exp.vistaTienda = vistaTienda;
});

__def("src/ui/vistas/analitica.js", function (__exp, __req) {
/** analitica.js — Analisis estadistico del historial personal. */
const { el, num, co2, tarjetaMetrica, graficoLinea, graficoBarras, graficoDonut, mapaCalor, vacio, esc } = __req("src/ui/componentes.js");
const { serieDiaria, analizarSerie, compararPeriodos, perfilHorario, perfilSemanal } = __req("src/core/analitica.js");
const { CATEGORIAS, accion } = __req("src/data/acciones.js");
const { regresionLineal } = __req("src/core/estadistica.js");
const { indiceConfianza } = __req("src/core/validacion.js");
const { equivalencias } = __req("src/core/impacto.js");

let metrica = 'co2e';
let ventana = 30;

const METRICAS = {
  co2e: { etiqueta: 'CO2e evitado', unidad: 'kg', color: 'var(--verde)' },
  agua: { etiqueta: 'Agua ahorrada', unidad: 'L', color: 'var(--cian)' },
  residuo: { etiqueta: 'Residuo desviado', unidad: 'kg', color: 'var(--verde-2)' },
  puntos: { etiqueta: 'Puntos', unidad: 'pts', color: 'var(--ambar)' },
  n: { etiqueta: 'Numero de acciones', unidad: '', color: 'var(--morado)' },
};

function vistaAnalitica(ctx) {
  const estado = ctx.almacen.get();
  const r = ctx.almacen.resumen();
  const raiz = el('div');

  raiz.appendChild(el('h1', { texto: 'Analitica' }));
  raiz.appendChild(el('p', { clase: 'sub',
    texto: 'Estimadores robustos (Theil-Sen, Mann-Kendall) en vez de una simple recta: las series de conducta tienen valores atipicos y no son normales.' }));

  if (!estado.registros.length) {
    raiz.appendChild(vacio('📊', 'Sin datos que analizar', 'Registra unos cuantos dias de actividad y vuelve'));
    return raiz;
  }

  // ------------------------------------------------------------- controles
  const controles = el('div', { clase: 'fila envuelve seccion', estilo: 'gap:7px' });
  const cuerpo = el('div');

  const pintarControles = () => {
    controles.innerHTML = '';
    for (const [id, m] of Object.entries(METRICAS)) {
      controles.appendChild(el('button', {
        clase: `chip${metrica === id ? ' activo' : ''}`, texto: m.etiqueta,
        onclick: () => { metrica = id; pintar(); },
      }));
    }
    controles.appendChild(el('span', { estilo: 'width:14px' }));
    for (const v of [14, 30, 90, 180]) {
      controles.appendChild(el('button', {
        clase: `chip${ventana === v ? ' activo' : ''}`, texto: `${v} d`,
        onclick: () => { ventana = v; pintar(); },
      }));
    }
  };

  function pintar() {
    pintarControles();
    cuerpo.innerHTML = '';
    const meta = METRICAS[metrica];
    const serie = serieDiaria(estado.registros, metrica, ventana);
    const a = analizarSerie(serie, { horizonte: 30 });
    const comp = compararPeriodos(estado.registros, metrica, Math.min(14, Math.floor(ventana / 2)));
    const ols = regresionLineal(serie.map((p) => p.valor));

    // Metricas descriptivas
    cuerpo.appendChild(el('div', { clase: 'rejilla c4 seccion' }, [
      tarjetaMetrica({ etiqueta: `Total ${ventana} d`, valor: num(a.total), unidad: meta.unidad, color: meta.color,
        delta: comp.sinBase ? null : comp.variacion, pie: comp.sinBase ? 'Sin periodo previo con el que comparar' : '' }),
      tarjetaMetrica({ etiqueta: 'Media diaria', valor: num(a.media), unidad: meta.unidad,
        pie: `Mediana ${num(a.mediana)} · sigma ${num(a.desviacion)}` }),
      tarjetaMetrica({ etiqueta: 'Dias con actividad', valor: `${a.diasActivos}/${a.n}`,
        pie: `Tasa ${(a.tasaActividad * 100).toFixed(0)} %` }),
      tarjetaMetrica({
        etiqueta: 'Proyeccion 30 d',
        valor: a.proyeccion.fiable ? num(a.proyeccion.porTendencia) : num(a.proyeccion.porMedia),
        unidad: meta.unidad,
        color: a.proyeccion.fiable ? null : 'var(--texto-2)',
        pie: a.proyeccion.fiable
          ? `Tendencia robusta · por media constante: ${num(a.proyeccion.porMedia)}`
          : a.proyeccion.motivo,
      }),
    ]));

    // Serie principal
    cuerpo.appendChild(el('div', { clase: 'tarjeta seccion' }, [
      el('div', { clase: 'fila entre', estilo: 'margin-bottom:13px' }, [
        el('h2', { estilo: 'margin:0', texto: `${meta.etiqueta} · ultimos ${ventana} dias` }),
        el('span', { clase: 'pastilla', estilo: `background:${a.tendencia.significativa ? 'rgba(52,211,153,.16)' : 'var(--superficie-2)'};color:${a.tendencia.significativa ? 'var(--verde)' : 'var(--texto-3)'}`,
          texto: a.tendencia.mannKendall.texto }),
      ]),
      graficoLinea(serie, { alto: 190, color: meta.color, tendencia: ols }),
    ]));

    // Panel estadistico
    cuerpo.appendChild(el('div', { clase: 'rejilla c2 seccion', estilo: 'align-items:start' }, [
      el('div', { clase: 'tarjeta' }, [
        el('h2', { texto: 'Contraste de tendencia' }),
        tablaEstadistica([
          ['Pendiente OLS', `${num(a.tendencia.ols, 4)} ${meta.unidad}/dia`, 'Minimos cuadrados: sensible a atipicos'],
          ['Pendiente Theil-Sen', `${num(a.tendencia.theilSen, 4)} ${meta.unidad}/dia`, 'Mediana de pendientes por pares: robusta'],
          ['R² del ajuste', num(a.tendencia.r2, 3), 'Varianza explicada por la recta'],
          ['tau de Kendall', num(a.tendencia.mannKendall.tau, 3), 'Concordancia monotona en [-1, 1]'],
          ['p (bilateral)', num(a.tendencia.mannKendall.p, 4), a.tendencia.significativa ? 'Significativa a alfa = 0,05' : 'No significativa a alfa = 0,05'],
          ['Coef. de variacion', num(a.coefVariacion, 3), 'Dispersion relativa: constancia del habito'],
        ]),
        el('div', { clase: `aviso ${a.tendencia.significativa ? 'exito' : 'info'}`, estilo: 'margin-top:13px' }, [
          el('span', { texto: a.tendencia.significativa ? '📈' : 'ℹ️' }),
          el('div', { texto: interpretacion(a, meta) }),
        ]),
      ]),
      el('div', { clase: 'tarjeta' }, [
        el('h2', { texto: 'Diversidad de conducta' }),
        tablaEstadistica([
          ['Indice de Shannon (H)', num(r.shannon, 3), 'Entropia del reparto entre categorias'],
          ['Equidad de Pielou', num(r.pielou, 3), '1 = esfuerzo perfectamente repartido'],
          ['Gini de categorias', num(r.gini, 3), '0 = igualdad, 1 = concentracion total'],
          ['Categorias activas', `${r.categoriasUsadas}/8`, 'Amplitud de tu accion ambiental'],
          ['Acciones distintas', String(r.accionesDistintas), 'Exploracion del catalogo'],
          ['Indice de confianza', num(indiceConfianza(estado.registros).valor, 2), indiceConfianza(estado.registros).etiqueta],
        ]),
        el('div', { clase: 'aviso info', estilo: 'margin-top:13px' }, [
          el('span', { texto: '🧭' }),
          el('div', { texto: r.pielou > 0.8
            ? 'Tu esfuerzo esta muy bien repartido: es el perfil que mas reduce la huella total.'
            : 'Concentras el esfuerzo en pocas categorias. Diversificar suele dar mas reduccion por unidad de esfuerzo.' }),
        ]),
      ]),
    ]));

    // Descomposicion por categoria y accion
    const porCat = r.porCategoria.map((c) => ({
      etiqueta: CATEGORIAS[c.cat]?.etiqueta || c.cat,
      valor: metrica === 'puntos' ? c.puntos : (c[metrica] ?? c.co2e),
      color: CATEGORIAS[c.cat]?.color,
    })).filter((d) => d.valor > 0);

    const topAcciones = Object.entries(r.conteoAcciones)
      .map(([id, n]) => ({ etiqueta: `${accion(id)?.icono || ''} ${accion(id)?.titulo || id}`, valor: n, color: CATEGORIAS[accion(id)?.cat]?.color }))
      .sort((x, y) => y.valor - x.valor).slice(0, 8);

    cuerpo.appendChild(el('div', { clase: 'rejilla c2 seccion', estilo: 'align-items:start' }, [
      el('div', { clase: 'tarjeta' }, [el('h2', { texto: 'Aportacion por categoria' }),
        porCat.length ? graficoDonut(porCat, { centro: { valor: num(porCat.reduce((s, d) => s + d.valor, 0)), etiqueta: meta.unidad || 'total' } }) : vacio('📊', 'Sin datos')]),
      el('div', { clase: 'tarjeta' }, [el('h2', { texto: 'Acciones mas repetidas' }),
        topAcciones.length ? graficoBarras(topAcciones, { unidad: 'x' }) : vacio('📊', 'Sin datos')]),
    ]));

    // Patrones temporales
    const ph = perfilHorario(estado.registros);
    const ps = perfilSemanal(estado.registros);
    cuerpo.appendChild(el('div', { clase: 'rejilla c2 seccion', estilo: 'align-items:start' }, [
      el('div', { clase: 'tarjeta' }, [
        el('h2', { texto: 'Ritmo circadiano de tus acciones' }),
        graficoBarras(ph.horas.map((v, i) => ({ etiqueta: `${String(i).padStart(2, '0')}:00`, valor: v }))
          .filter((d) => d.valor > 0).slice(0, 10), { unidad: '' }),
        el('div', { clase: 'mini', estilo: 'margin-top:9px', texto: `Hora punta: ${String(ph.pico).padStart(2, '0')}:00. Encadenar el habito a una rutina fija a esa hora es lo que mas eleva la adherencia.` }),
      ]),
      el('div', { clase: 'tarjeta' }, [
        el('h2', { texto: 'Reparto semanal' }),
        graficoBarras(ps.dias.map((v, i) => ({ etiqueta: ps.etiquetas[i], valor: v })), { unidad: '' }),
        el('div', { clase: 'mini', estilo: 'margin-top:9px', texto: `Tu dia mas activo es ${ps.pico}. Los valles del fin de semana son el hueco tipico donde se rompen las rachas.` }),
      ]),
    ]));

    // Calendario e impacto acumulado
    const eq = equivalencias(r.co2eTotal);
    cuerpo.appendChild(el('div', { clase: 'tarjeta seccion' }, [
      el('h2', { texto: 'Huella evitada acumulada' }),
      el('div', { clase: 'rejilla c4', estilo: 'margin-bottom:15px' }, [
        equiv('🌳', num(eq.arbolesAnio), 'arboles-anio'),
        equiv('🚗', num(eq.kmCoche), 'km en coche'),
        equiv('📱', num(eq.cargasMovil), 'cargas de movil'),
        equiv('🍔', num(eq.hamburguesas), 'hamburguesas de res'),
      ]),
      mapaCalor(serieDiaria(estado.registros, metrica, 168), { color: '52, 211, 153' }),
      el('div', { clase: 'mini', estilo: 'margin-top:9px', texto: '24 semanas. Cada columna es una semana; cada fila, un dia. La intensidad es proporcional al valor de la metrica seleccionada.' }),
    ]));
  }

  raiz.appendChild(controles);
  raiz.appendChild(cuerpo);
  pintar();
  return raiz;
}

function equiv(icono, valor, etiqueta) {
  return el('div', { clase: 'centrado' }, [
    el('div', { estilo: 'font-size:25px', texto: icono }),
    el('div', { clase: 'metrica-valor s', texto: valor }),
    el('div', { clase: 'mini', texto: etiqueta }),
  ]);
}

function tablaEstadistica(filas) {
  return el('div', { clase: 'tabla-scroll' }, [
    el('table', {}, [
      el('tbody', {}, filas.map(([k, v, nota]) => el('tr', {}, [
        el('td', {}, [
          el('div', { estilo: 'font-weight:600;font-size:13px', texto: k }),
          el('div', { clase: 'mini', estilo: 'font-size:10.5px', texto: nota }),
        ]),
        el('td', { clase: 'mono', estilo: 'text-align:right;font-weight:700;white-space:nowrap', texto: v }),
      ]))),
    ]),
  ]);
}

function interpretacion(a, meta) {
  const { direccion, significativa, mannKendall, theilSen } = a.tendencia;
  if (!significativa) {
    return `No hay evidencia estadistica de tendencia (p = ${num(mannKendall.p, 3)} > 0,05). Tu ${meta.etiqueta.toLowerCase()} se mantiene estable dentro del ruido normal.`;
  }
  const sentido = direccion === 'al alza' ? 'aumentando' : 'disminuyendo';
  return `Tendencia ${sentido} de forma significativa (p = ${num(mannKendall.p, 4)}). El estimador robusto marca ${num(theilSen, 4)} ${meta.unidad}/dia, es decir ${num(theilSen * 30, 2)} ${meta.unidad} al mes.`;
}

  __exp.vistaAnalitica = vistaAnalitica;
});

__def("src/core/huella.js", function (__exp, __req) {
/**
 * huella.js — Calculadora de huella de carbono personal anual.
 *
 * Metodo hibrido: factores de proceso (ACV) para energia, movilidad y dieta, y
 * factores input-output ambientalmente extendidos (EEIO) para bienes y
 * servicios, que es como se cierra el hueco de las emisiones "invisibles".
 * Resultado en toneladas de CO2e/anio comparado con:
 *   - la media del pais,          - la media mundial,
 *   - el objetivo 2,3 t compatible con 1,5 C (UNEP Emissions Gap 2023).
 */
const { intensidadRed, pais, OBJETIVO_2030_TCO2E, MEDIA_MUNDIAL_TCO2E } = __req("src/data/paises.js");
const { MOVILIDAD, DIETAS, RFI_AVIACION } = __req("src/data/factores.js");
const { redondear } = __req("src/core/estadistica.js");

/** Factores de combustibles domesticos (kg CO2e por unidad, incluye upstream). */
const COMBUSTIBLES = Object.freeze({
  gas_natural_m3: 2.30,
  glp_litro:      1.56,
  gasoleo_litro:  2.68,
  lena_kg:        0.05,   // biogenico: solo emisiones no-CO2 y gestion
  ninguno:        0,
});

/** Factores EEIO de gasto (kg CO2e por unidad monetaria). Fuente: EXIOBASE v3.8. */
const EEIO = Object.freeze({
  bienes:    0.35,
  servicios: 0.20,
  ocio:      0.28,
  salud:     0.15,
});

/** Emisiones publicas per capita no atribuibles al individuo (infraestructura, sanidad). */
const BASE_PUBLICA_T = 1.1;

/**
 * @param {object} e entradas del formulario
 * @param {string} e.pais
 * @param {number} e.personasHogar
 * @param {number} e.electricidadKwhMes
 * @param {string} e.combustible clave de COMBUSTIBLES
 * @param {number} e.combustibleUnidadesMes
 * @param {number} e.kmCocheSemana
 * @param {string} e.tipoCoche clave de MOVILIDAD
 * @param {number} e.kmTransporteSemana
 * @param {number} e.vuelosCortosAnio
 * @param {number} e.vuelosLargosAnio
 * @param {string} e.dieta clave de DIETAS
 * @param {number} e.gastoBienesMes
 * @param {number} e.gastoServiciosMes
 * @param {number} e.reciclajePct
 */
function calcularHuella(e = {}) {
  const p = pais(e.pais || 'WW');
  const personas = Math.max(1, Number(e.personasHogar) || 1);

  // --- Hogar: se reparte entre convivientes ------------------------------
  const kwhAnio = (Number(e.electricidadKwhMes) || 0) * 12;
  const electricidad = (kwhAnio * intensidadRed(p.cod)) / personas;

  const combKey = e.combustible in COMBUSTIBLES ? e.combustible : 'ninguno';
  const combustible = ((Number(e.combustibleUnidadesMes) || 0) * 12 * COMBUSTIBLES[combKey]) / personas;

  // --- Movilidad terrestre ----------------------------------------------
  const fCoche = MOVILIDAD[e.tipoCoche]?.co2e ?? MOVILIDAD.coche_gasolina.co2e;
  const coche = (Number(e.kmCocheSemana) || 0) * 52 * fCoche;
  const transporte = (Number(e.kmTransporteSemana) || 0) * 52 * MOVILIDAD.autobus_urbano.co2e * 0.8;

  // --- Aviacion: con forzamiento radiativo no-CO2 ------------------------
  const vuelosCortos = (Number(e.vuelosCortosAnio) || 0) * 1200 * MOVILIDAD.avion_corto.co2e * RFI_AVIACION;
  const vuelosLargos = (Number(e.vuelosLargosAnio) || 0) * 7000 * MOVILIDAD.avion_largo.co2e * RFI_AVIACION;
  const aviacion = vuelosCortos + vuelosLargos;

  // --- Alimentacion -------------------------------------------------------
  const dieta = DIETAS[e.dieta] || DIETAS.media_carne;
  const alimentacion = dieta.co2e_dia * 365;

  // --- Consumo (EEIO) -----------------------------------------------------
  const bienes = (Number(e.gastoBienesMes) || 0) * 12 * EEIO.bienes;
  const servicios = (Number(e.gastoServiciosMes) || 0) * 12 * EEIO.servicios;

  // --- Residuos: el reciclaje reduce la fraccion enterrada -----------------
  const reciclaje = Math.min(100, Math.max(0, Number(e.reciclajePct) || 0)) / 100;
  const residuos = 400 * (1 - 0.55 * reciclaje) * 0.45; // 400 kg/hab/anio, 0,45 kg CO2e/kg

  const categorias = [
    { id: 'electricidad', etiqueta: 'Electricidad',   kg: electricidad, icono: '⚡' },
    { id: 'combustible',  etiqueta: 'Calefaccion y gas', kg: combustible, icono: '🔥' },
    { id: 'coche',        etiqueta: 'Coche',          kg: coche,        icono: '🚗' },
    { id: 'transporte',   etiqueta: 'Transporte publico', kg: transporte, icono: '🚇' },
    { id: 'aviacion',     etiqueta: 'Aviacion',       kg: aviacion,     icono: '✈️' },
    { id: 'alimentacion', etiqueta: 'Alimentacion',   kg: alimentacion, icono: '🍽️' },
    { id: 'bienes',       etiqueta: 'Bienes',         kg: bienes,       icono: '🛍️' },
    { id: 'servicios',    etiqueta: 'Servicios',      kg: servicios,    icono: '💼' },
    { id: 'residuos',     etiqueta: 'Residuos',       kg: residuos,     icono: '🗑️' },
    { id: 'publica',      etiqueta: 'Servicios publicos', kg: BASE_PUBLICA_T * 1000, icono: '🏛️' },
  ].map((c) => ({ ...c, kg: Math.max(0, c.kg) }));

  const totalKg = categorias.reduce((s, c) => s + c.kg, 0);
  const totalT = totalKg / 1000;

  const conPct = categorias
    .map((c) => ({ ...c, kg: redondear(c.kg, 1), t: redondear(c.kg / 1000, 3), pct: totalKg ? redondear((c.kg / totalKg) * 100, 1) : 0 }))
    .sort((a, b) => b.kg - a.kg);

  return {
    totalToneladas: redondear(totalT, 2),
    totalKg: redondear(totalKg, 0),
    categorias: conPct,
    dominante: conPct[0],
    comparativa: {
      pais: { nombre: p.nombre, valor: p.huella, ratio: p.huella ? redondear(totalT / p.huella, 2) : null },
      mundial: { valor: MEDIA_MUNDIAL_TCO2E, ratio: redondear(totalT / MEDIA_MUNDIAL_TCO2E, 2) },
      objetivo: { valor: OBJETIVO_2030_TCO2E, ratio: redondear(totalT / OBJETIVO_2030_TCO2E, 2),
                  exceso: redondear(Math.max(0, totalT - OBJETIVO_2030_TCO2E), 2) },
    },
    veredicto: veredicto(totalT),
    planetas: redondear(totalT / OBJETIVO_2030_TCO2E, 2),

}

function veredicto(t) {
  if (t <= 2.3) return { nivel: 'compatible', texto: 'Compatible con la trayectoria de 1,5 C. Estas en el 5 % mundial mas sostenible.', color: '#22c55e' };
  if (t <= 4.0) return { nivel: 'bueno', texto: 'Por debajo de la media mundial, pero aun por encima del objetivo de 2030.', color: '#84cc16' };
  if (t <= 6.6) return { nivel: 'medio', texto: 'En el entorno de la media mundial. Hay margen claro de reduccion.', color: '#eab308' };
  if (t <= 10) return { nivel: 'alto', texto: 'Por encima de la media mundial. Ataca primero aviacion, coche y dieta.', color: '#f97316' };
  return { nivel: 'muy_alto', texto: 'Huella muy elevada. Tres o cuatro decisiones estructurales la reducirian a la mitad.', color: '#ef4444' };
}

/**
 * Escenarios contrafactuales: cuanto se ahorraria con cada palanca.
 * Es lo mas util de una calculadora: no el numero, sino que hacer con el.
 */
function escenarios(entradas) {
  const base = calcularHuella(entradas);
  const palancas = [
    { id: 'dieta_vegetariana', etiqueta: 'Pasar a dieta vegetariana', cambios: { dieta: 'vegetariana' }, icono: '🥗' },
    { id: 'dieta_vegana', etiqueta: 'Pasar a dieta vegana', cambios: { dieta: 'vegana' }, icono: '🌱' },
    { id: 'sin_vuelos', etiqueta: 'Renunciar a volar un anio', cambios: { vuelosCortosAnio: 0, vuelosLargosAnio: 0 }, icono: '🚆' },
    { id: 'coche_electrico', etiqueta: 'Cambiar a coche electrico', cambios: { tipoCoche: 'coche_electrico' }, icono: '🔌' },
    { id: 'mitad_coche', etiqueta: 'Reducir el coche a la mitad', cambios: { kmCocheSemana: (Number(entradas.kmCocheSemana) || 0) / 2 }, icono: '🚲' },
    { id: 'energia_verde', etiqueta: 'Contratar electricidad renovable', cambios: { pais: 'NO' }, icono: '🌞' },
    { id: 'menos_bienes', etiqueta: 'Reducir 30 % la compra de bienes', cambios: { gastoBienesMes: (Number(entradas.gastoBienesMes) || 0) * 0.7 }, icono: '🛍️' },
    { id: 'reciclar_todo', etiqueta: 'Reciclar el 90 % de los residuos', cambios: { reciclajePct: 90 }, icono: '♻️' },
  ];

  return palancas.map((p) => {
    const alternativa = calcularHuella({ ...entradas, ...p.cambios });
    const ahorro = base.totalToneladas - alternativa.totalToneladas;
    return {
      ...p,
      nuevaHuella: alternativa.totalToneladas,
      ahorroT: redondear(Math.max(0, ahorro), 2),
      ahorroPct: base.totalToneladas ? redondear((Math.max(0, ahorro) / base.totalToneladas) * 100, 1) : 0,
    };
  }).sort((a, b) => b.ahorroT - a.ahorroT);
}

/** Entradas por defecto: perfil urbano medio, util como punto de partida. */
function entradasPorDefecto(codPais = 'WW') {
  return {
    pais: codPais,
    personasHogar: 3,

    dieta: 'media_carne',
    gastoBienesMes: 150,
    gastoServiciosMes: 120,
    reciclajePct: 40,
  };
}

/**
 * aire.js — Indice de calidad del aire y riesgo sanitario.
 *
 * Implementa el AQI de la EPA de EE. UU. (revision de 2024 para PM2,5) por
 * interpolacion lineal por tramos, y compara con las guias de la OMS de 2021,
 * mucho mas estrictas. Se incluye el calculo de riesgo relativo de mortalidad
 * por PM2,5 segun la funcion concentracion-respuesta del Global Burden of Disease.
 */

/**
 * Tramos del AQI: [Clow, Chigh, Ilow, Ihigh].
 * PM2,5 y PM10 en ug/m3 (24 h); O3 en ppb (8 h); NO2 y SO2 en ppb (1 h); CO en ppm (8 h).
 */
const TRAMOS = Object.freeze({
  pm25: [[0.0, 9.0, 0, 50], [9.1, 35.4, 51, 100], [35.5, 55.4, 101, 150],
         [55.5, 125.4, 151, 200], [125.5, 225.4, 201, 300], [225.5, 325.4, 301, 500]],
  pm10: [[0, 54, 0, 50], [55, 154, 51, 100], [155, 254, 101, 150],
         [255, 354, 151, 200], [355, 424, 201, 300], [425, 604, 301, 500]],
  o3:   [[0, 54, 0, 50], [55, 70, 51, 100], [71, 85, 101, 150],
         [86, 105, 151, 200], [106, 200, 201, 300]],
  no2:  [[0, 53, 0, 50], [54, 100, 51, 100], [101, 360, 101, 150],
         [361, 649, 151, 200], [650, 1249, 201, 300], [1250, 2049, 301, 500]],
  so2:  [[0, 35, 0, 50], [36, 75, 51, 100], [76, 185, 101, 150],
         [186, 304, 151, 200], [305, 604, 201, 300], [605, 1004, 301, 500]],
  co:   [[0.0, 4.4, 0, 50], [4.5, 9.4, 51, 100], [9.5, 12.4, 101, 150],
         [12.5, 15.4, 151, 200], [15.5, 30.4, 201, 300], [30.5, 50.4, 301, 500]],
});

const CATEGORIAS_AQI = Object.freeze([
  { max: 50,  nombre: 'Buena',                    color: '#22c55e', consejo: 'Calidad del aire satisfactoria. Actividad al aire libre sin restricciones.' },
  { max: 100, nombre: 'Moderada',                 color: '#eab308', consejo: 'Aceptable. Las personas muy sensibles deberian limitar el esfuerzo prolongado al aire libre.' },
  { max: 150, nombre: 'Danina para sensibles',    color: '#f97316', consejo: 'Ninos, mayores, asmaticos y cardiopatas: reducir el ejercicio intenso en exterior.' },
  { max: 200, nombre: 'Danina',                   color: '#ef4444', consejo: 'Toda la poblacion puede notar efectos. Evitar el esfuerzo prolongado al aire libre.' },
  { max: 300, nombre: 'Muy danina',               color: '#a855f7', consejo: 'Alerta sanitaria. Permanecer en interiores con filtracion si es posible.' },
  { max: 500, nombre: 'Peligrosa',                color: '#7f1d1d', consejo: 'Emergencia sanitaria. Evitar toda actividad exterior y usar purificacion HEPA.' },
]);

/** Guias de la OMS 2021 (ug/m3, salvo CO en mg/m3). */
const GUIA_OMS = Object.freeze({
  pm25: { anual: 5, dia: 15 },
  pm10: { anual: 15, dia: 45 },
  no2:  { anual: 10, dia: 25 },
  o3:   { pico: 60, ocho: 100 },
  so2:  { dia: 40 },
  co:   { ocho: 4 },
});

/** Interpolacion lineal por tramos del AQI para un contaminante. */
function aqiContaminante(contaminante, concentracion) {
  const tramos = TRAMOS[contaminante];
  if (!tramos || !Number.isFinite(concentracion) || concentracion < 0) return null;
  for (const [cLo, cHi, iLo, iHi] of tramos) {
    if (concentracion >= cLo && concentracion <= cHi) {
      return Math.round(((iHi - iLo) / (cHi - cLo)) * (concentracion - cLo) + iLo);
    }
  }
  // Por encima del ultimo tramo: extrapolacion conservadora.
  const ultimo = tramos[tramos.length - 1];
  return concentracion > ultimo[1] ? 500 : null;
}

/** Categoria del AQI. */
function categoriaAQI(aqi) {
  return CATEGORIAS_AQI.find((c) => aqi <= c.max) || CATEGORIAS_AQI[CATEGORIAS_AQI.length - 1];
}

/**
 * AQI global: el maximo de los subindices (asi lo define la EPA), indicando
 * cual es el contaminante dominante.
 * @param {{pm25?:number, pm10?:number, o3?:number, no2?:number, so2?:number, co?:number}} lecturas
 */
function calcularAQI(lecturas) {
  const sub = [];
  for (const [k, v] of Object.entries(lecturas)) {
    if (!TRAMOS[k] || v === null || v === undefined || v === '') continue;
    const i = aqiContaminante(k, Number(v));
    if (i !== null) sub.push({ contaminante: k, concentracion: Number(v), aqi: i });
  }
  if (!sub.length) return null;
  sub.sort((a, b) => b.aqi - a.aqi);
  const dominante = sub[0];
  const cat = categoriaAQI(dominante.aqi);
  return {
    aqi: dominante.aqi,
    dominante: dominante.contaminante,
    categoria: cat.nombre,
    color: cat.color,
    consejo: cat.consejo,
    subindices: sub,
    excesosOMS: excesosOMS(lecturas),
  };
}

/** Cuantas veces se supera la guia diaria de la OMS 2021. */
function excesosOMS(lecturas) {
  const out = [];
  const dia = { pm25: GUIA_OMS.pm25.dia, pm10: GUIA_OMS.pm10.dia, no2: GUIA_OMS.no2.dia, so2: GUIA_OMS.so2.dia };
  for (const [k, guia] of Object.entries(dia)) {
    const v = Number(lecturas[k]);
    if (Number.isFinite(v) && v > 0) {
      out.push({ contaminante: k, valor: v, guia, veces: Math.round((v / guia) * 100) / 100, supera: v > guia });
    }
  }
  return out;
}

/**
 * Riesgo relativo de mortalidad por exposicion cronica a PM2,5.
 * Modelo log-lineal usado en GBD/OMS: RR = exp(beta * max(0, C - C0))
 * con beta = 0,0059 por ug/m3 (equivale a +6 % de mortalidad total por cada
 * 10 ug/m3, coherente con Pope et al. 2002 y meta-analisis posteriores) y
 * C0 = 5 ug/m3 (contrafactual teorico minimo de la OMS).
 */
function riesgoPM25(concentracionAnual) {
  const C0 = 5;
  const beta = 0.0059;
  const C = Math.max(0, Number(concentracionAnual) || 0);
  const rr = Math.exp(beta * Math.max(0, C - C0));
  const exceso = (rr - 1) * 100;
  // Esperanza de vida: ~0,098 anios perdidos por cada ug/m3 sobre C0 (AQLI, Chicago).
  const anosVida = Math.max(0, (C - C0)) * 0.098;
  return {
    concentracion: C,
    riesgoRelativo: Math.round(rr * 1000) / 1000,
    excesoMortalidadPct: Math.round(exceso * 10) / 10,
    anosVidaPerdidos: Math.round(anosVida * 100) / 100,
    vecesGuiaOMS: Math.round((C / GUIA_OMS.pm25.anual) * 10) / 10,
  };
}

/** Nombres legibles de contaminantes con su origen principal. */
const CONTAMINANTES = Object.freeze({
  pm25: { nombre: 'PM2,5', unidad: 'ug/m3', origen: 'Combustion: trafico diesel, biomasa, industria. Penetra hasta los alveolos y pasa a la sangre.' },
  pm10: { nombre: 'PM10',  unidad: 'ug/m3', origen: 'Polvo, obras, desgaste de frenos y neumaticos, agricultura.' },
  o3:   { nombre: 'Ozono troposferico', unidad: 'ppb', origen: 'Secundario: se forma con NOx + COV bajo radiacion solar. Empeora en olas de calor.' },
  no2:  { nombre: 'NO2',   unidad: 'ppb', origen: 'Trafico rodado (sobre todo diesel) y calderas de gas. Marcador urbano.' },
  so2:  { nombre: 'SO2',   unidad: 'ppb', origen: 'Quema de carbon y fueloil con azufre; refino y maritimo.' },
  co:   { nombre: 'CO',    unidad: 'ppm', origen: 'Combustion incompleta: motores, braseros, calentadores mal ventilados.' },
});

// ============================================================ conversion de unidades

/**
 * Volumen molar de un gas ideal a 25 C y 1013,25 hPa, en L/mol.
 * Es la constante que usa la EPA para convertir entre masa y volumen.
 */
const VOLUMEN_MOLAR = 24.45;

/** Masas moleculares en g/mol de los gases con tramos de AQI. */
const MASA_MOLAR = Object.freeze({
  o3: 48.00,
  no2: 46.0055,
  so2: 64.066,
  co: 28.010,
});

/**
 * Convierte una concentracion de ug/m3 a ppb.
 *
 * IMPRESCINDIBLE: los tramos del AQI de la EPA estan definidos en ppb para O3,
 * NO2 y SO2, y en ppm para CO, pero casi todas las fuentes de datos (Open-Meteo,
 * CAMS, la mayoria de sensores) publican en ug/m3. Aplicar los tramos
 * directamente sobre ug/m3 es un error silencioso: da un AQI plausible pero
 * equivocado, casi siempre por exceso.
 */
function ugm3ApPpb(valor, contaminante) {
  const mw = MASA_MOLAR[contaminante];
  if (!mw || !Number.isFinite(valor)) return null;
  return (valor * VOLUMEN_MOLAR) / mw;
}

/** Conversion inversa: de ppb a ug/m3. */
function ppbAUgm3(valor, contaminante) {
  const mw = MASA_MOLAR[contaminante];
  if (!mw || !Number.isFinite(valor)) return null;
  return (valor * mw) / VOLUMEN_MOLAR;
}

/**
 * Normaliza un juego de lecturas en ug/m3 a las unidades que espera calcularAQI:
 * PM en ug/m3 (sin tocar), O3/NO2/SO2 en ppb y CO en ppm.
 */
function normalizarDesdeUgm3(lecturas) {
  const salida = {};
  if (Number.isFinite(lecturas.pm25)) salida.pm25 = lecturas.pm25;
  if (Number.isFinite(lecturas.pm10)) salida.pm10 = lecturas.pm10;
  for (const gas of ['o3', 'no2', 'so2']) {
    if (Number.isFinite(lecturas[gas])) salida[gas] = ugm3ApPpb(lecturas[gas], gas);
  }
  if (Number.isFinite(lecturas.co)) salida.co = ugm3ApPpb(lecturas.co, 'co') / 1000; // ppb -> ppm
  return salida;
}

/**
 * openmeteo.js — Fuente de datos reales de calidad del aire.
 *
 * Se usa Open-Meteo (modelos CAMS de Copernicus y GEOS-CF de la NASA) por tres
 * razones concretas, no por costumbre:
 *   - No exige clave de API. Una clave en un sitio estatico es publica igualmente.
 *   - Permite CORS, asi que el navegador puede llamarla directamente. OpenAQ,
 *     la alternativa obvia, NO lo permite y obligaria a montar un servidor.
 *   - Cobertura mundial por coordenadas, no solo donde hay estacion oficial.
 *
 * DECISION DE DISENO: la API devuelve su propio `us_aqi`, pero NO se usa como
 * valor final. Se toman las concentraciones crudas y se pasan por el motor de
 * aire.js, que esta contrastado contra los tramos publicados por la EPA. La API
 * es una fuente de datos; la ciencia sigue siendo nuestra y verificable. Su
 * us_aqi se conserva solo para poder contrastar ambos calculos.
 */
const { calcularAQI, normalizarDesdeUgm3 } = __req("src/core/aire.js");

const BASE = 'https://air-quality-api.open-meteo.com/v1/air-quality';
const GEO = 'https://geocoding-api.open-meteo.com/v1/search';

/** Variables solicitadas. Open-Meteo las devuelve todas en ug/m3. */
const VARIABLES = [
  'pm10', 'pm2_5', 'carbon_monoxide', 'nitrogen_dioxide', 'sulphur_dioxide', 'ozone', 'us_aqi',
];

/** Correspondencia entre los nombres de Open-Meteo y los nuestros. */
const MAPA = Object.freeze({
  pm2_5: 'pm25',
  pm10: 'pm10',
  ozone: 'o3',
  nitrogen_dioxide: 'no2',
  sulphur_dioxide: 'so2',
  carbon_monoxide: 'co',
});

/** Vigencia de la cache: los modelos se actualizan cada hora. */
const CACHE_MS = 15 * 60 * 1000;
const cache = new Map();

class ErrorAire extends Error {
  constructor(mensaje, codigo) { super(mensaje); this.codigo = codigo; }
}

async function pedirJSON(url, { timeoutMs = 12000 } = {}) {
  const control = new AbortController();
  const temporizador = setTimeout(() => control.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: control.signal, headers: { Accept: 'application/json' } });
    if (!res.ok) {
      throw new ErrorAire(`El servicio respondio ${res.status}.`, res.status === 429 ? 'limite' : 'http');
    }
    const datos = await res.json();
    // Open-Meteo senala los errores con {error: true, reason: "..."}
    if (datos && datos.error) throw new ErrorAire(datos.reason || 'Peticion rechazada.', 'api');
    return datos;
  } catch (e) {
    if (e.name === 'AbortError') throw new ErrorAire('El servicio tardo demasiado en responder.', 'timeout');
    if (e instanceof ErrorAire) throw e;
    throw new ErrorAire('No se pudo conectar con el servicio de calidad del aire.', 'red');
  } finally {
    clearTimeout(temporizador);
  }
}

/**
 * Consulta la calidad del aire de unas coordenadas.
 * @param {number} lat
 * @param {number} lon
 * @returns {Promise<{aqi:object, lecturas:object, crudas:object, meta:object}>}
 */
async function consultarAire(lat, lon, { forzar = false } = {}) {
  const la = Number(lat), lo = Number(lon);
  if (!Number.isFinite(la) || !Number.isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) {
    throw new ErrorAire('Coordenadas no validas.', 'entrada');
  }

  const clave = `${la.toFixed(3)},${lo.toFixed(3)}`;
  const guardado = cache.get(clave);
  if (!forzar && guardado && Date.now() - guardado.momento < CACHE_MS) return guardado.datos;

  const url = `${BASE}?latitude=${la}&longitude=${lo}&current=${VARIABLES.join(',')}&timezone=auto`;
  const datos = await pedirJSON(url);

  const actual = datos.current;
  if (!actual || typeof actual !== 'object') {
    throw new ErrorAire('La respuesta no trae mediciones actuales.', 'formato');
  }

  // Concentraciones crudas en ug/m3, tal cual las publica la fuente.
  const crudas = {};
  for (const [origen, propio] of Object.entries(MAPA)) {
    const v = actual[origen];
    if (Number.isFinite(v)) crudas[propio] = v;
  }
  if (!Object.keys(crudas).length) {
    throw new ErrorAire('No hay datos de contaminantes para esta ubicacion.', 'sin_datos');
  }

  // Conversion a las unidades de los tramos de la EPA y calculo con nuestro motor.
  const lecturas = normalizarDesdeUgm3(crudas);
  const aqi = calcularAQI(lecturas);
  if (!aqi) throw new ErrorAire('No se pudo calcular el indice con los datos recibidos.', 'calculo');

  const resultado = {
    aqi,
    lecturas,
    crudas,
    meta: {
      lat: datos.latitude ?? la,
      lon: datos.longitude ?? lo,
      zona: datos.timezone || null,
      medidoEn: actual.time || null,
      elevacion: datos.elevation ?? null,
      aqiDeLaFuente: Number.isFinite(actual.us_aqi) ? actual.us_aqi : null,
      fuente: 'Open-Meteo (CAMS / GEOS-CF)',
      consultadoEn: new Date().toISOString(),
    },
  };

  cache.set(clave, { momento: Date.now(), datos: resultado });
  return resultado;
}

/** Pide la posicion del navegador. Requiere HTTPS y permiso del usuario. */
function ubicacionActual({ timeoutMs = 12000 } = {}) {
  return new Promise((resolve, reject) => {
    if (typeof navigator === 'undefined' || !navigator.geolocation) {
      reject(new ErrorAire('Este navegador no ofrece geolocalizacion.', 'no_soportado'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, precision: pos.coords.accuracy }),
      (err) => {
        const motivos = {
          1: 'Has denegado el permiso de ubicacion. Puedes buscar tu ciudad a mano.',
          2: 'No se pudo determinar tu posicion.',
          3: 'La localizacion tardo demasiado.',
        };
        reject(new ErrorAire(motivos[err.code] || 'No se pudo obtener la ubicacion.', 'geo'));
      },
      { enableHighAccuracy: false, timeout: timeoutMs, maximumAge: 300000 }
    );
  });
}

/** Busca ciudades por nombre (geocodificacion de Open-Meteo, tambien sin clave). */
async function buscarCiudad(nombre) {
  const q = String(nombre || '').trim();
  if (q.length < 2) return [];
  const url = `${GEO}?name=${encodeURIComponent(q)}&count=8&language=es&format=json`;
  const datos = await pedirJSON(url);
  return (datos.results || []).map((r) => ({
    nombre: r.name,
    region: [r.admin1, r.country].filter(Boolean).join(', '),
    lat: r.latitude,
    lon: r.longitude,
    pais: r.country_code,
  }));
}
