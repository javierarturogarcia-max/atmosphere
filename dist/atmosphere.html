<!DOCTYPE html>
<html lang="es" data-tema="bosque">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atmosphere — Accion climatica gamificada</title>
<meta name="description" content="Atmosphere — plataforma gamificada de accion climatica con motor de impacto cientifico, analitica estadistica y recompensas.">
<meta name="theme-color" content="#05090f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================================
   Atmosphere — sistema de diseno
   Paleta: atmosfera nocturna (fondo) + biosfera (acentos verdes y cian).
   Todo en variables para poder cambiar de tema sin tocar componentes.
   ========================================================================= */

:root {
  --fondo:        #05090f;
  --fondo-2:      #0a121c;
  --superficie:   rgba(255, 255, 255, 0.045);
  --superficie-2: rgba(255, 255, 255, 0.075);
  --borde:        rgba(255, 255, 255, 0.10);
  --borde-fuerte: rgba(255, 255, 255, 0.20);
  --texto:        #e8f0f8;
  --texto-2:      #93a4b8;
  --texto-3:      #62748c;

  --verde:   #34d399;
  --verde-2: #4ade80;
  --cian:    #22d3ee;
  --azul:    #38bdf8;
  --ambar:   #fbbf24;
  --naranja: #fb923c;
  --rojo:    #f87171;
  --morado:  #c084fc;
  --rosa:    #f472b6;

  --radio:    16px;
  --radio-s:  10px;
  --radio-xs: 7px;
  --sombra:   0 12px 40px rgba(0, 0, 0, 0.45);
  --transicion: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  --ancho-max: 1240px;
  --fuente: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
}

[data-tema='oceano'] { --verde: #22d3ee; --verde-2: #38bdf8; --cian: #67e8f9; --fondo: #030a12; }
[data-tema='bosque'] { --verde: #34d399; --verde-2: #a3e635; --cian: #2dd4bf; }
[data-tema='claro'] {
  --fondo: #f4f7fa; --fondo-2: #ffffff;
  --superficie: rgba(15, 30, 50, 0.04); --superficie-2: rgba(15, 30, 50, 0.07);
  --borde: rgba(15, 30, 50, 0.12); --borde-fuerte: rgba(15, 30, 50, 0.22);
  --texto: #0d1b2a; --texto-2: #47586c; --texto-3: #7a8b9e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--fuente);
  background: var(--fondo);
  color: var(--texto);
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Halo atmosferico de fondo */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 500px at 12% -8%,  rgba(52, 211, 153, 0.16), transparent 60%),
    radial-gradient(760px 460px at 92% 4%,   rgba(34, 211, 238, 0.13), transparent 62%),
    radial-gradient(1000px 620px at 50% 108%, rgba(56, 189, 248, 0.10), transparent 60%);
}

/* ------------------------------------------------------------------ layout */
.app { display: flex; min-height: 100vh; }

.lateral {
  width: 244px; flex-shrink: 0;
  border-right: 1px solid var(--borde);
  padding: 22px 14px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(5, 9, 15, 0.55);
  backdrop-filter: blur(14px);
  overflow-y: auto;
}

.marca { display: flex; align-items: center; gap: 11px; padding: 4px 10px 20px; }
.marca-icono { font-size: 27px; line-height: 1; filter: drop-shadow(0 0 14px rgba(52, 211, 153, 0.55)); }
.marca-texto { font-weight: 800; font-size: 20px; letter-spacing: -0.4px; }
.marca-texto span { color: var(--verde); }
.marca-sub { font-size: 10.5px; color: var(--texto-3); letter-spacing: 1.4px; text-transform: uppercase; font-weight: 600; }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 13px; border-radius: var(--radio-s);
  color: var(--texto-2); cursor: pointer; font-size: 14.5px; font-weight: 500;
  border: none; background: none; width: 100%; text-align: left;
  transition: var(--transicion); font-family: inherit;
}
.nav-item:hover { background: var(--superficie); color: var(--texto); }
.nav-item.activo { background: var(--superficie-2); color: var(--texto); box-shadow: inset 3px 0 0 var(--verde); }
.nav-item .ico { font-size: 17px; width: 22px; text-align: center; }
.nav-sep { height: 1px; background: var(--borde); margin: 10px 8px; }

.principal { flex: 1; min-width: 0; padding: 26px 30px 100px; max-width: var(--ancho-max); margin: 0 auto; width: 100%; }

.nav-inferior { display: none; }

/* ------------------------------------------------------------- tipografia */
h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.7px; margin-bottom: 5px; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 12px; }
h3 { font-size: 14.5px; font-weight: 650; margin-bottom: 7px; }
.sub { color: var(--texto-2); font-size: 14px; margin-bottom: 22px; max-width: 74ch; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mini { font-size: 12px; color: var(--texto-3); }
.etiqueta { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--texto-3); font-weight: 700; }

/* ------------------------------------------------------------------ tarjetas */
.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 19px;
  backdrop-filter: blur(10px);
  transition: var(--transicion);
}
.tarjeta.interactiva { cursor: pointer; }
.tarjeta.interactiva:hover { background: var(--superficie-2); border-color: var(--borde-fuerte); transform: translateY(-2px); }

.rejilla { display: grid; gap: 15px; }
.rejilla.c2 { grid-template-columns: repeat(2, 1fr); }
.rejilla.c3 { grid-template-columns: repeat(3, 1fr); }
.rejilla.c4 { grid-template-columns: repeat(4, 1fr); }
.rejilla.auto { grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
.rejilla.ancha { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.fila { display: flex; align-items: center; gap: 11px; }
.fila.entre { justify-content: space-between; }
.fila.envuelve { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 11px; }
.crece { flex: 1; min-width: 0; }
.seccion { margin-bottom: 28px; }

/* -------------------------------------------------------------- metricas */
.metrica-valor { font-size: 31px; font-weight: 800; letter-spacing: -1.1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metrica-valor.s { font-size: 22px; }
.metrica-unidad { font-size: 13px; color: var(--texto-3); font-weight: 600; margin-left: 3px; }
.metrica-pie { font-size: 12px; color: var(--texto-2); margin-top: 5px; }
.delta { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 20px; display: inline-flex; gap: 3px; align-items: center; }
.delta.sube { background: rgba(52, 211, 153, 0.15); color: var(--verde); }
.delta.baja { background: rgba(248, 113, 113, 0.15); color: var(--rojo); }
.delta.neutro { background: var(--superficie-2); color: var(--texto-2); }

/* --------------------------------------------------------------- botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 17px; border-radius: var(--radio-s);
  border: 1px solid var(--borde); background: var(--superficie);
  color: var(--texto); font-size: 14px; font-weight: 600; cursor: pointer;
  transition: var(--transicion); font-family: inherit; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--superficie-2); border-color: var(--borde-fuerte); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primario {
  background: linear-gradient(135deg, var(--verde), var(--cian));
  color: #04140d; border-color: transparent; font-weight: 700;
}
.btn.primario:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
.btn.peligro { color: var(--rojo); border-color: rgba(248, 113, 113, 0.35); }
.btn.s { padding: 6px 12px; font-size: 12.5px; }
.btn.bloque { width: 100%; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 20px;
  background: var(--superficie); border: 1px solid var(--borde);
  font-size: 12.5px; font-weight: 600; cursor: pointer; transition: var(--transicion);
  color: var(--texto-2); font-family: inherit;
}
.chip:hover { background: var(--superficie-2); color: var(--texto); }
.chip.activo { background: rgba(52, 211, 153, 0.16); border-color: var(--verde); color: var(--verde); }
.chip.estatico { cursor: default; }

/* -------------------------------------------------------- formularios */
label.campo { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--texto-2); font-weight: 600; }
input, select, textarea {
  background: var(--fondo-2); border: 1px solid var(--borde);
  border-radius: var(--radio-xs); padding: 9px 11px;
  color: var(--texto); font-size: 14px; font-family: inherit; width: 100%;
  transition: var(--transicion);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.13); }
input[type='range'] { padding: 0; accent-color: var(--verde); }
select option { background: var(--fondo-2); color: var(--texto); }

/* ------------------------------------------------------------- progreso */
.barra { height: 8px; background: var(--superficie-2); border-radius: 20px; overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--verde), var(--cian)); transition: width 500ms cubic-bezier(0.4, 0, 0.2, 1); }
.barra.fina { height: 5px; }

/* ------------------------------------------------------------ insignias */
.insignia {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 15px 11px; border-radius: var(--radio-s);
  background: var(--superficie); border: 1px solid var(--borde);
  text-align: center; transition: var(--transicion); position: relative; overflow: hidden;
}
.insignia.bloqueada { opacity: 0.42; filter: grayscale(0.85); }
.insignia.desbloqueada { border-color: var(--borde-fuerte); }
.insignia-icono { font-size: 30px; line-height: 1; }
.insignia-titulo { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
.insignia-nivel { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.9px; font-weight: 800; }

/* ---------------------------------------------------------------- tablas */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.9px; color: var(--texto-3); padding: 9px 11px; font-weight: 700; border-bottom: 1px solid var(--borde); }
td { padding: 10px 11px; border-bottom: 1px solid var(--borde); }
tr:last-child td { border-bottom: none; }
tr.destacada td { background: rgba(52, 211, 153, 0.09); font-weight: 650; }
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------------------------------------------------------------- avisos */
.aviso { padding: 11px 14px; border-radius: var(--radio-s); font-size: 13px; display: flex; gap: 9px; align-items: flex-start; border: 1px solid; line-height: 1.45; }
.aviso.info    { background: rgba(56, 189, 248, 0.10); border-color: rgba(56, 189, 248, 0.28); color: #bae6fd; }
.aviso.exito   { background: rgba(52, 211, 153, 0.10); border-color: rgba(52, 211, 153, 0.28); color: #a7f3d0; }
.aviso.alerta  { background: rgba(251, 191, 36, 0.10); border-color: rgba(251, 191, 36, 0.28); color: #fde68a; }
.aviso.error   { background: rgba(248, 113, 113, 0.10); border-color: rgba(248, 113, 113, 0.28); color: #fecaca; }

/* --------------------------------------------------------------- toasts */
.toasts { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 9px; z-index: 1000; max-width: min(360px, calc(100vw - 32px)); }
.toast {
  background: rgba(10, 18, 28, 0.97); border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio-s); padding: 12px 15px; box-shadow: var(--sombra);
  display: flex; gap: 11px; align-items: flex-start;
  animation: entrar 320ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
  backdrop-filter: blur(14px);
}
.toast.exito { border-left: 3px solid var(--verde); }
.toast.error { border-left: 3px solid var(--rojo); }
.toast.logro { border-left: 3px solid var(--ambar); }
.toast-icono { font-size: 21px; line-height: 1.1; }
.toast-titulo { font-size: 13.5px; font-weight: 700; }
.toast-texto { font-size: 12.5px; color: var(--texto-2); }
@keyframes entrar { from { opacity: 0; transform: translateX(28px) scale(0.95); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- modal */
.modal-fondo {
  position: fixed; inset: 0; background: rgba(2, 5, 10, 0.78); backdrop-filter: blur(7px);
  display: flex; align-items: center; justify-content: center; z-index: 900; padding: 20px;
  animation: aparecer 180ms ease;
}
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--fondo-2); border: 1px solid var(--borde-fuerte); border-radius: var(--radio);
  padding: 24px; max-width: 540px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: var(--sombra);
}

/* -------------------------------------------------------------- graficos */
.svg-grafico { width: 100%; height: auto; display: block; overflow: visible; }
.mapa-calor { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.mapa-celda { width: 12px; height: 12px; border-radius: 3px; background: var(--superficie-2); transition: var(--transicion); }
.mapa-celda:hover { outline: 1.5px solid var(--verde); }

/* ---------------------------------------------------------------- varios */
.pastilla { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
.oculto { display: none !important; }
.centrado { text-align: center; }
.vacio { text-align: center; padding: 44px 20px; color: var(--texto-3); }
.vacio .ico { font-size: 42px; margin-bottom: 11px; display: block; opacity: 0.65; }
.divisor { height: 1px; background: var(--borde); margin: 16px 0; }
.scroll-x { overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
.scroll-x::-webkit-scrollbar { height: 5px; }
.scroll-x::-webkit-scrollbar-thumb { background: var(--borde-fuerte); border-radius: 5px; }
.enlace { color: var(--cian); text-decoration: none; border-bottom: 1px solid transparent; }
.enlace:hover { border-bottom-color: currentColor; }
.pulso { animation: pulso 2.1s ease-in-out infinite; }
@keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ------------------------------------------------------------ responsive */
@media (max-width: 900px) {
  .rejilla.c4 { grid-template-columns: repeat(2, 1fr); }
  .rejilla.c3 { grid-template-columns: repeat(2, 1fr); }
  .lateral { display: none; }
  .principal { padding: 18px 15px 92px; }
  h1 { font-size: 22px; }
  .metrica-valor { font-size: 26px; }
  .nav-inferior {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(5, 9, 15, 0.96); backdrop-filter: blur(18px);
    border-top: 1px solid var(--borde); padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
    /* Doce vistas no caben en una pantalla de movil: la barra se desplaza en
       horizontal en vez de esconder la mitad de la aplicacion. */
    justify-content: flex-start; gap: 2px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .nav-inferior::-webkit-scrollbar { display: none; }
  .nav-inferior .nav-item {
    flex: 0 0 auto; width: 66px;
    flex-direction: column; gap: 2px; padding: 6px 3px; font-size: 9.5px;
    box-shadow: none !important; border-radius: var(--radio-xs); text-align: center; font-weight: 600;
    scroll-snap-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-inferior .nav-item.activo { background: var(--superficie-2); color: var(--verde); }
  .nav-inferior .nav-item .ico { font-size: 19px; width: auto; }
  .toasts { bottom: 78px; right: 12px; left: 12px; max-width: none; }
}
@media (max-width: 560px) {
  .rejilla.c2, .rejilla.c3, .rejilla.c4 { grid-template-columns: 1fr; }
  .rejilla.auto { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
</head>

  <div style="display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:14px">
    <div style="font-size:52px">🌍</div>
    <div style="color:#93a4b8;font-family:system-ui,sans-serif">Cargando Atmosphere...</div>
  </div>
</div>

  const puntos = serie.map((p, i) => `${px(i).toFixed(1)},${py(p.valor).toFixed(1)}`).join(' ');
  const area = `${pad.l},${pad.t + altoUtil} ${puntos} ${px(n - 1)},${pad.t + altoUtil}`;
  const id = `g${Math.random().toString(36).slice(2, 8)}`;

  let extra = '';
  if (tendencia && n > 2) {
    const y0 = py(Math.max(0, tendencia.intercepto));
    const y1 = py(Math.max(0, tendencia.intercepto + tendencia.pendiente * (n - 1)));
    extra = `<line x1="${pad.l}" y1="${y0.toFixed(1)}" x2="${px(n - 1)}" y2="${y1.toFixed(1)}"
      stroke="var(--ambar)" stroke-width="2" stroke-dasharray="7 5" opacity="0.85"/>`;
  }

  const marcas = etiquetas ? serie.map((p, i) => {
    if (n > 12 && i % Math.ceil(n / 6) !== 0 && i !== n - 1) return '';
    return `<text x="${px(i).toFixed(1)}" y="${H - 4}" fill="var(--texto-3)" font-size="19"
      text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${p.dia.slice(5).replace('-', '/')}</text>`;
  }).join('') : '';

  return el('div', {
    html: `<svg class="svg-grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Serie temporal">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${relleno ? `<polygon points="${area}" fill="url(#${id})"/>` : ''}
      <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${extra}${marcas}
    </svg>`,
  });
}

/** Barras verticales comparativas. */
function graficoBarras(datos, { alto = 170, color = 'var(--cian)', unidad = '' } = {}) {
  if (!datos.length) return el('div', { clase: 'vacio mini', texto: 'Sin datos' });
  const max = Math.max(...datos.map((d) => d.valor), 0.0001);
  const filas = datos.map((d) => `
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <span style="width:112px;font-size:12.5px;color:var(--texto-2);overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap">${esc(d.etiqueta)}</span>
      <div style="flex:1;height:20px;background:var(--superficie-2);border-radius:5px;overflow:hidden">
        <div style="height:100%;width:${((d.valor / max) * 100).toFixed(1)}%;
          background:${d.color || color};border-radius:5px;transition:width 600ms"></div>
      </div>
      <span class="mono" style="width:74px;text-align:right;font-size:12.5px;font-weight:650">
        ${num(d.valor)}${unidad ? ` ${unidad}` : ''}</span>
    </div>`).join('');
  return el('div', { html: filas, estilo: `min-height:${Math.min(alto, datos.length * 27)}px` });
}

/** Anillo de proporciones con leyenda. */
function graficoDonut(datos, { tamano = 168, grosor = 22, centro = null } = {}) {
  const total = datos.reduce((s, d) => s + d.valor, 0);
  if (total <= 0) return el('div', { clase: 'vacio mini', texto: 'Sin datos' });
  const R = tamano / 2, r = R - grosor / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const arcos = datos.map((d) => {
    const frac = d.valor / total;
    const seg = `<circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="${d.color}"
      stroke-width="${grosor}" stroke-dasharray="${(frac * circ).toFixed(2)} ${circ.toFixed(2)}"
      stroke-dashoffset="${(-offset * circ).toFixed(2)}" transform="rotate(-90 ${R} ${R})"
      stroke-linecap="butt"><title>${esc(d.etiqueta)}: ${num(d.valor)}</title></circle>`;
    offset += frac;
    return seg;
  }).join('');

  const leyenda = datos.map((d) => `
    <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px">
      <span style="width:9px;height:9px;border-radius:2px;background:${d.color};flex-shrink:0"></span>
      <span style="flex:1;color:var(--texto-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.etiqueta)}</span>
      <span class="mono" style="font-weight:650">${((d.valor / total) * 100).toFixed(0)} %</span>
    </div>`).join('');

  return el('div', {
    clase: 'fila envuelve',
    html: `<div style="position:relative;flex-shrink:0">
      <svg width="${tamano}" height="${tamano}" viewBox="0 0 ${tamano} ${tamano}" role="img">
        <circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="var(--superficie-2)" stroke-width="${grosor}"/>
        ${arcos}
      </svg>
      ${centro ? `<div style="position:absolute;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;pointer-events:none">
        <div style="font-size:21px;font-weight:800;letter-spacing:-0.6px">${esc(centro.valor)}</div>
        <div style="font-size:10.5px;color:var(--texto-3);text-transform:uppercase;letter-spacing:0.9px">${esc(centro.etiqueta)}</div>
      </div>` : ''}
    </div>
    <div style="flex:1;min-width:150px">${leyenda}</div>`,
  });
}

/** Medidor semicircular para indices acotados (AQI, confianza, progreso). */
function medidor(valor, { min = 0, max = 100, color = 'var(--verde)', etiqueta = '', sufijo = '' } = {}) {
  const frac = Math.max(0, Math.min(1, (valor - min) / (max - min)));
  const W = 200, H = 116, cx = 100, cy = 100, r = 78;
  const ang = Math.PI * (1 - frac);
  const x = cx + r * Math.cos(ang), y = cy - r * Math.sin(ang);
  const largo = frac > 0.5 ? 1 : 0;
  return el('div', {
    html: `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:210px" role="img" aria-label="${esc(etiqueta)}">
      <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none"
        stroke="var(--superficie-2)" stroke-width="15" stroke-linecap="round"/>
      <path d="M ${cx - r} ${cy} A ${r} ${r} 0 ${largo} 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none"
        stroke="${color}" stroke-width="15" stroke-linecap="round"/>
      <text x="${cx}" y="${cy - 16}" text-anchor="middle" font-size="34" font-weight="800" fill="var(--texto)">${esc(String(valor))}</text>
      <text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="12" fill="var(--texto-3)">${esc(sufijo || etiqueta)}</text>
    </svg>`,
  });
}

/** Mapa de calor tipo contribuciones: 7 filas (dias) x N columnas (semanas). */
function mapaCalor(serie, { color = '52, 211, 153' } = {}) {
  const max = Math.max(...serie.map((p) => p.valor), 0.0001);
  const celdas = serie.map((p) => {
    const intensidad = p.valor <= 0 ? 0 : 0.18 + 0.82 * Math.min(1, p.valor / max);
    return `<div class="mapa-celda" title="${p.dia}: ${num(p.valor)}"
      style="background:${p.valor > 0 ? `rgba(${color}, ${intensidad.toFixed(2)})` : 'var(--superficie-2)'}"></div>`;
  }).join('');
  return el('div', { clase: 'scroll-x', html: `<div class="mapa-calor">${celdas}</div>` });
}

/** Linea comparativa horizontal con marcadores de referencia. */
function barraComparativa(valor, referencias, { max = null, unidad = '', color = 'var(--verde)' } = {}) {
  const tope = max || Math.max(valor, ...referencias.map((r) => r.valor)) * 1.15;
  const marcas = referencias.map((r) => `
    <div style="position:absolute;left:${Math.min(98, (r.valor / tope) * 100).toFixed(1)}%;top:-4px;bottom:-4px;
      border-left:2px dashed ${r.color || 'var(--texto-3)'}">
      <span style="position:absolute;top:-19px;left:4px;font-size:10px;color:${r.color || 'var(--texto-3)'};
        white-space:nowrap;font-weight:650">${esc(r.etiqueta)}</span>
    </div>`).join('');
  return el('div', {
    estilo: 'margin:26px 0 10px',
    html: `<div style="position:relative;height:22px;background:var(--superficie-2);border-radius:6px">
      <div style="height:100%;width:${Math.min(100, (valor / tope) * 100).toFixed(1)}%;
        background:linear-gradient(90deg, ${color}, var(--cian));border-radius:6px"></div>
      ${marcas}
    </div>
    <div class="mini" style="margin-top:5px">Tu valor: <strong class="mono" style="color:var(--texto)">${num(valor)} ${esc(unidad)}</strong></div>`,
  });
}

/** Tarjeta de metrica reutilizable. */
function tarjetaMetrica({ etiqueta, valor, unidad = '', pie = '', delta = null, color = null, icono = null }) {
  const d = delta === null ? null : el('span', {
    clase: `delta ${delta > 0 ? 'sube' : delta < 0 ? 'baja' : 'neutro'}`,
    texto: `${delta > 0 ? '▲' : delta < 0 ? '▼' : '='} ${Math.abs(delta * 100).toFixed(0)} %`,
  });
  return el('div', { clase: 'tarjeta' }, [
    el('div', { clase: 'fila entre' }, [
      el('span', { clase: 'etiqueta', texto: etiqueta }),
      icono ? el('span', { estilo: 'font-size:17px', texto: icono }) : null,
    ]),
    el('div', { clase: 'fila', estilo: 'margin-top:7px;align-items:baseline' }, [
      el('span', { clase: 'metrica-valor', estilo: color ? `color:${color}` : '', texto: valor }),
      unidad ? el('span', { clase: 'metrica-unidad', texto: unidad }) : null,
    ]),
    pie || d ? el('div', { clase: 'fila', estilo: 'margin-top:5px;gap:7px' }, [
      d, pie ? el('span', { clase: 'metrica-pie', texto: pie }) : null,
    ]) : null,
  ]);
}

/** Barra de progreso con texto. */
function progreso(fraccion, { texto = '', color = null, fina = false } = {}) {
  return el('div', {}, [
    el('div', { clase: `barra${fina ? ' fina' : ''}` }, [
      el('i', { estilo: `width:${Math.min(100, Math.max(0, fraccion * 100)).toFixed(1)}%${color ? `;background:${color}` : ''}` }),
    ]),
    texto ? el('div', { clase: 'mini', estilo: 'margin-top:5px', texto }) : null,
  ]);
}

// ================================================================ overlays

let contenedorToasts = null;

/** Notificacion efimera. */
function toast({ titulo, texto = '', tipo = 'exito', icono = '✅', duracion = 4200 }) {
  if (!contenedorToasts) {
    contenedorToasts = el('div', { clase: 'toasts', 'aria-live': 'polite' });
    document.body.appendChild(contenedorToasts);
  }
  const t = el('div', { clase: `toast ${tipo}` }, [
    el('div', { clase: 'toast-icono', texto: icono }),
    el('div', { clase: 'crece' }, [
      el('div', { clase: 'toast-titulo', texto: titulo }),
      texto ? el('div', { clase: 'toast-texto', texto }) : null,
    ]),
  ]);
  contenedorToasts.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 280ms, transform 280ms';
    t.style.opacity = '0';
    t.style.transform = 'translateX(24px)';
    setTimeout(() => t.remove(), 300);
  }, duracion);
  return t;
}

/** Modal con contenido arbitrario. Devuelve una funcion para cerrarlo. */
function modal(contenido, { titulo = '', ancho = null } = {}) {
  const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', onTecla); };
  const onTecla = (e) => { if (e.key === 'Escape') cerrar(); };
  const caja = el('div', { clase: 'modal', estilo: ancho ? `max-width:${ancho}px` : '' }, [
    titulo ? el('div', { clase: 'fila entre', estilo: 'margin-bottom:15px' }, [
      el('h2', { estilo: 'margin:0', texto: titulo }),
      el('button', { clase: 'btn s', texto: '✕', onclick: cerrar, 'aria-label': 'Cerrar' }),
    ]) : null,
    contenido,
  ]);
  const fondo = el('div', {
    clase: 'modal-fondo', role: 'dialog', 'aria-modal': 'true',
    onclick: (e) => { if (e.target === fondo) cerrar(); },
  }, [caja]);
  document.body.appendChild(fondo);
  document.addEventListener('keydown', onTecla);
  return cerrar;
}

/** Estado vacio reutilizable. */
function vacio(icono, titulo, texto = '') {
  return el('div', { clase: 'vacio' }, [
    el('span', { clase: 'ico', texto: icono }),

    texto ? el('div', { clase: 'mini', estilo: 'margin-top:5px', texto }) : null,
  ]);
}

 * Todo lo que la app afirma sobre "tendencias" y "proyecciones" sale de aqui.
 * Se prefieren estimadores ROBUSTOS (mediana, Theil-Sen, Mann-Kendall) porque
 * las series de conducta humana tienen valores atipicos y no son normales.
 */

// --------------------------------------------------------------- descriptivos
function suma(xs) { return xs.reduce((a, b) => a + b, 0); }

function media(xs) { return xs.length ? suma(xs) / xs.length : 0; }

function mediana(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** Varianza muestral (n-1, insesgada). */
function varianza(xs) {
  if (xs.length < 2) return 0;
  const m = media(xs);
  return suma(xs.map((x) => (x - m) ** 2)) / (xs.length - 1);
}

function desviacion(xs) { return Math.sqrt(varianza(xs)); }

/** Coeficiente de variacion: dispersion relativa, util para comparar categorias. */
function coefVariacion(xs) {
  const m = media(xs);
  return m === 0 ? 0 : desviacion(xs) / m;
}

/** Percentil por interpolacion lineal (metodo R-7, el de Excel y NumPy). */
function percentil(xs, p) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const idx = (s.length - 1) * Math.min(Math.max(p, 0), 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);
}

/** Rango percentil de un valor dentro de una muestra, en 0..100. */
function rangoPercentil(xs, valor) {
  if (!xs.length) return 50;
  const menores = xs.filter((x) => x < valor).length;
  const iguales = xs.filter((x) => x === valor).length;
  return ((menores + 0.5 * iguales) / xs.length) * 100;
}

/** Rango intercuartilico y limites de Tukey para deteccion de atipicos. */
function tukey(xs, k = 1.5) {
  const q1 = percentil(xs, 0.25), q3 = percentil(xs, 0.75);
  const iqr = q3 - q1;
  return { q1, q3, iqr, inferior: q1 - k * iqr, superior: q3 + k * iqr };
}

function atipicos(xs, k = 1.5) {
  const { inferior, superior } = tukey(xs, k);
  return xs.filter((x) => x < inferior || x > superior);
}

/** Puntuacion z clasica. */
function z(valor, xs) {
  const d = desviacion(xs);
  return d === 0 ? 0 : (valor - media(xs)) / d;
}

/**
 * Z robusta (MAD): resiste atipicos, ideal para detectar registros fraudulentos.
 * Cuando la MAD es cero (historial constante, muy comun en habitos regulares)
 * degrada a la desviacion absoluta media, segun Iglewicz & Hoaglin (1993).
 * Si toda la serie es identica, cualquier valor distinto es maximamente atipico.
 */
function zRobusta(valor, xs) {
  if (!xs.length) return 0;
  const med = mediana(xs);
  const mad = mediana(xs.map((x) => Math.abs(x - med)));
  if (mad > 0) return (0.6745 * (valor - med)) / mad; // 0.6745 = phi^-1(0.75)
  const meanAD = media(xs.map((x) => Math.abs(x - med)));
  if (meanAD > 0) return (valor - med) / (1.253314 * meanAD);
  return valor === med ? 0 : Math.sign(valor - med) * 10;
}

// -------------------------------------------------------------------- suavizado
/** Media movil simple de ventana n. */
function mediaMovil(xs, ventana = 7) {
  if (ventana <= 1) return [...xs];
  return xs.map((_, i) => {
    const ini = Math.max(0, i - ventana + 1);
    return media(xs.slice(ini, i + 1));
  });
}

/** Suavizado exponencial (EWMA). alfa alto = mas reactivo. */
function ewma(xs, alfa = 0.3) {
  const salida = [];
  let s = xs[0] ?? 0;
  for (const x of xs) { s = alfa * x + (1 - alfa) * s; salida.push(s); }
  return salida;
}

// ------------------------------------------------------------------- regresion
/** Minimos cuadrados ordinarios y = a + b*x, con R2 y error tipico de b. */
function regresionLineal(ys, xs = null) {
  const n = ys.length;
  if (n < 2) return { pendiente: 0, intercepto: ys[0] ?? 0, r2: 0, ee: 0, n };
  const X = xs || ys.map((_, i) => i);
  const mx = media(X), my = media(ys);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (X[i] - mx) * (ys[i] - my); sxx += (X[i] - mx) ** 2; }
  const pendiente = sxx === 0 ? 0 : sxy / sxx;
  const intercepto = my - pendiente * mx;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercepto + pendiente * X[i];
    ssRes += (ys[i] - pred) ** 2;
    ssTot += (ys[i] - my) ** 2;
  }
  const r2 = ssTot === 0 ? (ssRes === 0 ? 1 : 0) : 1 - ssRes / ssTot;
  const ee = n > 2 && sxx > 0 ? Math.sqrt(ssRes / (n - 2) / sxx) : 0;
  return { pendiente, intercepto, r2, ee, n, predecir: (x) => intercepto + pendiente * x };
}

/**
 * Estimador de pendiente de Theil-Sen: mediana de las pendientes por pares.
 * Punto de ruptura del 29 %: aguanta atipicos que destrozan a OLS.
 */
function theilSen(ys, xs = null) {
  const n = ys.length;
  if (n < 2) return 0;
  const X = xs || ys.map((_, i) => i);
  const pendientes = [];
  for (let i = 0; i < n - 1; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = X[j] - X[i];
      if (dx !== 0) pendientes.push((ys[j] - ys[i]) / dx);
    }
  }
  return mediana(pendientes);
}

// ------------------------------------------------------------ test de tendencia
/** Funcion de distribucion normal acumulada (Abramowitz & Stegun 26.2.17). */
function normalAcumulada(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989422804014327 * Math.exp(-x * x / 2);
  let p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
          t * (-1.821255978 + t * 1.330274429))));
  p = 1 - p;
  return x >= 0 ? p : 1 - p;
}

/**
 * Test de Mann-Kendall: detecta tendencia monotona sin asumir normalidad.
 * Es el estandar en series ambientales (hidrologia, calidad del aire).
 * Devuelve S, tau de Kendall, Z y p bilateral.
 */
function mannKendall(ys) {
  const n = ys.length;
  if (n < 4) return { S: 0, tau: 0, Z: 0, p: 1, tendencia: 'insuficiente', n };
  let S = 0;
  for (let i = 0; i < n - 1; i++) {
    for (let j = i + 1; j < n; j++) S += Math.sign(ys[j] - ys[i]);
  }
  // Correccion por empates
  const conteos = new Map();
  for (const y of ys) conteos.set(y, (conteos.get(y) || 0) + 1);
  let ajuste = 0;
  for (const t of conteos.values()) if (t > 1) ajuste += t * (t - 1) * (2 * t + 5);
  const varS = (n * (n - 1) * (2 * n + 5) - ajuste) / 18;
  const Z = varS <= 0 ? 0 : (S > 0 ? (S - 1) : S < 0 ? (S + 1) : 0) / Math.sqrt(varS);
  const p = 2 * (1 - normalAcumulada(Math.abs(Z)));
  const tau = (2 * S) / (n * (n - 1));
  let tendencia = 'sin tendencia significativa';
  if (p < 0.05) tendencia = S > 0 ? 'creciente significativa' : 'decreciente significativa';
  else if (p < 0.10) tendencia = S > 0 ? 'creciente debil' : 'decreciente debil';
  return { S, tau, Z, p, tendencia, n };
}

// ------------------------------------------------------------------- intervalos
/**
 * Intervalo de confianza por bootstrap percentil.
 * No asume distribucion: se remuestrea con reposicion B veces.
 */
function bootstrapIC(xs, estadistico = media, B = 1000, nivel = 0.95, rnd = Math.random) {
  if (xs.length < 2) return { inferior: xs[0] ?? 0, superior: xs[0] ?? 0, estimacion: xs[0] ?? 0 };
  const reps = [];
  for (let b = 0; b < B; b++) {
    const m = new Array(xs.length);
    for (let i = 0; i < xs.length; i++) m[i] = xs[Math.floor(rnd() * xs.length)];
    reps.push(estadistico(m));
  }
  const alfa = (1 - nivel) / 2;
  return {
    estimacion: estadistico(xs),
    inferior: percentil(reps, alfa),
    superior: percentil(reps, 1 - alfa),
    nivel,
  };
}

/**
 * Propagacion de incertidumbre para una suma de terminos independientes:
 * sigma_total = sqrt(sum(sigma_i^2)) (ley de propagacion de errores).
 */
function propagarIncertidumbre(terminos) {
  const total = suma(terminos.map((t) => t.valor));
  const varTotal = suma(terminos.map((t) => (t.valor * t.inc) ** 2));
  const sigma = Math.sqrt(varTotal);
  return {
    valor: total,
    sigma,
    inferior: Math.max(0, total - 1.96 * sigma),
    superior: total + 1.96 * sigma,
    incRelativa: total === 0 ? 0 : sigma / total,
  };
}

// --------------------------------------------------------------------- indices
/** Correlacion de Pearson entre dos series de igual longitud. */
function pearson(xs, ys) {
  const n = Math.min(xs.length, ys.length);
  if (n < 2) return 0;
  const mx = media(xs.slice(0, n)), my = media(ys.slice(0, n));
  let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) {
    const a = xs[i] - mx, b = ys[i] - my;
    num += a * b; dx += a * a; dy += b * b;
  }
  return dx === 0 || dy === 0 ? 0 : num / Math.sqrt(dx * dy);
}

/**
 * Indice de Shannon: mide la diversidad de las acciones registradas.
 * H alto = conducta ecologica variada; H bajo = una sola palanca.
 */
function shannon(conteos) {
  const total = suma(conteos);
  if (total <= 0) return 0;
  const h = -suma(conteos.filter((c) => c > 0).map((c) => {
    const p = c / total;
    return p * Math.log(p);
  }));
  return h + 0; // normaliza el -0 que produce el negado de una suma nula
}

/** Equidad de Pielou: H normalizado a 0..1 por el numero de categorias. */
function pielou(conteos) {
  const usadas = conteos.filter((c) => c > 0).length;
  if (usadas < 2) return 0;
  return shannon(conteos) / Math.log(usadas);
}

/** Coeficiente de Gini: desigualdad de la distribucion (0 = igual, 1 = maxima). */
function gini(xs) {
  const s = [...xs].filter((x) => x >= 0).sort((a, b) => a - b);
  const n = s.length;
  if (n === 0) return 0;
  const total = suma(s);
  if (total === 0) return 0;
  let acum = 0;
  for (let i = 0; i < n; i++) acum += (2 * (i + 1) - n - 1) * s[i];
  return acum / (n * total);
}

/** Redondeo a d decimales evitando errores de coma flotante. */
function redondear(x, d = 2) {
  const f = 10 ** d;
  return Math.round((x + Number.EPSILON) * f) / f;
}

__def("src/core/impacto.js", function (__exp, __req) {
/**
 * impacto.js — Traduce "cantidad registrada" a impacto fisico evitado.
 *
 * Separado a proposito del sistema de puntos: el impacto es FISICA (kg CO2e,
 * litros, kg de residuo) y no debe contaminarse con reglas de juego. Los puntos
 * son una capa motivacional construida encima (ver puntos.js).
 */
const { intensidadRed } = __req("src/data/paises.js");
const { accion } = __req("src/data/acciones.js");
const { SUMIDEROS, EQUIVALENCIAS } = __req("src/data/factores.js");
const { propagarIncertidumbre, redondear } = __req("src/core/estadistica.js");

/** Incertidumbre relativa por defecto de un factor de accion (ACV tipico). */
const INC_POR_DEFECTO = 0.30;

/**
 * Calcula el impacto evitado por un registro.
 * @param {string} accionId
 * @param {number} cantidad  en la unidad de la accion
 * @param {{pais?: string}} opciones
 * @returns {{co2e:number, agua:number, residuo:number, kwh:number, detalle:object}}
 */
function calcularImpacto(accionId, cantidad, { pais = 'WW' } = {}) {
  const a = accion(accionId);
  if (!a) throw new Error(`Accion desconocida: ${accionId}`);
  const q = Number(cantidad);
  if (!Number.isFinite(q) || q <= 0) {
    return { co2e: 0, agua: 0, residuo: 0, kwh: 0, detalle: { motivo: 'cantidad no valida' } };
  }

  const kwh = (a.kwh || 0) * q;
  // Si la accion ahorra electricidad, su CO2e depende del mix del pais.
  const co2eRed = a.dependeRed ? kwh * intensidadRed(pais) : 0;
  const co2eDirecto = (a.co2e || 0) * q;
  const co2e = co2eDirecto + co2eRed;

  return {
    co2e: redondear(co2e, 4),
    agua: redondear((a.agua || 0) * q, 2),
    residuo: redondear((a.residuo || 0) * q, 4),
    kwh: redondear(kwh, 4),
    detalle: {
      accionId, cantidad: q, unidad: a.unidad, pais,
      dependeRed: !!a.dependeRed,
      intensidadRed: a.dependeRed ? intensidadRed(pais) : null,
      base: a.base,
    },
  };
}

/**
 * Impacto agregado de una lista de registros, con propagacion de incertidumbre.
 * Devuelve el intervalo de confianza al 95 % del CO2e total: honestidad cientifica.
 */
function agregarImpacto(registros) {
  const total = { co2e: 0, agua: 0, residuo: 0, kwh: 0 };
  const terminos = [];
  for (const r of registros) {
    total.co2e += r.impacto?.co2e || 0;
    total.agua += r.impacto?.agua || 0;
    total.residuo += r.impacto?.residuo || 0;
    total.kwh += r.impacto?.kwh || 0;
    const a = accion(r.accionId);
    terminos.push({ valor: r.impacto?.co2e || 0, inc: a?.inc ?? INC_POR_DEFECTO });
  }
  const ic = propagarIncertidumbre(terminos);
  return {
    co2e: redondear(total.co2e, 3),
    agua: redondear(total.agua, 1),
    residuo: redondear(total.residuo, 3),
    kwh: redondear(total.kwh, 2),
    co2eIC: { inferior: redondear(ic.inferior, 3), superior: redondear(ic.superior, 3), incRelativa: redondear(ic.incRelativa, 3) },
    n: registros.length,
  };
}

/** Agrupa el impacto por categoria de accion. */
function impactoPorCategoria(registros) {
  const mapa = new Map();
  for (const r of registros) {
    const a = accion(r.accionId);
    if (!a) continue;
    const actual = mapa.get(a.cat) || { co2e: 0, agua: 0, residuo: 0, n: 0, puntos: 0 };
    actual.co2e += r.impacto?.co2e || 0;
    actual.agua += r.impacto?.agua || 0;
    actual.residuo += r.impacto?.residuo || 0;
    actual.puntos += r.puntos || 0;
    actual.n += 1;
    mapa.set(a.cat, actual);
  }
  return [...mapa.entries()]
    .map(([cat, v]) => ({ cat, ...v, co2e: redondear(v.co2e, 3) }))
    .sort((x, y) => y.co2e - x.co2e);
}

/**
 * Convierte kg CO2e a equivalencias comprensibles.
 * La abstraccion "kg CO2e" no motiva a nadie: los equivalentes si.
 */
function equivalencias(co2eKg) {
  const c = Math.max(0, co2eKg);
  return {
    kmCoche: redondear(c / EQUIVALENCIAS.km_coche_gasolina, 1),
    cargasMovil: Math.round(c / EQUIVALENCIAS.carga_movil),
    botellas: Math.round(c / EQUIVALENCIAS.botella_plastico),
    hamburguesas: redondear(c / EQUIVALENCIAS.hamburguesa_res, 1),
    arbolesAnio: redondear(c / SUMIDEROS.arbol_anio, 2),
    m2BosqueAnio: redondear((c / SUMIDEROS.hectarea_bosque_anio) * 10000, 1),
    duchas: redondear(c / EQUIVALENCIAS.ducha_10min, 1),
  };
}

/** Equivalencias de agua en unidades cotidianas. */
function equivalenciasAgua(litros) {
  const L = Math.max(0, litros);
  return {
    duchas: redondear(L / 95, 1),
    banerasLlenas: redondear(L / 150, 1),
    diasConsumoPersona: redondear(L / 130, 1), // consumo domestico medio: 130 L/hab/dia
    botellas15: Math.round(L / 1.5),
  };
}

/** Frase de equivalencia mas expresiva segun la magnitud. */
function frasEquivalencia(co2eKg) {
  const e = equivalencias(co2eKg);
  if (co2eKg <= 0) return 'Sin impacto registrado todavia';
  if (co2eKg < 1) return `${e.cargasMovil} cargas de movil evitadas`;
  if (co2eKg < 25) return `${e.kmCoche} km en coche que no se han emitido`;
  if (co2eKg < 250) return `Lo que absorben ${e.arbolesAnio} arboles en un anio`;
  return `${redondear(co2eKg / 1000, 2)} t CO2e: mas de lo que emite una persona en un mes`;
}

  __exp.calcularImpacto = calcularImpacto;
  __exp.agregarImpacto = agregarImpacto;
  __exp.impactoPorCategoria = impactoPorCategoria;
  __exp.equivalencias = equivalencias;
  __exp.equivalenciasAgua = equivalenciasAgua;
  __exp.frasEquivalencia = frasEquivalencia;
});

__def("src/core/puntos.js", function (__exp, __req) {
/**
 * puntos.js — Motor de puntuacion.
 *
 * PRINCIPIO DE DISENO: los puntos derivan del impacto fisico real, no de la
 * simpatia del boton. Una accion que evita 10 kg CO2e vale ~10 veces mas que
 * una que evita 1 kg. Encima se aplican multiplicadores conductuales
 * (dificultad, rareza, racha, mision) y un freno de saturacion que impide
 * "farmear" una sola accion.
 *
 * Formula:
 *   base       = 10*co2e + 0.01*agua + 5*residuo   (+ suelo minimo)
 *   bruto      = base * f_dificultad * f_rareza * f_racha * f_mision * f_evento
 *   efectivo   = S(acumuladoCategoriaHoy + bruto) - S(acumuladoCategoriaHoy)
 *   donde S(x) = K * ln(1 + x/K)   -> rendimientos decrecientes por categoria/dia
 */
const { accion, RAREZAS } = __req("src/data/acciones.js");
const { redondear } = __req("src/core/estadistica.js");

/** Equivalencias de puntuacion entre dimensiones de impacto. */
const PESOS = Object.freeze({
  porKgCO2e: 10,      // 1 kg CO2e evitado = 10 puntos
  porLitroAgua: 0.01, // 1.000 L de agua  = 10 puntos
  porKgResiduo: 5,    // 1 kg desviado    = 5 puntos
  sueloMinimo: 3,     // acciones sin equivalencia directa (ciencia ciudadana)
});

/** Constante de saturacion por categoria y dia. Mas alta = menos freno. */
const K_SATURACION = 160;

/** Tope duro de puntos por dia: barrera final contra abusos. */
const TOPE_DIARIO = 2500;

/** Funcion de saturacion logaritmica. Concava, creciente, S(0)=0. */
function saturar(x, K = K_SATURACION) {
  return K * Math.log(1 + Math.max(0, x) / K);
}

/** Multiplicador por dificultad (1..5) -> 1.00 .. 1.48 */
function factorDificultad(d = 1) {
  return 1 + 0.12 * (Math.min(5, Math.max(1, d)) - 1);
}

/** Multiplicador por rareza del catalogo. */
function factorRareza(rareza = 'comun') {
  return RAREZAS[rareza]?.mult ?? 1;
}

/**
 * Multiplicador por racha: +2 % por dia consecutivo, tope +50 % a los 25 dias.
 * Crecimiento lineal saturado: refuerza el habito sin volverse absurdo.
 */
function factorRacha(dias = 0) {
  return 1 + Math.min(0.5, 0.02 * Math.max(0, dias));
}

/**
 * Puntos de un registro concreto.
 * @param {object} args
 * @param {string} args.accionId
 * @param {number} args.cantidad
 * @param {{co2e:number,agua:number,residuo:number}} args.impacto
 * @param {number} [args.racha]
 * @param {number} [args.acumuladoCategoriaHoy] puntos ya obtenidos hoy en la categoria
 * @param {number} [args.acumuladoDiaHoy] puntos totales ya obtenidos hoy
 * @param {boolean} [args.contribuyeMision]
 * @param {number} [args.factorEvento]
 */
function calcularPuntos({
  accionId,
  impacto,
  racha = 0,
  acumuladoCategoriaHoy = 0,
  acumuladoDiaHoy = 0,
  contribuyeMision = false,
  factorEvento = 1,
}) {
  const a = accion(accionId);
  if (!a) return { puntos: 0, desglose: { motivo: 'accion desconocida' } };

  const porCO2e = (impacto.co2e || 0) * PESOS.porKgCO2e;
  const porAgua = (impacto.agua || 0) * PESOS.porLitroAgua;
  const porResiduo = (impacto.residuo || 0) * PESOS.porKgResiduo;
  const base = Math.max(PESOS.sueloMinimo, porCO2e + porAgua + porResiduo);

  const fDif = factorDificultad(a.dificultad);
  const fRar = factorRareza(a.rareza);
  const fRac = factorRacha(racha);
  const fMis = contribuyeMision ? 1.5 : 1;
  const fEve = Number.isFinite(factorEvento) ? factorEvento : 1;

  const bruto = base * fDif * fRar * fRac * fMis * fEve;

  // Rendimientos decrecientes dentro de la categoria y el dia.
  const antes = saturar(acumuladoCategoriaHoy);
  const despues = saturar(acumuladoCategoriaHoy + bruto);
  let efectivo = despues - antes;

  // Tope diario absoluto.
  const margen = Math.max(0, TOPE_DIARIO - acumuladoDiaHoy);
  const topado = efectivo > margen;
  efectivo = Math.min(efectivo, margen);

  return {
    puntos: Math.max(0, Math.round(efectivo)),
    desglose: {
      base: redondear(base, 2),
      porCO2e: redondear(porCO2e, 2),
      porAgua: redondear(porAgua, 2),
      porResiduo: redondear(porResiduo, 2),
      factores: {
        dificultad: redondear(fDif, 3),
        rareza: redondear(fRar, 3),
        racha: redondear(fRac, 3),
        mision: fMis,
        evento: fEve,
      },
      bruto: redondear(bruto, 2),
      penalizacionSaturacion: redondear(bruto - (despues - antes), 2),
      topadoPorLimiteDiario: topado,
    },
  };
}

/**
 * Bonus de diversidad: premia repartir el esfuerzo entre categorias.
 * Un perfil que solo recicla no cambia su huella; la diversidad si.
 */
function bonusDiversidad(categoriasDistintasHoy) {
  const n = categoriasDistintasHoy;
  if (n >= 5) return { factor: 1.25, etiqueta: 'Diversidad excepcional (+25 %)' };
  if (n >= 4) return { factor: 1.15, etiqueta: 'Gran diversidad (+15 %)' };
  if (n >= 3) return { factor: 1.08, etiqueta: 'Buena diversidad (+8 %)' };
  return { factor: 1, etiqueta: '' };
}

/** Puntos teoricos maximos de una accion (para mostrar "hasta X pts" en el catalogo). */
function puntosOrientativos(accionId, cantidad, impacto) {

}

/**

 *
 * Es la pieza que ata el juego al entorno: cuando el aire de tu ciudad esta
 * mal, dejar el coche vale mas puntos, porque en ese momento vale mas de
 * verdad. Las emisiones evitadas en un episodio de contaminacion tienen un
 * efecto sanitario inmediato sobre las personas que estan respirando ese aire,
 * no solo un efecto climatico difuso a decadas vista.
 *
 * Solo se aplica a movilidad y energia, que son las categorias que influyen
 * sobre la contaminacion local. Reciclar no limpia el aire de hoy.
 *
 * @param {number} aqi indice de calidad del aire (escala EPA)
 * @param {string} categoria categoria de la accion

function factorAire(aqi, categoria) {
  if (!Number.isFinite(aqi) || !['movilidad', 'energia'].includes(categoria)) {
    return { factor: 1, etiqueta: '', nivel: null };

  if (aqi > 200) return { factor: 2.0, etiqueta: 'Aire muy daniño: puntuacion doble', nivel: 'muy_danina' };
  if (aqi > 150) return { factor: 1.75, etiqueta: 'Aire daniño: x1,75 en movilidad limpia', nivel: 'danina' };
  if (aqi > 100) return { factor: 1.5, etiqueta: 'Aire daniño para sensibles: x1,5', nivel: 'sensibles' };
  if (aqi > 50) return { factor: 1.25, etiqueta: 'Aire moderado: x1,25', nivel: 'moderada' };
  return { factor: 1, etiqueta: '', nivel: 'buena' };
}

/** Antiguedad maxima de una lectura para que siga contando: 3 horas. */
const VIGENCIA_AIRE_MS = 3 * 60 * 60 * 1000;

  __exp.PESOS = PESOS;
  __exp.K_SATURACION = K_SATURACION;

__def("src/core/rachas.js", function (__exp, __req) {
/**
 * rachas.js — Rachas diarias con congelaciones.
 * La racha es el mecanismo de retencion mas potente conocido en apps de habito,
 * pero castiga demasiado el fallo puntual: por eso se incluyen "congelaciones"
 * (protecciones) que absorben un dia perdido, como en los idiomas.
 */

/** Convierte una fecha a clave local YYYY-MM-DD (sin desplazamiento UTC). */
function claveDia(fecha = new Date()) {
  const d = fecha instanceof Date ? fecha : new Date(fecha);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

/** Diferencia en dias enteros entre dos claves YYYY-MM-DD. */
function diasEntre(claveA, claveB) {
  const a = new Date(`${claveA}T00:00:00`);
  const b = new Date(`${claveB}T00:00:00`);
  return Math.round((b - a) / 86400000);
}

/** Suma dias a una clave. */
function sumarDias(clave, n) {
  const d = new Date(`${clave}T00:00:00`);
  d.setDate(d.getDate() + n);
  return claveDia(d);
}

/**
 * Calcula la racha a partir del conjunto de dias con actividad.
 * @param {string[]} diasActivos claves YYYY-MM-DD (pueden venir desordenadas)
 * @param {string} hoy clave del dia de referencia
 * @param {number} congelaciones protecciones disponibles
 */
function calcularRacha(diasActivos, hoy = claveDia(), congelaciones = 0) {
  const set = new Set(diasActivos);
  if (set.size === 0) {
    return { actual: 0, usadasCongelaciones: 0, enRiesgo: false, ultimoDia: null, mejor: 0 };
  }
  const ordenados = [...set].sort();
  const ultimoDia = ordenados[ordenados.length - 1];

  // Punto de partida: hoy si hay actividad, si no ayer (el dia aun no ha acabado).
  let cursor = set.has(hoy) ? hoy : sumarDias(hoy, -1);
  let actual = 0;
  let usadas = 0;
  let libres = Math.max(0, congelaciones);

  while (true) {
    if (set.has(cursor)) {
      actual++;
      cursor = sumarDias(cursor, -1);
    } else if (libres > 0 && actual > 0) {
      libres--; usadas++;
      cursor = sumarDias(cursor, -1);
    } else break;
    if (actual > 3650) break; // guarda de seguridad
  }

  return {
    actual,
    usadasCongelaciones: usadas,
    enRiesgo: !set.has(hoy) && actual > 0,
    ultimoDia,
    mejor: mejorRacha(ordenados),
  };
}

/** Racha maxima historica en la serie de dias activos. */
function mejorRacha(diasOrdenados) {
  if (!diasOrdenados.length) return 0;
  let mejor = 1, actual = 1;
  for (let i = 1; i < diasOrdenados.length; i++) {
    actual = diasEntre(diasOrdenados[i - 1], diasOrdenados[i]) === 1 ? actual + 1 : 1;
    if (actual > mejor) mejor = actual;
  }
  return mejor;
}

/** Ultimos n dias en orden cronologico, para mapas de calor. */
function ultimosDias(n, hoy = claveDia()) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(sumarDias(hoy, -i));
  return out;
}

/** Congelaciones ganadas: 1 por cada 7 dias de racha, tope 3 acumuladas. */
function congelacionesGanadas(rachaActual, yaTiene = 0) {
  const merecidas = Math.floor(rachaActual / 7);
  return Math.max(0, Math.min(3 - yaTiene, merecidas - yaTiene));
}

  __exp.claveDia = claveDia;
  __exp.diasEntre = diasEntre;
  __exp.sumarDias = sumarDias;
  __exp.calcularRacha = calcularRacha;
  __exp.mejorRacha = mejorRacha;
  __exp.ultimosDias = ultimosDias;
  __exp.congelacionesGanadas = congelacionesGanadas;
});

__def("src/core/validacion.js", function (__exp, __req) {
/**
 * validacion.js — Integridad de los registros (antifraude).
 *
 * Sin verificacion, cualquier sistema de puntos se degrada: la gente registra
 * "300 km en bici" y el ranking pierde todo significado. Aqui se aplican cuatro
 * capas, de la mas barata a la mas cara:
 *   1. Limites fisicos de plausibilidad por accion y dia
 *   2. Tiempos de espera entre registros identicos
 *   3. Deteccion estadistica de anomalias frente al historial propio (z robusta)
 *   4. Coherencia interna (energia declarada frente a tiempo del dia, etc.)
 */
const { accion } = __req("src/data/acciones.js");
const { zRobusta } = __req("src/core/estadistica.js");
const { claveDia } = __req("src/core/rachas.js");

const NIVELES = Object.freeze({ OK: 'ok', AVISO: 'aviso', BLOQUEO: 'bloqueo' });

/** Minutos totales de un dia: nadie puede registrar mas actividad que esto. */
const MINUTOS_DIA = 1440;

/**
 * Valida un registro antes de aceptarlo.
 * @param {{accionId:string, cantidad:number, fecha?:string|Date}} propuesta
 * @param {Array} registrosPrevios historial completo del usuario
 * @returns {{nivel:string, mensajes:string[], cantidadAjustada:number, sospecha:number}}
 */
function validarRegistro(propuesta, registrosPrevios = []) {
  const a = accion(propuesta.accionId);
  const mensajes = [];
  if (!a) {
    return { nivel: NIVELES.BLOQUEO, mensajes: ['Accion desconocida.'], cantidadAjustada: 0, sospecha: 1 };
  }

  let cantidad = Number(propuesta.cantidad);
  if (!Number.isFinite(cantidad) || cantidad <= 0) {
    return { nivel: NIVELES.BLOQUEO, mensajes: ['La cantidad debe ser un numero mayor que cero.'], cantidadAjustada: 0, sospecha: 0 };
  }

  const ahora = propuesta.fecha ? new Date(propuesta.fecha) : new Date();
  const hoy = claveDia(ahora);
  const delDia = registrosPrevios.filter((r) => claveDia(new Date(r.fecha)) === hoy);
  const mismaAccionHoy = delDia.filter((r) => r.accionId === a.id);

  // --- Capa 1: tope diario de plausibilidad ------------------------------
  const acumuladoHoy = mismaAccionHoy.reduce((s, r) => s + (r.cantidad || 0), 0);
  const margen = Math.max(0, a.maxDiario - acumuladoHoy);
  let nivel = NIVELES.OK;
  if (margen <= 0) {
    return {
      nivel: NIVELES.BLOQUEO,
      mensajes: [`Ya has alcanzado el maximo diario para "${a.titulo}" (${a.maxDiario} ${a.unidad}).`],
      cantidadAjustada: 0, sospecha: 0,
    };
  }
  if (cantidad > margen) {
    mensajes.push(`Ajustado a ${margen} ${a.unidad}: es el maximo verosimil que queda hoy para esta accion.`);
    cantidad = margen;
    nivel = NIVELES.AVISO;
  }

  // --- Capa 2: tiempo de espera ------------------------------------------
  const ultimo = [...mismaAccionHoy].sort((x, y) => new Date(y.fecha) - new Date(x.fecha))[0];
  if (ultimo && a.cooldownMin > 0) {
    const minutos = (ahora - new Date(ultimo.fecha)) / 60000;
    if (minutos < a.cooldownMin) {
      return {
        nivel: NIVELES.BLOQUEO,
        mensajes: [`Espera ${Math.ceil(a.cooldownMin - minutos)} min antes de volver a registrar "${a.titulo}".`],
        cantidadAjustada: 0, sospecha: 0.4,
      };
    }
  }

  // --- Capa 3: anomalia frente al historial propio ------------------------
  const historial = registrosPrevios
    .filter((r) => r.accionId === a.id)
    .map((r) => r.cantidad)
    .filter((n) => Number.isFinite(n));
  let sospecha = 0;
  if (historial.length >= 5) {
    const zr = Math.abs(zRobusta(cantidad, historial));
    if (zr > 3.5) {
      sospecha = Math.min(1, zr / 10);
      mensajes.push(`Este valor es muy atipico frente a tu historial (z robusta = ${zr.toFixed(1)}). Se marcara para revision.`);
      nivel = NIVELES.AVISO;
    }
  }

  // --- Capa 4: coherencia temporal del dia --------------------------------
  const minutosDeclarados = estimarMinutos(delDia) + estimarMinutosAccion(a, cantidad);
  if (minutosDeclarados > MINUTOS_DIA) {
    return {
      nivel: NIVELES.BLOQUEO,
      mensajes: ['Los registros de hoy superan las 24 horas de actividad. Revisa las cantidades.'],
      cantidadAjustada: 0, sospecha: 0.9,
    };
  }
  if (minutosDeclarados > MINUTOS_DIA * 0.6) {
    mensajes.push('Llevas mas de 14 h de actividad declarada hoy: comprueba que sea correcto.');
    nivel = nivel === NIVELES.OK ? NIVELES.AVISO : nivel;
  }

  // --- Requisito de evidencia --------------------------------------------
  if (a.evidencia !== 'ninguna' && cantidad >= a.maxDiario * 0.5) {
    mensajes.push(`Registro grande: adjunta ${a.evidencia === 'gps' ? 'la traza GPS' : a.evidencia} para que cuente en el ranking verificado.`);
  }

  return { nivel, mensajes, cantidadAjustada: cantidad, sospecha };
}

/** Traduce una accion a minutos aproximados de dedicacion (para la capa 4). */
function estimarMinutosAccion(a, cantidad) {
  switch (a.unidad) {
    case 'min': return cantidad;
    case 'h':   return cantidad * 60;
    case 'km':  return a.id === 'mov_caminar' ? cantidad * 12 : a.id === 'mov_bici' ? cantidad * 4 : cantidad * 1.2;
    case 'dia': return 0;   // acciones pasivas
    case 'mes': return 0;
    default:    return 5;   // registro puntual
  }
}

function estimarMinutos(registrosDelDia) {
  return registrosDelDia.reduce((s, r) => {
    const a = accion(r.accionId);
    return a ? s + estimarMinutosAccion(a, r.cantidad || 0) : s;
  }, 0);
}

/**
 * Indice de confianza del perfil (0..1): que credito merece el historial.
 * Combina proporcion de registros con evidencia, dispersion y diversidad.
 */
function indiceConfianza(registros) {
  if (!registros.length) return { valor: 0.5, etiqueta: 'Sin historial', detalle: {} };
  const conEvidencia = registros.filter((r) => r.evidencia).length / registros.length;
  const sospechosos = registros.filter((r) => (r.sospecha || 0) > 0.3).length / registros.length;
  const categorias = new Set(registros.map((r) => accion(r.accionId)?.cat).filter(Boolean)).size;
  const diversidad = Math.min(1, categorias / 5);
  const dias = new Set(registros.map((r) => claveDia(new Date(r.fecha)))).size;
  const constancia = Math.min(1, dias / 30);

  const valor = Math.max(0, Math.min(1,
    0.35 * conEvidencia + 0.30 * (1 - sospechosos) + 0.20 * diversidad + 0.15 * constancia));

  const etiqueta = valor >= 0.8 ? 'Muy alta' : valor >= 0.6 ? 'Alta' : valor >= 0.4 ? 'Media' : 'Baja';
  return { valor, etiqueta, detalle: { conEvidencia, sospechosos, diversidad, constancia } };
}

  __exp.NIVELES = NIVELES;
  __exp.validarRegistro = validarRegistro;
  __exp.indiceConfianza = indiceConfianza;
});

__def("src/core/nivel.js", function (__exp, __req) {
/**
 * nivel.js — Progresion: experiencia, niveles y rangos.
 * La curva es superlineal (exponente 1,55) para que subir de nivel sea rapido
 * al principio (enganche) y significativo despues (retencion a largo plazo).
 */

const BASE_XP = 80;
const EXPONENTE = 1.55;

/** XP acumulada necesaria para alcanzar un nivel. */
function xpParaNivel(nivel) {
  const n = Math.max(1, Math.floor(nivel));
  return Math.round(BASE_XP * Math.pow(n - 1, EXPONENTE));
}

/** Nivel correspondiente a una XP acumulada (inversa de la curva). */
function nivelDesdeXP(xp) {
  const x = Math.max(0, xp);
  const n = Math.floor(Math.pow(x / BASE_XP, 1 / EXPONENTE)) + 1;
  // Ajuste por redondeo de la curva directa.
  let nivel = Math.max(1, n);
  while (xpParaNivel(nivel + 1) <= x) nivel++;
  while (nivel > 1 && xpParaNivel(nivel) > x) nivel--;
  return nivel;
}

/** Estado completo de progresion a partir de la XP. */
function progresion(xp) {
  const nivel = nivelDesdeXP(xp);
  const inicio = xpParaNivel(nivel);
  const fin = xpParaNivel(nivel + 1);
  const rango = rangoDeNivel(nivel);
  const enNivel = xp - inicio;
  const necesarios = Math.max(1, fin - inicio);
  return {
    xp, nivel, rango,
    xpInicioNivel: inicio,
    xpSiguienteNivel: fin,
    xpEnNivel: enNivel,
    xpRestante: Math.max(0, fin - xp),
    progreso: Math.min(1, enNivel / necesarios),
  };
}

const RANGOS = Object.freeze([
  { min: 1,   nombre: 'Semilla',              icono: '🌱', color: '#a3e635', lema: 'Todo bosque empieza aqui' },
  { min: 5,   nombre: 'Brote',                icono: '🌿', color: '#4ade80', lema: 'El habito germina' },
  { min: 10,  nombre: 'Retono',               icono: '🍃', color: '#34d399', lema: 'Ya se te nota en los datos' },
  { min: 20,  nombre: 'Arbusto',              icono: '🌾', color: '#22d3ee', lema: 'Raices firmes' },
  { min: 30,  nombre: 'Arbol joven',          icono: '🌳', color: '#38bdf8', lema: 'Empiezas a dar sombra' },
  { min: 40,  nombre: 'Arbol',                icono: '🌲', color: '#60a5fa', lema: 'Sumidero verificado' },
  { min: 55,  nombre: 'Roble',                icono: '🪵', color: '#818cf8', lema: 'Referencia para otros' },
  { min: 70,  nombre: 'Bosque',               icono: '🏞️', color: '#a78bfa', lema: 'Tu impacto ya es sistemico' },
  { min: 85,  nombre: 'Ecosistema',           icono: '🌍', color: '#c084fc', lema: 'Regeneras mas de lo que consumes' },
  { min: 100, nombre: 'Guardian del planeta', icono: '🛡️', color: '#f472b6', lema: 'Elite climatica' },
]);

function rangoDeNivel(nivel) {
  let r = RANGOS[0];
  for (const cand of RANGOS) if (nivel >= cand.min) r = cand;

}

/** Siguiente rango por alcanzar, o null si ya es el maximo. */
function siguienteRango(nivel) {
  return RANGOS.find((r) => r.min > nivel) || null;
}

/** Detecta si un incremento de XP produce subida de nivel y/o de rango. */
function detectarAscenso(xpAntes, xpDespues) {
  const a = progresion(xpAntes), d = progresion(xpDespues);
  return {
    subioNivel: d.nivel > a.nivel,
    niveles: d.nivel - a.nivel,
    subioRango: d.rango.nombre !== a.rango.nombre,
    rangoNuevo: d.rango,
    nivelNuevo: d.nivel,
  };
}

  __exp.xpParaNivel = xpParaNivel;

  __exp.RANGOS = RANGOS;
  __exp.rangoDeNivel = rangoDeNivel;
  __exp.siguienteRango = siguienteRango;
  __exp.detectarAscenso = detectarAscenso;
});

/**
 * analitica.js — Capa analitica: convierte el historial en conocimiento.
 * Construye el `resumen` que consumen logros, ranking e interfaz, y ejecuta

 */

    pruebasVerificadas: registros.filter(
      (r) => r.medio && ['fechada', 'situada', 'video'].includes(r.medio.nivel)).length,
    pruebasVideo: registros.filter((r) => r.medio?.tipo === 'video').length,
    huellaAnual: estado.huella?.totalToneladas || 0,
    registroMadrugada,
  };
}

/** Dias consecutivos con movilidad registrada y sin uso de coche particular. */
function rachaSinCoche(registros) {
  const porDia = new Map();
  for (const r of registros) {
    const a = accion(r.accionId);
    if (!a || a.cat !== 'movilidad') continue;
    const d = claveDia(new Date(r.fecha));
    const limpio = a.id !== 'mov_conduccion';
    porDia.set(d, (porDia.get(d) ?? true) && limpio);
  }
  const dias = [...porDia.keys()].sort();
  let mejor = 0, actual = 0, previo = null;
  for (const d of dias) {
    const esConsecutivo = previo && (new Date(`${d}T00:00:00`) - new Date(`${previo}T00:00:00`)) === 86400000;
    actual = porDia.get(d) ? (esConsecutivo ? actual + 1 : 1) : 0;
    if (actual > mejor) mejor = actual;
    previo = d;
  }
  return mejor;
}

/**
 * Serie temporal diaria de una metrica, rellenando los dias sin actividad con 0.
 * @param {Array} registros
 * @param {'co2e'|'agua'|'residuo'|'puntos'|'n'} metrica
 * @param {number} nDias
 */
function serieDiaria(registros, metrica = 'co2e', nDias = 30, hoy = claveDia()) {
  const dias = ultimosDias(nDias, hoy);
  const mapa = new Map(dias.map((d) => [d, 0]));
  for (const r of registros) {
    const d = claveDia(new Date(r.fecha));
    if (!mapa.has(d)) continue;
    const v = metrica === 'puntos' ? (r.puntos || 0)
      : metrica === 'n' ? 1
      : (r.impacto?.[metrica] || 0);
    mapa.set(d, mapa.get(d) + v);
  }
  return dias.map((d) => ({ dia: d, valor: redondear(mapa.get(d), 3) }));
}

/**
 * Analisis completo de una serie: descriptivos, tendencia robusta, test de
 * significacion y proyeccion. Es la pieza que da rigor a la palabra "analitica".
 */
function analizarSerie(serie, { horizonte = 30 } = {}) {
  const valores = serie.map((p) => p.valor);
  const n = valores.length;
  if (n === 0) return null;

  const ols = regresionLineal(valores);
  const ts = theilSen(valores);
  const mk = mannKendall(valores);
  const activos = valores.filter((v) => v > 0);

  const total = suma(valores);
  const mediaDiaria = media(valores);
  const proyeccion = Math.max(0, mediaDiaria * horizonte);

  // La proyeccion por tendencia usa el estimador ROBUSTO (Theil-Sen), no OLS:
  // con pocos dias activos, un unico pico dispara la recta de minimos cuadrados
  // y produce cifras absurdas que destruyen la credibilidad de la herramienta.
  const ultimo = valores[n - 1] ?? 0;
  const proyeccionTendencia = Math.max(
    0,
    suma(Array.from({ length: horizonte }, (_, i) => Math.max(0, ultimo + ts * (i + 1))))
  );

  // Una serie con menos de 7 puntos o menos de 5 dias activos no sostiene
  // ninguna extrapolacion: se declara explicitamente en vez de disimularlo.
  const fiable = n >= 7 && activos.length >= 5;

  return {
    n,
    total: redondear(total, 3),
    media: redondear(mediaDiaria, 3),
    mediana: redondear(mediana(valores), 3),
    desviacion: redondear(desviacion(valores), 3),
    coefVariacion: redondear(coefVariacion(valores), 3),
    max: Math.max(...valores),
    p90: redondear(percentil(valores, 0.9), 3),
    diasActivos: activos.length,
    tasaActividad: redondear(activos.length / n, 3),
    tendencia: {
      ols: redondear(ols.pendiente, 4),
      theilSen: redondear(ts, 4),
      r2: redondear(ols.r2, 3),
      mannKendall: { tau: redondear(mk.tau, 3), p: redondear(mk.p, 4), texto: mk.tendencia },
      direccion: ts > 0.001 ? 'al alza' : ts < -0.001 ? 'a la baja' : 'estable',
      significativa: mk.p < 0.05,
    },
    suavizado: {
      mm7: mediaMovil(valores, 7).map((v) => redondear(v, 3)),
      ewma: ewma(valores, 0.3).map((v) => redondear(v, 3)),
    },
    proyeccion: {
      horizonte,
      porMedia: redondear(proyeccion, 2),
      porTendencia: redondear(proyeccionTendencia, 2),
      fiable,
      motivo: fiable ? '' : `Serie insuficiente para extrapolar: ${activos.length} dias activos de ${n}.`,
    },
  };
}

/** Comparativa semana actual frente a la anterior (variacion porcentual). */
function compararPeriodos(registros, metrica = 'co2e', dias = 7, hoy = claveDia()) {
  const serie = serieDiaria(registros, metrica, dias * 2, hoy).map((p) => p.valor);
  const previa = suma(serie.slice(0, dias));
  const actual = suma(serie.slice(dias));
  // Sin actividad en el periodo previo no existe variacion porcentual: dar un
  // "+100 %" seria inventarse una linea base que no existe.
  const sinBase = previa === 0;
  const variacion = sinBase ? 0 : (actual - previa) / previa;
  return {
    actual: redondear(actual, 2),
    previa: redondear(previa, 2),
    variacion: redondear(variacion, 3),
    sinBase,
    mejora: actual >= previa,
  };
}

/** Distribucion por hora del dia: revela cuando actua la persona. */
function perfilHorario(registros) {
  const horas = new Array(24).fill(0);
  for (const r of registros) horas[new Date(r.fecha).getHours()] += 1;
  const total = suma(horas) || 1;
  const pico = horas.indexOf(Math.max(...horas));
  return { horas, porcentajes: horas.map((h) => redondear((h / total) * 100, 1)), pico };
}

/** Distribucion por dia de la semana (0 = lunes). */
function perfilSemanal(registros) {
  const dias = new Array(7).fill(0);
  for (const r of registros) {
    const d = new Date(r.fecha).getDay();
    dias[(d + 6) % 7] += 1;
  }
  const etiquetas = ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'];
  return { dias, etiquetas, pico: etiquetas[dias.indexOf(Math.max(...dias))] };
}

/**
 * Detecta la palanca con mayor potencial no explotado: compara el impacto medio
 * por accion de cada categoria con lo que la persona ya usa.
 */
function recomendarPalanca(resumen) {
  const usadas = new Map(resumen.porCategoria.map((c) => [c.cat, c]));
  const candidatas = Object.keys(CATEGORIAS).map((cat) => {
    const c = usadas.get(cat);
    return { cat, n: c?.n || 0, co2e: c?.co2e || 0, meta: CATEGORIAS[cat] };
  });
  const sinUsar = candidatas.filter((c) => c.n === 0);
  if (sinUsar.length) {
    return {
      cat: sinUsar[0].cat,
      meta: sinUsar[0].meta,
      motivo: `No has registrado ninguna accion de ${sinUsar[0].meta.etiqueta}. Es tu mayor margen de mejora.`,
    };
  }
  const ordenadas = [...candidatas].sort((a, b) => a.co2e - b.co2e);
  return {
    cat: ordenadas[0].cat,
    meta: ordenadas[0].meta,
    motivo: `${ordenadas[0].meta.etiqueta} es tu categoria con menor impacto acumulado (${redondear(ordenadas[0].co2e, 1)} kg CO2e).`,
  };
}

  __exp.construirResumen = construirResumen;
  __exp.serieDiaria = serieDiaria;
  __exp.analizarSerie = analizarSerie;
  __exp.compararPeriodos = compararPeriodos;
  __exp.perfilHorario = perfilHorario;
  __exp.perfilSemanal = perfilSemanal;
  __exp.recomendarPalanca = recomendarPalanca;

/**
 * logros.js (core) — Evaluacion de insignias.
 * Se ejecuta tras cada registro: compara el estado de logros guardado con la
 * evaluacion actual y devuelve los recien desbloqueados para notificarlos.
 */

  const estado = LOGROS.map((l) => {

    const [actual, objetivo] = safe(() => l.progreso(resumen), [0, 1]);

      icono: l.icono,
      nivel: l.nivel,

      meta: NIVELES_LOGRO[l.nivel],
      desbloqueado: cumple || previos.has(l.id),
      nuevo: cumple && !previos.has(l.id),

__def("src/core/evidencia.js", function (__exp, __req) {
/**
 * evidencia.js — Credibilidad de las pruebas graficas.
 *
 * Aceptar una foto sin mas no verifica nada: cualquiera descarga una imagen de
 * internet. Lo que hace creible una prueba es lo que se puede COMPROBAR sobre
 * ella, y en el navegador se puede comprobar bastante:
 *
 *   1. Metadatos EXIF: cuando y donde se tomo realmente la foto.
 *   2. Frescura: una foto de hace dos anos no prueba lo que hiciste hoy.
 *   3. Coherencia geografica: si la foto se tomo a 800 km de ti, algo falla.
 *   4. Duplicados: la trampa mas comun es reenviar la misma foto una y otra vez.
 *      Se detecta con un hash perceptual, que sobrevive al reescalado y a la
 *      recompresion, cosas que un hash criptografico no toleraria.
 *
 * Todo el modulo es puro y sin DOM: recibe datos ya extraidos y decide. Asi es
 * testeable y la parte de navegador (canvas, camara) queda aislada en ui/medios.js.
 */

/** Tipos de medio admitidos y su credibilidad base. */
const TIPOS = Object.freeze({
  foto: { etiqueta: 'Foto', icono: '📷', base: 1.10 },
  video: { etiqueta: 'Video', icono: '🎥', base: 1.25 },
});

/** Multiplicadores maximos por calidad de la prueba. */
const NIVELES_EVIDENCIA = Object.freeze({
  ninguna:     { factor: 1.00, etiqueta: 'Sin evidencia',              color: '#94a3b8' },
  debil:       { factor: 1.10, etiqueta: 'Evidencia sin metadatos',    color: '#94a3b8' },
  fechada:     { factor: 1.25, etiqueta: 'Evidencia fechada',          color: '#38bdf8' },
  situada:     { factor: 1.40, etiqueta: 'Evidencia fechada y situada', color: '#34d399' },
  video:       { factor: 1.45, etiqueta: 'Video verificado',           color: '#c084fc' },
  sospechosa:  { factor: 1.00, etiqueta: 'Evidencia no valida',        color: '#f87171' },
});

/** Antiguedad maxima de una prueba para considerarla del momento: 24 h. */
const FRESCURA_MS = 24 * 60 * 60 * 1000;

/** Distancia maxima entre la foto y la persona para considerarla coherente: 50 km. */
const RADIO_COHERENTE_KM = 50;

/** Distancia de Hamming entre dos hashes hexadecimales de igual longitud. */
function distanciaHamming(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return Infinity;
  let d = 0;
  for (let i = 0; i < a.length; i++) {
    let x = parseInt(a[i], 16) ^ parseInt(b[i], 16);
    while (x) { d += x & 1; x >>= 1; }
  }
  return d;
}

/**
 * Hash perceptual medio (aHash) de una miniatura de 8x8 en escala de grises.
 * Cada bit dice si el pixel supera la media. Sobrevive a reescalados y cambios
 * de calidad, que es justo lo que hace falta para pillar una foto reenviada.
 * @param {number[]|Uint8ClampedArray} grises 64 valores de 0 a 255
 */
function hashPercepcion(grises) {
  const v = Array.from(grises || []);
  if (v.length !== 64) return null;
  const media = v.reduce((s, x) => s + x, 0) / 64;
  let hex = '';
  for (let i = 0; i < 64; i += 4) {
    let nibble = 0;
    for (let j = 0; j < 4; j++) if (v[i + j] > media) nibble |= 1 << (3 - j);
    hex += nibble.toString(16);
  }
  return hex;
}

/** Dos imagenes se consideran la misma si difieren en 5 bits o menos de 64. */
const UMBRAL_DUPLICADO = 5;

/** Busca un duplicado perceptual entre hashes ya registrados. */
function buscarDuplicado(hash, previos = []) {
  if (!hash) return null;
  for (const p of previos) {
    const h = typeof p === 'string' ? p : p?.hash;
    if (!h) continue;
    const d = distanciaHamming(hash, h);
    if (d <= UMBRAL_DUPLICADO) return { hash: h, distancia: d, registroId: p?.registroId ?? null };
  }
  return null;
}

/** Distancia aproximada en km entre dos coordenadas (haversine). */
function kmEntre(lat1, lon1, lat2, lon2) {
  const R = 6371.0088, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;

    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;

/**
 * Evalua una prueba y devuelve el multiplicador que merece.
 *
 * @param {object} p
 * @param {'foto'|'video'} p.tipo
 * @param {{fecha?:number, lat?:number, lon?:number, marca?:string}} [p.exif]
 * @param {number} [p.fechaArchivo] marca de tiempo del archivo (respaldo del EXIF)
 * @param {string} [p.hash] hash perceptual (solo fotos)
 * @param {Array} [p.hashesPrevios] hashes ya usados por este perfil
 * @param {number} [p.ahora] momento del registro
 * @param {{lat:number, lon:number}} [p.ubicacion] posicion declarada del usuario
 * @param {number} [p.bytes] tamano del archivo
 * @param {number} [p.ancho]
 * @param {number} [p.alto]
 */
function evaluarEvidencia(p = {}) {
  const motivos = [];
  const ahora = p.ahora ?? Date.now();
  const tipo = TIPOS[p.tipo] ? p.tipo : null;

  if (!tipo) {
    return { nivel: 'ninguna', ...NIVELES_EVIDENCIA.ninguna, motivos: ['No se adjunto ninguna prueba.'], sospecha: 0, duplicado: null };
  }

  // --- Duplicado: descalifica antes que nada -------------------------------
  const duplicado = buscarDuplicado(p.hash, p.hashesPrevios);
  if (duplicado) {
    return {
      nivel: 'sospechosa', ...NIVELES_EVIDENCIA.sospechosa, duplicado, sospecha: 0.95,
      motivos: [`Esta imagen ya se uso en otro registro (diferencia de ${duplicado.distancia} bits de 64). No suma puntos extra.`],
    };
  }

  // --- Imagen demasiado pequena: probable miniatura descargada -------------
  if (p.tipo === 'foto' && Number.isFinite(p.ancho) && Number.isFinite(p.alto)
      && p.ancho > 0 && p.alto > 0 && p.ancho * p.alto < 160000) {
    motivos.push(`Resolucion baja (${p.ancho}x${p.alto}): las camaras actuales producen imagenes mucho mayores.`);
  }
