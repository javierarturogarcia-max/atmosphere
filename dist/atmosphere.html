__def("src/core/nube.js", function (__exp, __req) {
/**
 * nube.js — Sincronizacion opcional con Supabase.
 *
 * ARQUITECTURA LOCAL-FIRST. El almacen del dispositivo sigue siendo la fuente
 * de verdad: la aplicacion funciona entera sin conexion y sin cuenta, igual que
 * antes. La nube es un espejo que se activa por decision explicita del usuario
 * y sirve para lo unico que no se puede hacer en local: comparar con personas
 * reales y no perder el historial al cambiar de dispositivo.
 *
 * SIN DEPENDENCIAS. Se habla directamente con la API REST de Supabase
 * (PostgREST + GoTrue) mediante fetch, en vez de instalar @supabase/supabase-js.
 * Son cuatro llamadas HTTP: la biblioteca pesaria mas que todo este modulo y
 * romperia el empaquetador de archivo unico.
 *
 * QUE SE ENVIA Y QUE NO:
 *   - Se envian registros de accion (accion, cantidad, impacto, puntos, fecha).
 *   - NO se envian fotos ni videos: las pruebas se quedan en el dispositivo.
 *   - NO se envian coordenadas ni trazas GPS.
 *   - Los registros son PRIVADOS en el servidor: al ranking solo llegan los
 *     totales agregados del perfil.
 */

const CLAVE_CONFIG = 'atmosphere.nube.config.v1';
const CLAVE_SESION = 'atmosphere.nube.sesion.v1';
const CLAVE_SUBIDOS = 'atmosphere.nube.subidos.v1';

const almacen = (() => {
  try {
    if (typeof localStorage !== 'undefined') return localStorage;
  } catch { /* entorno sin almacenamiento */ }
  const m = new Map();
  return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, v), removeItem: (k) => m.delete(k) };
})();

const leerJSON = (clave, porDefecto) => {
  try { const v = almacen.getItem(clave); return v ? JSON.parse(v) : porDefecto; } catch { return porDefecto; }
};
const guardarJSON = (clave, valor) => {
  try { almacen.setItem(clave, JSON.stringify(valor)); return true; } catch { return false; }
};

class ErrorNube extends Error {
  constructor(mensaje, codigo = 'desconocido') { super(mensaje); this.codigo = codigo; }
}

// ============================================================== configuracion

/**
 * Detecta una clave SECRETA pegada por error donde va la publica.
 *
 * Es el error mas grave posible en esta pantalla: la clave secreta salta TODAS
 * las politicas de seguridad por fila, asi que publicarla en un sitio estatico
 * daria control total de la base a cualquiera que abra el codigo fuente.
 * Se comprueban las dos formas que existen: el prefijo del formato nuevo y el
 * rol dentro del JWT del formato antiguo.
 */
function esClaveSecreta(clave) {
  const k = String(clave || '');
  if (/^sb_secret_/i.test(k)) return 'formato nuevo (sb_secret_)';
  const partes = k.split('.');
  if (partes.length === 3) {
    try {
      const carga = JSON.parse(atob(partes[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (carga?.role === 'service_role') return 'JWT con rol service_role';
    } catch { /* no es un JWT legible */ }
  }
  return null;
}

/**
 * Guarda la URL del proyecto y la clave publica.
 *
 * Se admiten los dos formatos que convivien: el nuevo `sb_publishable_...` y el
 * antiguo JWT `eyJ...` (la clave "anon"), que Supabase mantiene por
 * compatibilidad. Ambos son publicos por diseno: viven en el navegador y lo que
 * protege los datos son las politicas RLS, no ocultar la clave.
 */
function configurar({ url, anonKey }) {
  const u = String(url || '').trim().replace(/\/+$/, '');
  let k = String(anonKey || '').trim().replace(/\s+/g, '');

  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)) {
    throw new ErrorNube('La URL debe tener la forma https://xxxxx.supabase.co', 'url');
  }

  const secreta = esClaveSecreta(k);
  if (secreta) {
    throw new ErrorNube(
      `Eso es una clave SECRETA (${secreta}), no la publica. Publicarla daria control total `
      + 'de tu base de datos a cualquiera. Usa la "Publishable key" de Settings -> API Keys.',
      'clave_secreta');
  }

  // Pegar la clave dos veces seguidas es un accidente frecuente al copiar.
  if (k.length % 2 === 0 && k.length > 20 && k.slice(0, k.length / 2) === k.slice(k.length / 2)) {
    k = k.slice(0, k.length / 2);
  }

  const esNueva = /^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(k);
  const esJWT = /^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(k);
  if (!esNueva && !esJWT) {
    throw new ErrorNube(
      'La clave no tiene un formato reconocible. Debe empezar por "sb_publishable_" '
      + '(formato actual) o por "eyJ" (clave anon antigua).',
      'clave');
  }

  guardarJSON(CLAVE_CONFIG, { url: u, anonKey: k });
  return { url: u, formato: esNueva ? 'publishable' : 'anon-jwt' };
}

function configuracion() { return leerJSON(CLAVE_CONFIG, null); }
function estaConfigurada() { return !!configuracion(); }
function sesion() { return leerJSON(CLAVE_SESION, null); }
function haySesion() { const s = sesion(); return !!(s && s.access_token && s.perfilId); }

function desconectar() {
  almacen.removeItem(CLAVE_SESION);
  almacen.removeItem(CLAVE_SUBIDOS);
}

function olvidarTodo() {
  desconectar();
  almacen.removeItem(CLAVE_CONFIG);
}

// ================================================================== transporte

async function llamar(ruta, { metodo = 'GET', cuerpo = null, autenticado = true, cabeceras = {} } = {}) {
  const cfg = configuracion();
  if (!cfg) throw new ErrorNube('La nube no esta configurada.', 'sin_configurar');

  const s = sesion();
  // La clave publica va SOLO en la cabecera `apikey`. Las claves del formato
  // nuevo no son JWT, asi que mandarlas tambien como `Authorization: Bearer`
  // —cosa que hacen muchos clientes por defecto— haria que el servidor
  // intentase interpretarlas como JWT y rechazase la peticion con "Invalid JWT".
  // En `Authorization` solo viaja el token de sesion del usuario.
  const h = {
    apikey: cfg.anonKey,
    'Content-Type': 'application/json',
    ...cabeceras,
  };
  if (autenticado) {
    if (!s?.access_token) throw new ErrorNube('No has iniciado sesion.', 'sin_sesion');
    h.Authorization = `Bearer ${s.access_token}`;
  }

  let res;
  try {
    res = await fetch(`${cfg.url}${ruta}`, {
      method: metodo,
      headers: h,
      body: cuerpo === null ? undefined : JSON.stringify(cuerpo),
    });
  } catch {
    throw new ErrorNube('Sin conexion con el servidor.', 'red');
  }

  if (res.status === 401 || res.status === 403) {
    throw new ErrorNube('La sesion ha caducado. Vuelve a entrar.', 'sesion_caducada');
  }
  const texto = await res.text();
  let datos = null;
  if (texto) { try { datos = JSON.parse(texto); } catch { datos = texto; } }

  if (!res.ok) {
    const msg = datos?.message || datos?.error_description || datos?.msg || `Error ${res.status}`;
    throw new ErrorNube(msg, res.status >= 500 ? 'servidor' : 'peticion');
  }
  return datos;
}

// ==================================================================== cuenta

async function crearCuenta(email, contrasena, { nombre = 'Guardian', pais = 'WW' } = {}) {
  const datos = await llamar('/auth/v1/signup', {
    metodo: 'POST', autenticado: false,
    cuerpo: { email, password: contrasena, data: { nombre, pais } },
  });
  // Con confirmacion por correo activada, todavia no hay token.
  if (datos?.access_token) {
    guardarJSON(CLAVE_SESION, { access_token: datos.access_token, refresh_token: datos.refresh_token, perfilId: datos.user?.id, email });
    return { ok: true, confirmacionPendiente: false };
  }
  return { ok: true, confirmacionPendiente: true };
}

async function entrar(email, contrasena) {
  const datos = await llamar('/auth/v1/token?grant_type=password', {
    metodo: 'POST', autenticado: false,
    cuerpo: { email, password: contrasena },
  });
  if (!datos?.access_token) throw new ErrorNube('Credenciales incorrectas.', 'credenciales');
  guardarJSON(CLAVE_SESION, {
    access_token: datos.access_token, refresh_token: datos.refresh_token,
    perfilId: datos.user?.id, email,
  });
  return { perfilId: datos.user?.id };
}

// ============================================================ sincronizacion

/**
 * Registros locales que aun no se han subido.
 * Funcion pura para poder probarla sin red.
 */
function pendientesDeSubir(registrosLocales, idsSubidos) {
  const ya = new Set(idsSubidos || []);
  return (registrosLocales || []).filter((r) => r && r.id && !ya.has(r.id));
}

/**
 * Traduce un registro local a la fila que espera la base de datos.
 * Deja fuera a proposito la prueba grafica, la nota y cualquier coordenada:
 * al servidor solo va lo que necesita el ranking.
 */
function aFilaRegistro(registro, categoria, perfilId) {
  return {
    id: registro.id,
    perfil_id: perfilId,
    accion_id: registro.accionId,
    categoria: categoria || 'otras',
    cantidad: Number(registro.cantidad) || 0,
    unidad: registro.unidad || 'ud',
    co2e: Number(registro.impacto?.co2e) || 0,
    agua: Number(registro.impacto?.agua) || 0,
    residuo: Number(registro.impacto?.residuo) || 0,
    puntos: Math.max(0, Math.round(Number(registro.puntos) || 0)),
    evidencia: registro.evidencia || null,
    nivel_evidencia: registro.medio?.nivel || null,
    fecha: registro.fecha,
  };
}

/** Divide una lista en lotes, para no enviar miles de filas de golpe. */
function enLotes(items, tamano = 100) {
  const lotes = [];
  for (let i = 0; i < items.length; i += tamano) lotes.push(items.slice(i, i + tamano));
  return lotes;
}

function idsSubidos() { return leerJSON(CLAVE_SUBIDOS, []); }
function marcarSubidos(ids) {
  guardarJSON(CLAVE_SUBIDOS, [...new Set([...idsSubidos(), ...ids])]);
}

/**
 * Sube los registros pendientes y devuelve el perfil recalculado por el servidor.
 * @param {Array} registros registros locales
 * @param {(id:string)=>string} categoriaDe funcion que da la categoria de una accion
 */
async function sincronizar(registros, categoriaDe) {
  const s = sesion();
  if (!s?.perfilId) throw new ErrorNube('No has iniciado sesion.', 'sin_sesion');

  const pendientes = pendientesDeSubir(registros, idsSubidos());
  let subidos = 0;
  const rechazados = [];

  for (const lote of enLotes(pendientes, 100)) {
    const filas = lote.map((r) => aFilaRegistro(r, categoriaDe(r.accionId), s.perfilId));
    try {
      // merge-duplicates hace la subida idempotente: reenviar tras un corte de
      // red no duplica nada, porque la clave primaria es el id del dispositivo.
      await llamar('/rest/v1/registros', {
        metodo: 'POST', cuerpo: filas,
        cabeceras: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      });
      marcarSubidos(lote.map((r) => r.id));
      subidos += lote.length;
    } catch (e) {
      rechazados.push({ n: lote.length, motivo: e.message });
    }
  }

  const perfil = await miPerfil();
  return { subidos, pendientes: pendientes.length - subidos, rechazados, perfil };
}

/** Perfil propio, con los totales que ha calculado el servidor. */
async function miPerfil() {
  const s = sesion();
  const filas = await llamar(`/rest/v1/perfiles?id=eq.${s.perfilId}&select=*`);
  return Array.isArray(filas) ? filas[0] || null : null;
}

/** Cambia los unicos campos que el cliente tiene permiso de escribir. */
async function actualizarPerfil({ nombre, pais, publico }) {
  const s = sesion();
  const cambios = {};
  if (nombre !== undefined) cambios.nombre = nombre;
  if (pais !== undefined) cambios.pais = pais;
  if (publico !== undefined) cambios.publico = publico;
  if (!Object.keys(cambios).length) return null;
  return llamar(`/rest/v1/perfiles?id=eq.${s.perfilId}`, {
    metodo: 'PATCH', cuerpo: cambios, cabeceras: { Prefer: 'return=representation' },
  });
}

// ======================================================================= social

async function rankingGlobal(limite = 50) {
  return llamar(`/rest/v1/ranking_global?select=*&limit=${Math.min(200, limite)}`);
}

async function impactoComunidad() {
  const filas = await llamar('/rest/v1/impacto_comunidad?select=*');
  return Array.isArray(filas) ? filas[0] || null : null;
}

async function misGrupos() {
  const s = sesion();
  return llamar(`/rest/v1/miembros?perfil_id=eq.${s.perfilId}&select=rol,unido,grupos(id,nombre,codigo,tipo)`);
}

async function rankingGrupo(grupoId) {
  return llamar(`/rest/v1/ranking_grupos?grupo_id=eq.${grupoId}&select=*`);
}

/** Codigo de grupo legible: 6 caracteres sin los que se confunden (0/O, 1/I). */
function generarCodigo(rnd = Math.random) {
  const alfabeto = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += alfabeto[Math.floor(rnd() * alfabeto.length)];
  return c;
}

async function crearGrupo(nombre, tipo = 'clase') {
  const s = sesion();
  const codigo = generarCodigo();
  const creado = await llamar('/rest/v1/grupos', {
    metodo: 'POST', cuerpo: { nombre, codigo, tipo, creador: s.perfilId },
    cabeceras: { Prefer: 'return=representation' },
  });
  const grupo = Array.isArray(creado) ? creado[0] : creado;
  await llamar('/rest/v1/miembros', {
    metodo: 'POST', cuerpo: { grupo_id: grupo.id, perfil_id: s.perfilId, rol: 'gestor' },
    cabeceras: { Prefer: 'return=minimal' },
  });
  return grupo;
}

async function unirseAGrupo(codigo) {
  return llamar('/rest/v1/rpc/unirse_por_codigo', {
    metodo: 'POST', cuerpo: { p_codigo: String(codigo || '').toUpperCase().trim() },
  });
}

/**
 * Mezcla el ranking del servidor con el perfil propio y calcula la posicion.
 * Pura: se puede probar sin red.
 */
function situarEnRanking(filas, miId) {
  const tabla = [...(filas || [])]
    .sort((a, b) => (b.puntos || 0) - (a.puntos || 0))
    .map((f, i) => ({ ...f, posicion: i + 1, esUsuario: f.id === miId }));
  const yo = tabla.find((f) => f.esUsuario) || null;
  const siguiente = yo && yo.posicion > 1 ? tabla[yo.posicion - 2] : null;
  return {
    tabla,
    posicion: yo?.posicion ?? null,
    total: tabla.length,
    faltanParaSubir: siguiente && yo ? Math.max(0, (siguiente.puntos || 0) - (yo.puntos || 0) + 1) : 0,
  };
}

__def("src/ui/vistas/nube.js", function (__exp, __req) {
/** nube.js — Sincronizacion opcional, grupos y ranking con personas reales. */
const { el, num, co2, litros, toast, modal, tarjetaMetrica, vacio, esc } = __req("src/ui/componentes.js");
const api = __req("src/core/nube.js");
const { accion } = __req("src/data/acciones.js");

let vistaGrupo = null;

function vistaNube(ctx) {
  const raiz = el('div');
  const cuerpo = el('div');

  raiz.appendChild(el('h1', { texto: 'Nube y grupos' }));
  raiz.appendChild(el('p', { clase: 'sub',
    texto: 'Opcional y desactivada por defecto. La app funciona entera sin cuenta: esto solo anade lo que en local es imposible, comparar con personas reales y no perder el historial al cambiar de movil. Tus fotos, notas y coordenadas nunca se envian.' }));

// ---------------------------------------------------------------- paso 1

      el('li', { texto: 'Crea una cuenta gratuita en supabase.com y un proyecto nuevo.' }),
      el('li', { texto: 'Abre SQL Editor, pega el contenido de db/esquema.sql del repositorio y pulsa Run.' }),
      el('li', { texto: 'Ve a Project Settings → API Keys y copia la URL del proyecto y la "Publishable key" (empieza por sb_publishable_). Si tu proyecto aun usa el formato antiguo, es la clave "anon public" que empieza por eyJ.' }),

      }),

    el('div', { clase: 'aviso info', estilo: 'margin-top:15px' }, [
      el('span', { texto: '🔑' }),
      el('div', { texto: 'La clave publica esta pensada para vivir en el navegador: no es un secreto. Lo que protege los datos son las politicas de seguridad por fila del esquema, no ocultar la clave. La clave SECRETA (sb_secret_ o service_role) no se acepta aqui: la app la detecta y la rechaza, porque publicarla daria control total de tu base de datos.' }),

// ---------------------------------------------------------------- paso 2

// ---------------------------------------------------------------- paso 3
async function paso3Panel(cuerpo, repintar, ctx) {
  const estado = ctx.almacen.get();
  const cargando = el('div', { clase: 'tarjeta pulso', texto: 'Consultando el servidor...' });
  cuerpo.appendChild(cargando);

  let perfil = null; let comunidad = null; let grupos = []; let ranking = [];
  const errores = [];
  const intentar = async (fn, nombre) => {
    try { return await fn(); } catch (e) { errores.push(`${nombre}: ${e.message}`); return null; }
  };

  perfil = await intentar(api.miPerfil, 'perfil');
  comunidad = await intentar(api.impactoComunidad, 'comunidad');
  grupos = (await intentar(api.misGrupos, 'grupos')) || [];
  ranking = (await intentar(() => api.rankingGlobal(50), 'ranking')) || [];
  cargando.remove();

  if (errores.length) {
    cuerpo.appendChild(el('div', { clase: 'aviso alerta seccion' }, [
      el('span', { texto: '⚠️' }),
      el('div', {}, [
        el('strong', { texto: 'Algunas consultas fallaron' }),
        el('div', { clase: 'mini', estilo: 'margin-top:3px;color:inherit', texto: errores.join(' · ') }),
        el('div', { clase: 'mini', estilo: 'margin-top:3px;color:inherit;opacity:.8',
          texto: 'Si es la primera vez, comprueba que ejecutaste db/esquema.sql entero en el editor SQL.' }),
      ]),
    ]));
  }

  // ------------------------------------------------------------- sincronizar
  const pendientes = api.pendientesDeSubir(estado.registros, []).length;
  cuerpo.appendChild(el('div', { clase: 'rejilla c4 seccion' }, [
    tarjetaMetrica({ etiqueta: 'Registros locales', valor: num(estado.registros.length), icono: '📱' }),
    tarjetaMetrica({ etiqueta: 'En el servidor', valor: num(perfil?.registros_n ?? 0), icono: '☁️',
      color: 'var(--cian)', pie: perfil ? `${num(perfil.puntos)} puntos verificados` : 'sin datos' }),
    tarjetaMetrica({ etiqueta: 'CO2e sincronizado', valor: co2(perfil?.co2e_total ?? 0), icono: '🌬️', color: 'var(--verde)' }),
    tarjetaMetrica({ etiqueta: 'Comunidad', valor: num(comunidad?.participantes ?? 0), icono: '👥',
      pie: comunidad ? `${co2(comunidad.co2e_total || 0)} entre todos` : '' }),
  ]));

  cuerpo.appendChild(el('div', { clase: 'tarjeta seccion' }, [
    el('div', { clase: 'fila entre envuelve', estilo: 'gap:11px' }, [
      el('div', {}, [
        el('h2', { estilo: 'margin:0 0 3px', texto: 'Sincronizacion' }),
        el('div', { clase: 'mini', texto: `Sesion: ${esc(api.sesion()?.email || '')}` }),
      ]),
      el('div', { clase: 'fila', estilo: 'gap:7px' }, [
        el('button', {
          clase: 'btn primario', texto: '☁️ Sincronizar ahora',
          onclick: async (e) => {
            e.target.disabled = true; e.target.textContent = 'Subiendo...';

              });
              repintar();

              toast({ titulo: 'No se pudo sincronizar', texto: err.message, tipo: 'error', icono: '⛔' });
              e.target.disabled = false; e.target.textContent = '☁️ Sincronizar ahora';
            }
          },
        }),
        el('button', { clase: 'btn peligro s', texto: 'Cerrar sesion', onclick: () => { api.desconectar(); repintar(); } }),

  const r = api.situarEnRanking(filas, miId);

            el('th', { texto: 'Puntos' }), el('th', { texto: 'CO2e' }), el('th', { texto: 'Dias' }),

}

__def("src/ui/descargas.js", function (__exp, __req) {
/**
 * descargas.js — Entrega de archivos al usuario en cualquier entorno.
 *
 * La app corre en tres sitios distintos y solo uno admite el truco clasico
 * del enlace <a download>:
 *   - servida por http o abierta como archivo local -> enlace con Blob
 *   - publicada como Artifact -> el visor bloquea las descargas iniciadas por
 *     la pagina; hay que pasar por la capacidad `downloads`, que ademas pide
 *     confirmacion al usuario y puede ser rechazada.
 * Este modulo detecta el entorno y usa la via que funcione, sin que las vistas
 * tengan que saber nada de eso.
 */

/** Extensiones que el visor de Artifacts admite siempre. */
const EXTENSIONES_BASE = new Set(['txt', 'json', 'md', 'csv']);

async function capacidadDescargas() {
  try {
    if (typeof window === 'undefined' || !window.claude || typeof window.claude.use !== 'function') return null;
    return await window.claude.use('downloads');
  } catch {
    return null;
  }
}

/**
 * Entrega un archivo generado.
 * @param {{nombre:string, contenido:string|Blob, tipo?:string}} args
 * @returns {Promise<{ok:boolean, via:string, motivo?:string}>}
 */
async function descargar({ nombre, contenido, tipo = 'text/plain;charset=utf-8' }) {
  const dl = await capacidadDescargas();

  if (dl) {
    try {
      await dl.save({ filename: nombre, data: contenido });
      return { ok: true, via: 'artifact' };
    } catch (e) {
      const codigo = e?.code || 'unavailable';
      if (codigo === 'declined') return { ok: false, via: 'artifact', motivo: 'Descarga cancelada.' };
      if (codigo === 'extension_not_enabled') {
        // El visor no admite esta extension: se ofrece el mismo contenido
        // como texto plano en vez de dejar al usuario sin nada.
        try {
          await dl.save({ filename: nombre.replace(/\.[^.]+$/, '.txt'), data: contenido });
          return { ok: true, via: 'artifact-txt' };
        } catch {
          return { ok: false, via: 'artifact', motivo: 'Este visor no admite ese tipo de archivo.' };
        }
      }
      if (codigo === 'too_large') return { ok: false, via: 'artifact', motivo: 'El archivo supera el limite de 16 MB.' };
      if (codigo === 'rate_limited') return { ok: false, via: 'artifact', motivo: 'Hay otra descarga en curso. Intentalo de nuevo en unos segundos.' };
      return { ok: false, via: 'artifact', motivo: 'Las descargas no estan disponibles en este visor.' };
    }
  }

  // Entorno normal: enlace con Blob.
  try {
    const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return { ok: true, via: 'blob' };
  } catch (e) {
    return { ok: false, via: 'blob', motivo: 'No se pudo generar el archivo.' };
  }
}

/** Indica si la vista actual puede entregar archivos. */
async function hayDescargas() {
  if (await capacidadDescargas()) return true;
  return typeof document !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function';
}

  __exp.descargar = descargar;
  __exp.hayDescargas = hayDescargas;
});

// Registro del service worker para uso sin conexion. Solo se intenta en el
// despliegue completo (el que incluye manifiesto): la version empaquetada en un
// unico archivo no tiene sw.js al lado y pedirlo daria un 404 inutil.
const hayManifiesto = !!document.querySelector('link[rel="manifest"]');
if (hayManifiesto && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((registro) => {
      // Si aparece una version nueva mientras la pestana esta abierta, se
      // activa y se recarga una sola vez. Sin esto, el usuario podria seguir
      // ejecutando codigo antiguo sin enterarse.
      registro.addEventListener('updatefound', () => {
        const nuevo = registro.installing;
        if (!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
            nuevo.postMessage('actualizar');
          }
        });
      });
      registro.update().catch(() => {});
    }).catch(() => { /* sin PWA, la app sigue funcionando */ });

    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargado) return;
      recargado = true;
      location.reload();
    });
  });
}
